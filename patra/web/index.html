<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6e4e">
<title>PATRA</title>
<style>
  /* Laid out like the apps this audience already uses: a fixed top bar, a
     scrolling body of cards, a bottom tab bar, one floating action button.
     DigiLocker and UMANG both settled on that shape, and both get criticised
     for cramming every screen, so the rule here is one job per screen.

     Colour is saturated rather than pastel because these phones get used
     outdoors. Green for what you can claim, amber for what is one errand
     away, red only for a real stop. */
  :root {
    --green:#0a6e4e; --green-soft:#e7f3ed;
    --amber:#b1600b; --amber-soft:#fdf3e3;
    --red-soft:#fbeceb;
    --ink:#1a1d21; --grey:#5a6570; --line:#e2e6ea;
    --bg:#f5f6f8; --card:#fff; --bar-h:62px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
    font-size:17px; line-height:1.55;
  }
  body { padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom)); }

  .bar {
    position:sticky; top:0; z-index:20; background:var(--green); color:#fff;
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
  }
  .bar h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:.5px; }
  .bar .sub { font-size:13px; opacity:.85; color:#fff; }
  .bar .lang {
    margin-left:auto; background:rgba(255,255,255,.16); color:#fff; border:0;
    border-radius:999px; padding:8px 14px; font:inherit; font-size:14px;
    width:auto; cursor:pointer; margin-bottom:0;
  }

  .body { max-width:620px; margin:0 auto; padding:14px 14px 24px; }
  .card { background:var(--card); border-radius:16px; padding:18px;
          margin-bottom:12px; box-shadow:0 1px 2px rgba(20,30,40,.06); }
  .card h2 { margin:0 0 4px; font-size:19px; }
  .card h3 { margin:0 0 3px; font-size:17px; }
  .sub { color:var(--grey); font-size:15px; }
  .mt { margin-top:12px; }

  button {
    font:inherit; cursor:pointer; display:block; width:100%; text-align:left;
    padding:15px 16px; margin-bottom:10px; border:1.5px solid var(--line);
    border-radius:13px; background:var(--card); color:var(--ink);
  }
  button:active { transform:scale(.985); }
  .cta { background:var(--green); color:#fff; border-color:var(--green);
         text-align:center; font-weight:700; font-size:18px; padding:17px; }
  .ghost { text-align:center; color:var(--grey); background:transparent;
           border-style:dashed; }
  .pair { display:flex; gap:10px; }
  .pair button { margin-bottom:0; }

  .opt { display:flex; align-items:center; gap:13px; }
  .opt .pic { font-size:27px; line-height:1; width:34px; text-align:center; }
  .opt.on { border-color:var(--green); background:var(--green-soft); }
  .opt.on::after { content:"✓"; margin-left:auto; color:var(--green);
                   font-weight:800; font-size:20px; }

  .track { display:flex; gap:4px; margin-bottom:16px; }
  .track i { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .track i.on { background:var(--green); }
  .qtext { font-size:23px; font-weight:700; line-height:1.35; margin:0 0 6px; }
  .qwhy { color:var(--amber); font-size:14px; margin:0 0 12px; }
  .hear { width:auto; padding:9px 15px; margin:0 0 16px; font-size:15px;
          border-radius:999px; color:var(--green); border-color:#bfded0;
          background:var(--green-soft); }
  input[type=number], input[type=text] {
    font:inherit; font-size:22px; width:100%; padding:15px;
    border:1.5px solid var(--line); border-radius:13px; margin-bottom:10px;
  }
  input[type=number] { text-align:center; }

  .row { display:flex; gap:12px; padding:13px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .row .tag { flex:none; width:34px; height:34px; border-radius:10px;
              display:grid; place-items:center; font-size:17px; }
  .tag.ok { background:var(--green-soft); }
  .tag.near { background:var(--amber-soft); }
  .row .txt { min-width:0; }
  .row .txt b { display:block; font-size:17px; }

  .note { border-radius:11px; padding:11px 13px; font-size:15px; margin-top:9px; }
  .note.ok { background:var(--green-soft); }
  .note.warn { background:var(--amber-soft); }
  .note.stop { background:var(--red-soft); }

  ol.route { list-style:none; counter-reset:r; padding:0; margin:6px 0 0; }
  ol.route li { counter-increment:r; position:relative; padding:0 0 18px 44px; }
  ol.route li::before {
    content:counter(r); position:absolute; left:0; top:0; width:30px; height:30px;
    border-radius:50%; background:var(--green); color:#fff;
    display:grid; place-items:center; font-weight:700; font-size:15px;
  }
  ol.route li::after { content:""; position:absolute; left:14.5px; top:32px;
                       bottom:6px; width:1.5px; background:var(--line); }
  ol.route li:last-child::after { display:none; }

  details.work { border-top:1px solid var(--line); margin-top:12px; padding-top:10px; }
  details.work summary { cursor:pointer; color:var(--green); font-weight:600;
                         font-size:15px; list-style:none; }
  details.work summary::-webkit-details-marker { display:none; }
  details.work summary::before { content:"🔍 "; }
  .step { border-left:2px solid var(--line); margin:10px 0 0 6px; padding:0 0 2px 14px; }
  .step .how { font-size:13px; color:var(--green); font-weight:700;
               text-transform:uppercase; letter-spacing:.4px; }
  .step .what { font-size:15px; }
  .step .bits { font-size:14px; color:var(--grey); }
  .step .bits div { padding:1px 0; }
  .qc { font-size:13px; color:var(--grey); font-style:italic; }

  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex;
          background:var(--card); border-top:1px solid var(--line);
          padding-bottom:env(safe-area-inset-bottom); }
  .tabs button { flex:1; margin:0; border:0; border-radius:0; background:none;
                 text-align:center; padding:8px 4px; color:var(--grey);
                 font-size:12px; line-height:1.25; }
  .tabs button .ic { display:block; font-size:21px; margin-bottom:1px; }
  .tabs button.on { color:var(--green); font-weight:700; }

  .fab { position:fixed; right:16px; z-index:25; width:58px; height:58px;
         bottom:calc(var(--bar-h) + 16px + env(safe-area-inset-bottom));
         border-radius:50%; border:0; padding:0; margin:0; background:var(--green);
         color:#fff; font-size:25px; box-shadow:0 4px 14px rgba(10,110,78,.4);
         display:grid; place-items:center; }
  .sheet { position:fixed; inset:0; z-index:40; background:var(--bg);
           display:flex; flex-direction:column; }
  .sheet .bar { position:static; }
  .sheet .log { flex:1; overflow-y:auto; padding:14px; }
  .sheet .compose { display:flex; gap:8px; padding:10px 12px;
                    padding-bottom:calc(10px + env(safe-area-inset-bottom));
                    background:var(--card); border-top:1px solid var(--line); }
  .sheet .compose input { margin:0; font-size:17px; }
  .sheet .compose button { width:auto; margin:0; padding:0 20px; }
  .bubble { max-width:86%; padding:11px 14px; border-radius:15px;
            margin-bottom:10px; font-size:16px; }
  .bubble.me { margin-left:auto; background:var(--green); color:#fff;
               border-bottom-right-radius:4px; }
  .bubble.it { background:var(--card); border:1px solid var(--line);
               border-bottom-left-radius:4px; }
  .bubble.it b { display:block; margin-bottom:3px; }
  .bubble.it .li { font-size:15px; color:var(--grey); padding:2px 0; }
  .chip { display:inline-block; width:auto; margin:4px 6px 0 0; padding:8px 13px;
          font-size:14px; border-radius:999px; background:var(--card); }
  .empty { text-align:center; color:var(--grey); padding:34px 16px; }
  .hide { display:none !important; }

  @media print {
    body { background:#fff; padding:0; }
    .bar,.tabs,.fab,button,details.work { display:none !important; }
    .card { box-shadow:none; border:1px solid #ccc; page-break-inside:avoid; }
  }
</style>
</head>
<body>

<header class="bar">
  <div>
    <h1 id="brand">PATRA</h1>
    <div class="sub" id="tagline"></div>
  </div>
  <button class="lang hide" id="lang-btn"></button>
</header>

<main class="body" id="view"></main>

<button class="fab hide" id="fab" aria-label="Help">💬</button>

<nav class="tabs hide" id="tabs">
  <button data-tab="home" class="on"><span class="ic">🏠</span><span id="tab-home"></span></button>
  <button data-tab="papers"><span class="ic">📋</span><span id="tab-papers"></span></button>
  <button data-tab="help"><span class="ic">❓</span><span id="tab-help"></span></button>
</nav>

<div class="sheet hide" id="chat">
  <header class="bar">
    <div><h1 id="chat-title"></h1><div class="sub" id="chat-sub"></div></div>
    <button class="lang" id="chat-close">✕</button>
  </header>
  <div class="log" id="chat-log"></div>
  <div class="compose">
    <input type="text" id="chat-in" autocomplete="off">
    <button class="cta" id="chat-send">→</button>
  </div>
</div>

<script>
"use strict";

/* Concrete objects, not abstract glyphs. The research on low-literate users is
   blunt: a stylised symbol carries no meaning, a recognisable thing does. */
const PIC = {
  aadhaar:"🪪", voter_id:"🗳️", pan_card:"💳", ration_card:"🍚",
  birth_certificate:"👶", school_certificate:"🎓", electricity_bill:"💡",
  domicile_certificate:"🏠", income_certificate:"💰", caste_certificate:"📜",
  bank_account:"🏦", bank_aadhaar_seeding:"🔗", disability_certificate:"♿",
  death_certificate:"🕯️", land_records:"🌾", job_card:"⛏️", passport_photo:"📷"
};

const S = {
  lang:"en", speech:"en-IN", words:{}, langs:[],
  facts:{}, order:[], held:new Set(), asked:0,
  result:null, tab:"home"
};
const KEY = "patra.lang";

const $  = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const show = (id) => $(id).classList.remove("hide");
const hide = (id) => $(id).classList.add("hide");

function t(path, vars) {
  let n = S.words;
  for (const k of path.split(".")) {
    if (!n || typeof n !== "object" || !(k in n)) return "";
    n = n[k];
  }
  let out = String(n ?? "");
  if (vars) for (const [k, v] of Object.entries(vars)) out = out.split("{"+k+"}").join(v);
  return out;
}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({...body, lang:S.lang})
  } : {});
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

/* Voice uses the browser's own synthesiser, so it needs no network and no
   model. Where a language has no voice installed the button is simply quiet,
   which is why text is never replaced by audio. */
function bestVoice() {
  const want = S.speech.toLowerCase();
  const all = speechSynthesis.getVoices();
  return all.find(v => v.lang && v.lang.toLowerCase() === want)
      || all.find(v => v.lang && v.lang.toLowerCase().startsWith(want.slice(0,2)))
      || null;
}

function say(text) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const voice = bestVoice();
  // One utterance per clause. The browser voice is what it is, but reading a
  // long sentence as a single breathless run is most of what makes it hard to
  // follow, and splitting on punctuation fixes that much.
  String(text).split(/(?<=[.!?।])\s+|,\s+/).filter(Boolean).forEach(part => {
    const u = new SpeechSynthesisUtterance(part.trim());
    u.lang = S.speech; u.rate = .85; u.pitch = 1.0;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  });
}

function view() { const v = $("view"); v.innerHTML = ""; return v; }

function offline() {
  const v = view();
  const c = el("div","card");
  c.appendChild(el("h2", null, t("ui.error_title") || "Cannot reach the app"));
  c.appendChild(el("p","sub", t("ui.error_offline") ||
    'Open a terminal, run "python3 -m patra.web.server", then open http://127.0.0.1:8765'));
  v.appendChild(c);
}

/* ---------- language ---------- */

async function boot() {
  try { S.langs = await api("/api/languages"); }
  catch { return offline(); }
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  const found = S.langs.find(l => l.code === saved);
  if (found) return pickLanguage(found);
  languageScreen();
}

function languageScreen() {
  hide("tabs"); hide("fab");
  const v = view();
  const c = el("div","card");
  c.appendChild(el("h2", null, "भाषा चुनें  ·  Choose your language"));
  c.appendChild(el("p","sub","अपनी भाषा पर दबाएँ"));
  const box = el("div","mt");
  S.langs.forEach(l => {
    const b = el("button", null);
    b.style.fontSize = "21px";
    b.textContent = l.name + (l.complete ? "" : "  ·  incomplete");
    if (!l.complete) b.style.color = "var(--grey)";
    b.onclick = () => pickLanguage(l);
    box.appendChild(b);
  });
  c.appendChild(box);
  v.appendChild(c);
}

async function pickLanguage(l) {
  S.lang = l.code; S.speech = l.speech || l.code;
  try { localStorage.setItem(KEY, l.code); } catch {}
  S.words = await api("/api/strings?lang=" + l.code);
  document.documentElement.lang = l.code;

  $("brand").textContent      = t("ui.title") || "PATRA";
  $("tagline").textContent    = t("ui.tagline");
  $("tab-home").textContent   = t("ui.tab_home")   || "Claims";
  $("tab-papers").textContent = t("ui.tab_papers") || "Papers";
  $("tab-help").textContent   = t("ui.tab_help")   || "Help";
  $("chat-title").textContent = t("ui.chat_title") || "Ask a question";
  $("chat-sub").textContent   = t("ui.chat_sub")   || "";
  $("chat-in").placeholder    = t("ui.chat_hint")  || "Type your question";

  const b = $("lang-btn");
  b.textContent = "🌐 " + l.name;
  b.classList.remove("hide");
  b.onclick = languageScreen;

  show("tabs"); show("fab");
  S.facts = {}; S.order = []; S.held = new Set(); S.asked = 0; S.result = null;
  go("home");
}

/* ---------- tabs ---------- */

document.querySelectorAll(".tabs button").forEach(b =>
  b.onclick = () => go(b.dataset.tab));

function go(tab) {
  S.tab = tab;
  document.querySelectorAll(".tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === tab));
  window.scrollTo(0,0);
  if (tab === "home")   return S.result ? renderResult() : startScreen();
  if (tab === "papers") return papersTab();
  if (tab === "help")   return helpTab();
}

/* ---------- start ---------- */

function startScreen() {
  const v = view();
  const c = el("div","card");
  c.appendChild(el("h2", null, t("ui.docs_title")));
  c.appendChild(el("p","sub", t("ui.docs_help")));
  const box = el("div","mt");
  c.appendChild(box);
  const go_ = el("button","cta", t("ui.start"));
  go_.onclick = ask;
  c.appendChild(go_);
  v.appendChild(c);

  const priv = el("div","note ok");
  priv.textContent = t("ui.privacy");
  v.appendChild(priv);

  api("/api/documents?lang=" + S.lang).then(docs => {
    docs.forEach(d => {
      const b = el("button","opt");
      b.appendChild(el("span", null, d.name));
      if (S.held.has(d.id)) b.classList.add("on");
      b.onclick = () => {
        if (S.held.has(d.id)) { S.held.delete(d.id); b.classList.remove("on"); }
        else { S.held.add(d.id); b.classList.add("on"); say(d.name); }
      };
      box.appendChild(b);
    });
  }).catch(offline);
}

/* ---------- questions ---------- */

async function ask() {
  let data;
  try { data = await api("/api/question", {facts:S.facts}); }
  catch { return offline(); }
  const q = data.question;
  if (!q) return finish();

  const v = view();
  const c = el("div","card");

  const track = el("div","track");
  for (let i = 0; i < 10; i++) {
    const seg = el("i"); if (i < S.asked) seg.className = "on"; track.appendChild(seg);
  }
  c.appendChild(track);
  c.appendChild(el("p","qtext", q.text));
  if (q.sensitive) c.appendChild(el("p","qwhy", t("ui.why_asking")));

  const hear = el("button","hear","🔊  " + (t("ui.listen") || "Listen"));
  hear.onclick = () => say(q.text);
  c.appendChild(hear);

  const box = el("div");
  c.appendChild(box);

  if (q.kind === "bool") {
    [[true, t("ui.yes")||"Yes","✔️"], [false, t("ui.no")||"No","✖️"]]
      .forEach(([val, lab, pic]) => {
        const b = el("button","opt");
        b.appendChild(el("span","pic", pic));
        b.appendChild(el("span", null, lab));
        b.onclick = () => answer(q.attribute, val);
        box.appendChild(b);
      });
  } else if (q.kind === "enum") {
    q.options.forEach(o => {
      const b = el("button", null, o.label);
      b.onclick = () => answer(q.attribute, o.value);
      box.appendChild(b);
    });
  } else {
    const inp = document.createElement("input");
    inp.type = "number"; inp.inputMode = "numeric";
    if (q.low  != null) inp.min = q.low;
    if (q.high != null) inp.max = q.high;
    box.appendChild(inp);
    const nxt = el("button","cta", t("ui.next") || "Next");
    const send = () => {
      let n = parseInt(inp.value, 10);
      if (Number.isNaN(n)) return inp.focus();
      if (q.low != null && n < q.low) n = q.low;
      // Somebody typing 500 for their age has not told us they are 500. Cap it
      // and show it back as "120+" rather than refusing the answer.
      if (q.high != null && n > q.high) n = q.high;
      answer(q.attribute, n);
    };
    nxt.onclick = send;
    inp.onkeydown = e => { if (e.key === "Enter") send(); };
    box.appendChild(nxt);
    setTimeout(() => inp.focus(), 40);
  }

  const pair = el("div","pair mt");
  if (S.order.length) {
    const back = el("button","ghost","← " + (t("ui.back") || "Back"));
    back.onclick = () => {
      const last = S.order.pop();
      if (last) delete S.facts[last];
      S.asked = Math.max(0, S.asked - 1);
      ask();
    };
    pair.appendChild(back);
  }
  const skip = el("button","ghost", t("ui.dont_know") || "Not sure");
  skip.onclick = finish;
  pair.appendChild(skip);
  c.appendChild(pair);
  v.appendChild(c);
}

function answer(name, val) {
  S.facts[name] = val;
  S.order.push(name);
  S.asked = Math.min(10, S.asked + 1);
  ask();
}

/* ---------- results ---------- */

async function finish() {
  const v = view();
  v.appendChild(el("div","empty", t("ui.checking") || "Checking"));
  try { S.result = await api("/api/result", {facts:S.facts, documents:[...S.held]}); }
  catch { return offline(); }
  renderResult();
}

function renderResult() {
  const d = S.result;
  const v = view();
  if (!d) return startScreen();

  if (d.clashes && d.clashes.length) {
    const c = el("div","card");
    c.appendChild(el("h2", null, t("ui.mismatch_title")));
    c.appendChild(el("p","sub", t("ui.mismatch_body")));
    d.clashes.forEach(x => {
      const n = el("div","note stop");
      x.rule.forEach(r => n.appendChild(el("div", null, r)));
      x.answers.forEach(a => n.appendChild(el("div","sub",
        t("ui.mismatch_you_said") + ": " + a.label + " " + a.value)));
      c.appendChild(n);
    });
    const again = el("button","cta mt", t("ui.start_over"));
    again.onclick = restart;
    c.appendChild(again);
    return v.appendChild(c);
  }

  const c = el("div","card");
  if (d.claims.length) {
    c.appendChild(el("h2", null, t("ui.claims_title", {n:d.claims.length})));
    d.claims.forEach(x => c.appendChild(claimRow(x)));
  } else {
    c.appendChild(el("h2", null, t("ui.claims_none_title")));
    c.appendChild(el("p","sub", t("ui.claims_none_body")));
  }
  v.appendChild(c);

  if (d.near && d.near.length) {
    const n = el("div","card");
    n.appendChild(el("h2", null, t("ui.near_title")));
    d.near.forEach(x => n.appendChild(nearRow(x)));
    v.appendChild(n);
  }

  if (d.undecided && d.undecided.length) {
    const u = el("div","card");
    u.appendChild(el("h2", null, t("ui.undecided_title") || "Could not check these"));
    u.appendChild(el("p","sub", t("ui.undecided_body") || ""));
    d.undecided.forEach(x => {
      const row = el("div","row");
      row.appendChild(el("div","tag near","?"));
      const txt = el("div","txt");
      txt.appendChild(el("b", null, x.name));
      txt.appendChild(el("div","sub",
        (t("ui.undecided_need") || "We still need") + ": " + x.missing.join(", ")));
      row.appendChild(txt);
      u.appendChild(row);
    });
    const finish_ = el("button","cta mt", t("ui.undecided_go") || "Answer the rest");
    finish_.onclick = ask;
    u.appendChild(finish_);
    v.appendChild(u);
  }

  if (d.paperwork && d.paperwork.steps.length) {
    const p = el("div","card");
    p.appendChild(el("h2", null, t("ui.papers_title")));
    p.appendChild(el("p","sub", t("ui.papers_summary",
      {trips:d.paperwork.trips, fee:d.paperwork.fee, days:d.paperwork.days})));
    const jump = el("button","cta mt", t("ui.papers_open") || "Open the list");
    jump.onclick = () => go("papers");
    p.appendChild(jump);
    v.appendChild(p);
  }

  const acts = el("div","card");
  const pr = el("button", null, "🖨️  " + (t("ui.print") || "Print"));
  pr.onclick = () => window.print();
  acts.appendChild(pr);
  const ag = el("button","ghost", t("ui.start_over") || "Start again");
  ag.onclick = restart;
  acts.appendChild(ag);
  v.appendChild(acts);
}

function claimRow(x) {
  const row = el("div","row");
  row.appendChild(el("div","tag ok","✓"));
  const txt = el("div","txt");
  txt.appendChild(el("b", null, x.name));
  txt.appendChild(el("div","sub", x.benefit));
  txt.appendChild(el("div", null, (t("ui.apply_at")||"Go to") + ": " + x.apply_at));
  if (x.check) {
    txt.appendChild(el("div","note warn",
      t("ui.please_check") + ". " + t("ui.check_body",
        {label:x.check.label, now:x.check.now, flips:x.check.flips})));
  }
  const hear = el("button","hear","🔊 " + (t("ui.listen") || "Listen"));
  hear.onclick = () => say(x.name + ". " + x.benefit);
  txt.appendChild(hear);
  txt.appendChild(working(x.id));
  row.appendChild(txt);
  return row;
}

function nearRow(x) {
  const row = el("div","row");
  row.appendChild(el("div","tag near","!"));
  const txt = el("div","txt");
  txt.appendChild(el("b", null, x.name));
  txt.appendChild(el("div","sub", x.benefit));
  if (x.needed) {
    const n = el("div","note");
    n.style.background = "var(--bg)";
    n.appendChild(el("div", null, (t("ui.near_needed")||"You need") + ": " + x.needed));
    x.you_said.forEach(a => n.appendChild(el("div","sub",
      (t("ui.near_you_said")||"You told us") + ": " + a.label + " " + a.value)));
    txt.appendChild(n);
  }
  const fix = el("div","note ok");
  fix.appendChild(el("div", null, "👉  " + (t("ui.near_change") || "What would change it")));
  x.fix.forEach(f => {
    fix.appendChild(el("div", null, f.label + ": " + f.now + " → " + f.needed));
    fix.appendChild(el("div","sub", f.easy ? t("ui.near_easy") : t("ui.near_hard")));
  });
  txt.appendChild(fix);
  txt.appendChild(working(x.id));
  row.appendChild(txt);
  return row;
}

/* The derivation, on demand. Without this the app shows only its conclusion
   and reads as a lookup table, which was exactly the complaint. */
function working(schemeId) {
  const box = el("details","work");
  box.appendChild(el("summary", null, t("ui.working") || "How we worked this out"));
  let loaded = false;
  box.ontoggle = async () => {
    if (!box.open || loaded) return;
    loaded = true;
    const hold = el("div","sub", t("ui.checking") || "Checking");
    box.appendChild(hold);
    let tr;
    try { tr = await api("/api/trace", {facts:S.facts, scheme:schemeId}); }
    catch { hold.textContent = t("ui.error_body") || "Could not load"; return; }
    hold.remove();
    (tr.steps || []).forEach(s => box.appendChild(stepBlock(s)));
  };
  return box;
}

function stepBlock(s) {
  const st = el("div","step");
  st.appendChild(el("div","how", s.method));
  st.appendChild(el("div","what", s.headline));
  const bits = el("div","bits");
  (s.detail || []).forEach(x => bits.appendChild(el("div", null, x)));
  st.appendChild(bits);
  if (s.queries) {
    let line = (t("ui.queries") || "solver queries") + ": " + s.queries;
    if (s.compare) line += "  ·  " + s.compare.label + " " + s.compare.queries;
    st.appendChild(el("div","qc", line));
  }
  return st;
}

/* ---------- papers ---------- */

function papersTab() {
  const v = view();
  const p = S.result && S.result.paperwork;
  if (!p || !p.steps.length) {
    return v.appendChild(el("div","empty", t("ui.papers_empty") ||
      "Finish the questions and your paper list appears here."));
  }

  const head = el("div","card");
  head.appendChild(el("h2", null, t("ui.papers_title")));
  head.appendChild(el("p","sub", t("ui.papers_summary",
    {trips:p.trips, fee:p.fee, days:p.days})));
  if (p.first) {
    const n = el("div","note ok");
    n.appendChild(el("div", null, "⭐  " + t("ui.papers_first")));
    n.appendChild(el("b", null, (p.first.step ? p.first.step + ". " : "") + p.first.name));
    if (p.first.unlocks.length)
      n.appendChild(el("div","sub", t("ui.papers_unlocks") + ": " + p.first.unlocks.join(", ")));
    head.appendChild(n);
  }
  v.appendChild(head);

  const list = el("div","card");
  const ol = el("ol","route");
  p.steps.forEach(s => {
    const li = el("li");
    li.appendChild(el("b", null, s.name));
    li.appendChild(el("div","sub", (t("ui.papers_where")||"Go to") + ": " + s.issuer));
    const bits = [];
    bits.push(s.fee ? (t("ui.papers_cost")||"Cost") + " ₹" + s.fee
                    : (t("ui.papers_free")||"Free"));
    if (s.days) bits.push(t("ui.papers_time", {days:s.days}));
    bits.push(s.trips > 1 ? t("ui.papers_trips", {n:s.trips}) : t("ui.papers_trip"));
    li.appendChild(el("div","sub", bits.join("  ·  ")));
    if (s.unlocks.length)
      li.appendChild(el("div","note ok", t("ui.papers_unlocks") + ": " + s.unlocks.join(", ")));
    ol.appendChild(li);
  });
  list.appendChild(ol);
  list.appendChild(paperWorking());
  v.appendChild(list);

  const pr = el("div","card");
  const b = el("button", null, "🖨️  " + (t("ui.print") || "Print"));
  b.onclick = () => window.print();
  pr.appendChild(b);
  v.appendChild(pr);
}

function paperWorking() {
  const box = el("details","work");
  box.appendChild(el("summary", null,
    t("ui.working_papers") || "How this order was worked out"));
  let loaded = false;
  box.ontoggle = async () => {
    if (!box.open || loaded) return;
    loaded = true;
    let tr;
    try {
      tr = await api("/api/paper-trace",
        {targets:S.result.targets || [], documents:[...S.held], facts:{}});
    } catch { return; }
    (tr.steps || []).forEach(s => box.appendChild(stepBlock(s)));
  };
  return box;
}

/* ---------- help ---------- */

function helpTab() {
  const v = view();
  const c = el("div","card");
  c.appendChild(el("h2", null, t("ui.help_title") || "Questions"));
  c.appendChild(el("p","sub", t("ui.help_body") || ""));
  const open = el("button","cta mt", "💬  " + (t("ui.chat_open") || "Ask a question"));
  open.onclick = openChat;
  c.appendChild(open);
  v.appendChild(c);

  const about = el("div","card");
  about.appendChild(el("h3", null, t("ui.about_title") || "About this app"));
  [t("ui.about_1"), t("ui.about_2"), t("ui.about_3")].filter(Boolean)
    .forEach(x => about.appendChild(el("p","sub", x)));
  v.appendChild(about);
}

/* ---------- chat ---------- */

function openChat() {
  show("chat");
  if (!$("chat-log").childElementCount) {
    bubble("it", t("ui.chat_greet") || "Ask me about a scheme or a paper.", [],
      [t("ui.chat_eg1"), t("ui.chat_eg2"), t("ui.chat_eg3")].filter(Boolean));
  }
  setTimeout(() => $("chat-in").focus(), 60);
}
$("fab").onclick = openChat;
$("chat-close").onclick = () => hide("chat");

function bubble(who, text, bullets, chips, steps) {
  const log = $("chat-log");
  const b = el("div","bubble " + who);
  if (who === "it") b.appendChild(el("b", null, text));
  else b.textContent = text;
  (bullets || []).forEach(x => b.appendChild(el("div","li", x)));
  (steps || []).forEach((s, i) => b.appendChild(
    el("div","li", (i+1) + ". " + s.name + ", " + s.issuer)));
  log.appendChild(b);
  if (chips && chips.length) {
    const row = el("div");
    chips.forEach(c => {
      const ch = el("button","chip", c);
      ch.onclick = () => sendChat(c);
      row.appendChild(ch);
    });
    log.appendChild(row);
  }
  log.scrollTop = log.scrollHeight;
}

async function sendChat(text) {
  const q = (text != null ? text : $("chat-in").value).trim();
  if (!q) return;
  $("chat-in").value = "";
  bubble("me", q);
  let a;
  try { a = await api("/api/ask", {question:q, facts:{}}); }
  catch { return bubble("it", t("ui.error_body") || "Could not answer"); }
  bubble("it", a.text, a.bullets, a.suggestions, a.steps);
  say(a.text);
}
$("chat-send").onclick = () => sendChat();
$("chat-in").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

/* ---------- misc ---------- */

function restart() {
  S.facts = {}; S.order = []; S.held = new Set(); S.asked = 0; S.result = null;
  go("home");
}

if ("speechSynthesis" in window) speechSynthesis.getVoices();
boot();
</script>

async function readPaper(file, out) {
  out.innerHTML = "";
  out.appendChild(el("div","sub", t("ui.doc_reading")));

  let encoded;
  try { encoded = await asBase64(file); }
  catch { out.innerHTML = ""; return out.appendChild(
    el("div","note stop", t("ui.doc_unreadable"))); }

  let data;
  try { data = await api("/api/read-document", {image:encoded, facts:S.facts}); }
  catch { out.innerHTML = ""; return out.appendChild(
    el("div","note stop", t("ui.doc_unreadable"))); }

  out.innerHTML = "";
  if (!data.ok) {
    return out.appendChild(el("div","note stop",
      data.detail || t("ui.doc_unreadable")));
  }

  if (data.guesses.length) {
    const top = data.guesses[0];
    const box = el("div", data.sure ? "note ok" : "note warn");
    box.appendChild(el("div", null,
      (data.sure ? t("ui.doc_looks_like") : t("ui.doc_not_sure")) + ": " + top.name));
    if (top.matched.length) {
      box.appendChild(el("div","sub",
        t("ui.doc_matched") + ' "' + top.matched.slice(0,3).join('", "') + '"'));
    }
    out.appendChild(box);
    // Ticking the paper they hold is low risk and visible, so the strongest
    // guess is applied and the runners-up are offered.
    data.guesses.forEach((g, i) => {
      const b = el("button","opt");
      b.appendChild(el("span", null, (PIC[g.id] || "📄") + "  " + g.name));
      if (i === 0 && data.sure) { S.held.add(g.id); b.classList.add("on"); }
      b.onclick = () => {
        if (S.held.has(g.id)) { S.held.delete(g.id); b.classList.remove("on"); }
        else { S.held.add(g.id); b.classList.add("on"); }
      };
      out.appendChild(b);
    });
  }

  data.redacted.forEach(r => {
    const box = el("div","note ok");
    box.style.cssText = "display:flex;align-items:flex-start;gap:9px";
    box.appendChild(icon("lock", 18, "#1b7a4b"));
    box.appendChild(el("span", null, r.shape + "  \u00b7  " + r.note));
    out.appendChild(box);
  });
  // Every field off a photograph is a question, never an answer. A five read
  // as a six moves an income by ten thousand rupees and only the person
  // holding the paper can see that it happened.
  data.confirm.forEach(q => out.appendChild(askRow(q, out)));
  data.refused.forEach(r => out.appendChild(el("div","note stop",
    r.label + ": " + (r.detail || ""))));
}

function asBase64(file) {
  return new Promise((done, fail) => {
    const reader = new FileReader();
    reader.onerror = fail;
    reader.onload = () => {
      const url = String(reader.result);
      const comma = url.indexOf(",");
      comma === -1 ? fail(new Error("not a data url")) : done(url.slice(comma + 1));
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- questions ---------- */

async function ask() {
  const tok = drawing;
  let data;
  try { data = await api("/api/question", {facts:S.facts}); }
  catch { return offline(); }
  if (stale(tok)) return;
  const q = data.question;
  if (!q) return finish();

  const v = wrapped(view(), "");
  const c = el("div","head");

  const track = el("div","track");
  for (let i = 0; i < 10; i++) {
    const seg = el("i"); if (i < S.asked) seg.className = "on"; track.appendChild(seg);
  }
  c.appendChild(track);
  c.appendChild(el("p","qtext", q.text));
  if (q.sensitive) c.appendChild(el("p","qwhy", t("ui.why_asking")));

  const hear = labelled("hear", "sound", t("ui.listen") || "Listen", 17);
  hear.onclick = () => say(q.text);
  c.appendChild(hear);

  const box = el("div");
  c.appendChild(box);

  if (q.kind === "bool") {
    [[true, t("ui.yes")||"Yes", "tick", "#1b7a4b"],
     [false, t("ui.no")||"No", "cross", "#982a22"]]
      .forEach(([val, lab, glyph, colour]) => {
        const b = el("button","opt");
        b.appendChild(icon(glyph, 22, colour));
        b.appendChild(el("span", null, lab));
        b.onclick = () => answer(q.attribute, val);
        box.appendChild(b);
      });
  } else if (q.kind === "enum") {
    q.options.forEach(o => {
      const b = el("button", null, o.label);
      b.onclick = () => answer(q.attribute, o.value);
      box.appendChild(b);
    });
  } else {
    const inp = document.createElement("input");
    inp.type = "number"; inp.inputMode = "numeric";
    if (q.low  != null) inp.min = q.low;
    if (q.high != null) inp.max = q.high;
    box.appendChild(inp);
    const nxt = el("button","cta", t("ui.next") || "Next");
    const send = () => {
      let n = parseInt(inp.value, 10);
      if (Number.isNaN(n)) return inp.focus();
      if (q.low != null && n < q.low) n = q.low;
      // Somebody typing 500 for their age has not told us they are 500. Cap it
      // and show it back as "120+" rather than refusing the answer.
      if (q.high != null && n > q.high) n = q.high;
      answer(q.attribute, n);
    };
    nxt.onclick = send;
    inp.onkeydown = e => { if (e.key === "Enter") send(); };
    box.appendChild(nxt);
    setTimeout(() => inp.focus(), 40);
  }

  const pair = el("div","pair mt");
  if (S.order.length) {
    const back = el("button","ghost","← " + (t("ui.back") || "Back"));
    back.onclick = () => {
      const last = S.order.pop();
      if (last) delete S.facts[last];
      S.asked = Math.max(0, S.asked - 1);
      ask();
    };
    pair.appendChild(back);
  }
  const skip = el("button","ghost", t("ui.dont_know") || "Not sure");
  skip.onclick = finish;
  pair.appendChild(skip);
  c.appendChild(pair);
  v.appendChild(c);
}

function answer(name, val) {
  S.facts[name] = val;
  S.sources[name] = "asked";
  S.topics = [];
  S.order.push(name);
  S.asked = Math.min(10, S.asked + 1);
  ask();
}

/* Facts only ever arrive through here or through answer(), and both record
   where they came from. The server will not accept one by any other route
   either; see patra/guard.py. */
function adopt(name, val, source) {
  S.facts[name] = val;
  S.sources[name] = source || "spoken";
  S.result = null;
  S.topics = [];
}

/* ---------- results ---------- */

async function finish() {
  const v = wrapped(view(), ""), tok = drawing;
  v.appendChild(el("div","empty", t("ui.checking") || "Checking"));
  try { S.result = await api("/api/result", {facts:S.facts, documents:[...S.held]}); }
  catch { return offline(); }
  if (stale(tok)) return;
  renderResult();
}

function renderResult() {
  const d = S.result;
  const v = view();
  if (!d) return startScreen();

  if (d.clashes && d.clashes.length) {
    const c = el("div","card");
    const holder = wrapped(v, "");
    c.appendChild(el("h2", null, t("ui.mismatch_title")));
    c.appendChild(el("p","sub", t("ui.mismatch_body")));
    d.clashes.forEach(x => {
      const n = el("div","note stop");
      x.rule.forEach(r => n.appendChild(el("div", null, r)));
      x.answers.forEach(a => n.appendChild(el("div","sub",
        t("ui.mismatch_you_said") + ": " + a.label + " " + a.value)));
      c.appendChild(n);
    });
    const again = el("button","cta mt", t("ui.start_over"));
    again.onclick = restart;
    c.appendChild(again);
    return holder.appendChild(c);
  }

  if (d.claims.length) {
    heading(v, t("ui.claims_title", {n:d.claims.length}));
    const b = band(v);
    d.claims.forEach(x => b.appendChild(claimRow(x)));
  } else {
    heading(v, t("ui.claims_none_title"), t("ui.claims_none_body"));
  }

  if (d.near && d.near.length) {
    heading(v, t("ui.near_title"));
    const b = band(v);
    d.near.forEach(x => b.appendChild(nearRow(x)));
  }

  if (d.undecided && d.undecided.length) {
    heading(v, t("ui.undecided_title") || "Could not check these",
            t("ui.undecided_body") || "");
    const b = band(v);
    d.undecided.forEach(x => {
      const row = el("div","item near");
      row.appendChild(el("h3", null, x.name));
      row.appendChild(el("div","what",
        (t("ui.undecided_need") || "We still need") + ": " + x.missing.join(", ")));
      b.appendChild(row);
    });
    const more = el("button","cta", t("ui.undecided_go") || "Answer the rest");
    more.onclick = ask;
    b.appendChild(more);
  }

  inferenceSection(v);
  nextSection(v);
  timelineSection(v);
  whatIfSection(v);

  if (d.paperwork && d.paperwork.steps.length) {
    heading(v, t("ui.papers_title"), t("ui.papers_summary",
      {trips:d.paperwork.trips, fee:d.paperwork.fee, days:d.paperwork.days}));
    const jump = el("button","cta", t("ui.papers_open") || "Open the list");
    jump.onclick = () => go("papers");
    plain(v).appendChild(jump);
  }

  const acts = plain(v);
  const pr = labelled(null, "print", t("ui.print") || "Print", 19);
  pr.style.width = "100%"; pr.style.justifyContent = "center";
  pr.onclick = () => window.print();
  acts.appendChild(pr);
  const ag = el("button","ghost", t("ui.start_over") || "Start again");
  ag.onclick = restart;
  acts.appendChild(ag);
}

function claimRow(x) {
  const row = el("div","item ok");
  const txt = el("div");
  txt.appendChild(el("h3", null, x.name));
  txt.appendChild(el("div","what", x.benefit));
  txt.appendChild(el("div","where", (t("ui.apply_at")||"Go to") + ": " + x.apply_at));
  if (x.check) {
    txt.appendChild(el("div","note warn",
      t("ui.please_check") + ". " + t("ui.check_body",
        {label:x.check.label, now:x.check.now, flips:x.check.flips})));
  }
  const hear = labelled("hear", "sound", t("ui.listen") || "Listen", 17);
  hear.onclick = () => say(x.name + ". " + x.benefit);
  txt.appendChild(hear);
  txt.appendChild(working(x.id));
  row.appendChild(txt);
  return row;
}

function nearRow(x) {
  const row = el("div","item near");
  const txt = el("div");
  txt.appendChild(el("h3", null, x.name));
  txt.appendChild(el("div","what", x.benefit));
  if (x.needed) {
    const n = el("div","note");
    n.style.background = "var(--bg)";
    n.appendChild(el("div", null, (t("ui.near_needed")||"You need") + ": " + x.needed));
    x.you_said.forEach(a => n.appendChild(el("div","sub",
      (t("ui.near_you_said")||"You told us") + ": " + a.label + " " + a.value)));
    txt.appendChild(n);
  }
  const fix = el("div","note ok");
  const fixHead = el("div");
  fixHead.style.cssText = "display:flex;align-items:center;gap:7px;font-weight:600";
  fixHead.appendChild(icon("next", 17, "#1b7a4b"));
  fixHead.appendChild(el("span", null, t("ui.near_change") || "What would change it"));
  fix.appendChild(fixHead);
  x.fix.forEach(f => {
    fix.appendChild(el("div", null, f.label + ": " + f.now + " → " + f.needed));
    fix.appendChild(el("div","sub", f.easy ? t("ui.near_easy") : t("ui.near_hard")));
  });
  txt.appendChild(fix);
  txt.appendChild(working(x.id));
  row.appendChild(txt);
  return row;
}

/* The derivation, on demand. Without this the app shows only its conclusion
   and reads as a lookup table, which was exactly the complaint. */
function working(schemeId) {
  const box = el("details","work");
  box.appendChild(el("summary", null, t("ui.working") || "How we worked this out"));
  let loaded = false;
  box.ontoggle = async () => {
    if (!box.open || loaded) return;
    loaded = true;
    const hold = el("div","sub", t("ui.checking") || "Checking");
    box.appendChild(hold);
    let tr;
    try { tr = await api("/api/trace", {facts:S.facts, scheme:schemeId}); }
    catch { hold.textContent = t("ui.error_body") || "Could not load"; return; }
    hold.remove();
    (tr.steps || []).forEach(s => box.appendChild(stepBlock(s)));
  };
  return box;
}

function stepBlock(s) {
  const st = el("div","step");
  st.appendChild(el("div","how", s.method));
  st.appendChild(el("div","what2", s.headline));
  const bits = el("div","bits");
  (s.detail || []).forEach(x => bits.appendChild(el("div", null, x)));
  st.appendChild(bits);
  if (s.queries) {
    let line = (t("ui.queries") || "solver queries") + ": " + s.queries;
    if (s.compare) line += "  ·  " + s.compare.label + " " + s.compare.queries;
    st.appendChild(el("div","qc", line));
  }
  return st;
}

/* ---------- what to do next ---------- */

/* Six refusals for six reasons is six explanations and no plan. This is the
   plan: every change any correction set mentions, every paper the won schemes
   still need, costed in one currency and ordered by what each opens up.

   The counts are re-derived rather than tallied. A fact appearing in four
   conflicts may unlock nothing on its own, because each of those schemes is
   also blocked by something else, so every candidate is assumed and the
   solver is asked again. "Opens up three" is a claim that was checked. */
function nextSection(parent) {
  const tok = drawing;
  heading(parent, t("ui.next_title"));
  const band_ = band(parent);
  band_.appendChild(el("div","sub", t("ui.checking") || "Checking"));

  api("/api/next", {facts:S.facts, documents:[...S.held]}).then(d => {
    if (stale(tok)) return;
    band_.innerHTML = "";

    // Whole sentences rather than a number and a stripped-down label, because
    // pulling "{n}" out of a translated sentence leaves different wreckage in
    // every language.
    const sum = el("div","note ok");
    sum.appendChild(el("div", null, t("ui.next_have", {n:d.eligible})));
    if (d.reachable.length) {
      sum.appendChild(el("div", null, t("ui.next_more", {n:d.reachable.length})));
    }
    band_.appendChild(sum);

    if (!d.actions.length) {
      band_.appendChild(el("div","note", t("ui.next_none")));
    }
    d.actions.forEach((a, i) => band_.appendChild(actionCard(a, i)));

    if (d.hopeless.length) {
      const box = el("div","note stop");
      box.appendChild(el("div", null, t("ui.next_hopeless")));
      box.appendChild(el("div","sub", d.hopeless.map(x => x.name).join(", ")));
      band_.appendChild(box);
    }
  }).catch(() => {
    band_.innerHTML = "";
    band_.appendChild(el("div", "note stop",
      t("ui.error_body") || "Could not work this out"));
  });
}

function actionCard(a, index) {
  const card = el("div", "act" + (index === 0 ? " first" : ""));
  card.appendChild(el("div","rank", String(index + 1)));

  if (a.move === "fact" && a.threshold) {
    // A recorded figure is a limit to compare against, not a target to hit.
    // "Earn 46,080" is nonsense; "this one allows 46,080 or less" is not.
    card.appendChild(el("h4", null,
      t("ui.next_threshold_" + a.threshold, {v:a.needed})));
    card.appendChild(el("div","sub",
      (t("ui.near_you_said") || "You told us") + ": " + a.label + " " + a.now));
  } else if (a.move === "fact") {
    card.appendChild(el("h4", null, a.label + ": " + a.now + " → " + a.needed));
  } else {
    card.appendChild(el("h4", null, a.errand ? a.errand.name : a.key));
  }

  if (a.errand) {
    const bits = [(t("ui.papers_where") || "Go to") + ": " + a.errand.issuer];
    bits.push(a.errand.fee ? (t("ui.papers_cost") || "Cost") + " ₹" + a.errand.fee
                           : (t("ui.papers_free") || "Free"));
    bits.push(a.errand.trips > 1 ? t("ui.papers_trips", {n:a.errand.trips})
                                 : t("ui.papers_trip"));
    card.appendChild(el("div","cost", bits.join("  ·  ")));
  }
  if (a.paperwork_only) card.appendChild(el("div","src", t("ui.next_paperwork")));

  if (a.unlocks.length) {
    const box = el("div","note ok");
    const line = el("div");
    line.style.cssText = "display:flex;align-items:flex-start;gap:7px";
    line.appendChild(icon("next", 17, "#1b7a4b"));
    line.appendChild(el("span", null, t("ui.papers_unlocks") + ": "
      + a.unlocks.map(x => x.name).join(", ")));
    box.appendChild(line);
    card.appendChild(box);
  }
  if (a.toward.length) {
    card.appendChild(el("div","src mt",
      t("ui.next_toward") + ": " + a.toward.map(x => x.name).join(", ")));
  }
  if (a.loses.length) {
    const box = el("div","note stop");
    box.appendChild(el("div", null, t("ui.whatif_lost") + ": "
      + a.loses.map(x => x.name).join(", ")));
    card.appendChild(box);
  }
  return card;
}

/* ---------- what followed without being asked ---------- */

/* An axiom whose condition is known runs forwards. Somebody who says they are
   expecting has told us their gender, and asking anyway is the kind of thing
   that makes a form feel like it is not listening. Shown with the rule that
   produced each fact, because a derived answer the person did not give should
   be visible rather than quietly present. */
function inferenceSection(parent) {
  if (!Object.keys(S.facts).length) return;
  const tok = drawing;
  const head = heading(parent, t("ui.infer_title"), t("ui.infer_blurb"));
  const band_ = band(parent);
  band_.appendChild(el("div","sub", t("ui.checking") || "..."));

  api("/api/infer", {facts:S.facts}).then(d => {
    if (stale(tok)) return;
    band_.innerHTML = "";
    if (!d.derived.length && !d.bounds.length) {
      head.remove();
      return band_.parentElement.remove();
    }
    const card = el("div","card");
    card.style.margin = "0";

    d.derived.forEach((x, i) => {
      const box = el("div","callout");
      box.appendChild(icon("tick", 20, "#1b7a4b"));
      const txt = el("div");
      txt.appendChild(el("b", null, x.label + ": " + x.value));
      txt.appendChild(el("div","sub", t("ui.infer_by", {axiom:x.axiom})));
      if (x.proof) txt.appendChild(proofTree(x.proof, 0));
      box.appendChild(txt);
      card.appendChild(enter(box, i));
    });

    d.bounds.forEach((b, i) => {
      const line = el("div","fact");
      const range = (b.low == null ? "" : b.low) + " .. "
                  + (b.high == null ? "" : b.high);
      line.appendChild(el("b", null, b.label + ": " + range));
      line.appendChild(el("span","ev",
        t("ui.infer_bound") + "  \u00b7  " + b.axioms.join(", ")));
      card.appendChild(enter(line, d.derived.length + i));
    });

    band_.appendChild(card);
  }).catch(() => {
    if (stale(tok)) return;
    head.remove();
    band_.parentElement.remove();
  });
}

/* Backward chaining, drawn as the proof it is: the rule, then the same
   question asked of everything that rule stood on. */
function proofTree(node, depth) {
  const box = el("div");
  box.style.cssText = "margin-left:" + (depth * 14) + "px;font-size:14.5px";
  const line = node.axiom
    ? `${node.label} = ${node.value}  \u2190  ${node.axiom}`
    : `${node.label} = ${node.value}  (${t("ui.infer_told")})`;
  box.appendChild(el("div","src", line));
  if (node.axiom_text) {
    box.appendChild(el("div","src", "\u00a0\u00a0" + node.axiom_text));
  }
  (node.children || []).forEach(k => box.appendChild(proofTree(k, depth + 1)));
  return box;
}

/* ---------- what a birthday changes ---------- */

/* Every other answer in this app is about today. Some of these schemes open
   with age and several close with it, and the closings are the ones nobody
   ever hears: the Atal Pension Yojana takes nobody over forty, and somebody
   who is thirty-eight has two years to join something they will never be
   offered again. */
function timelineSection(parent) {
  if (!("age" in S.facts)) return;
  const tok = drawing;
  const head = heading(parent, t("ui.timeline_title"), t("ui.timeline_body"));
  const band_ = band(parent);
  band_.appendChild(el("div","sub", t("ui.checking") || "Checking"));

  api("/api/timeline", {facts:S.facts}).then(d => {
    if (stale(tok)) return;
    band_.innerHTML = "";
    if (!d.entries || !d.entries.length) {
      return band_.appendChild(el("div","note", t("ui.timeline_none")));
    }
    const card = el("div","card");
    card.style.margin = "0";
    d.entries.forEach(x => {
      if (x.opens_at != null) card.appendChild(whenRow(x, false));
      if (x.closes_at != null) card.appendChild(whenRow(x, true));
    });
    card.appendChild(el("div","src mt", t("ui.timeline_age", {age:d.age})));
    band_.appendChild(card);
  }).catch(() => {
    if (stale(tok)) return;
    band_.innerHTML = "";
    head.remove();
    band_.parentElement.remove();
  });
}

function whenRow(x, shutting) {
  const row = el("div","when-row" + (shutting ? " shut" : ""));
  const age = el("div","when-age", String(shutting ? x.closes_at : x.opens_at));
  age.appendChild(el("small", null, t("attr.age.label") || ""));
  row.appendChild(age);

  const body = el("div","when-body");
  body.appendChild(el("b", null, x.name));
  body.appendChild(el("div", null, shutting
    ? t("ui.timeline_closes", {age:x.closes_at, n:x.closes_in})
    : t("ui.timeline_opens", {age:x.opens_at, n:x.opens_in})));
  if (!shutting) {
    body.appendChild(el("div","src", x.only_age ? t("ui.timeline_wait")
                                                : t("ui.timeline_wait_paper")));
  }
  row.appendChild(body);
  return row;
}

/* ---------- what if ---------- */

/* The same reasoner, run against a household that does not exist yet. Both
   directions are reported, because a change that gains three schemes and
   quietly costs two is not an improvement and somebody weighing up a
   better-paying job is entitled to see the whole trade. */
function whatIfSection(parent) {
  heading(parent, t("ui.whatif_title"), t("ui.whatif_help"));
  const wrap = plain(parent);
  const card = el("div","card");

  // The interview already ranked these: it asks what the most undecided
  // schemes are waiting on, so the first question is the one most worth
  // asking "what if" about. Offering "State" first, which is what the raw
  // key order gives, is a worse opening than the app already knows how to
  // make.
  const asked = S.order.filter(name => name in S.facts);
  const changeable = asked.concat(
    Object.keys(S.facts).filter(name => !asked.includes(name)));
  const pick = document.createElement("select");
  pick.style.cssText = "font:inherit;font-size:17px;width:100%;padding:13px;" +
                       "border:1px solid var(--line);border-radius:2px;margin-bottom:10px;";
  changeable.forEach(name => {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = t("attr." + name + ".label") || name;
    pick.appendChild(o);
  });
  card.appendChild(pick);

  const box = el("div");
  card.appendChild(box);
  const out = el("div","mt");

  const draw = () => {
    box.innerHTML = "";
    const name = pick.value;
    const attr = (S.words.attr || {})[name] || {};
    const now = S.facts[name];

    if (typeof now === "boolean") {
      const flip = el("button","cta", t("ui.whatif_run"));
      flip.onclick = () => runWhatIf({[name]: !now}, out);
      box.appendChild(el("div","sub",
        (t("ui.near_you_said") || "You told us") + ": "
        + (now ? t("ui.yes") : t("ui.no"))));
      box.appendChild(flip);
      return;
    }
    if (attr.options) {
      Object.entries(attr.options).forEach(([value, label]) => {
        if (value === now) return;
        const b = el("button", null, label);
        b.onclick = () => runWhatIf({[name]: value}, out);
        box.appendChild(b);
      });
      return;
    }
    const inp = document.createElement("input");
    inp.type = "number"; inp.inputMode = "numeric"; inp.value = now;
    box.appendChild(inp);
    const go = el("button","cta", t("ui.whatif_run"));
    const send = () => {
      const n = parseInt(inp.value, 10);
      if (!Number.isNaN(n)) runWhatIf({[name]: n}, out);
    };
    go.onclick = send;
    inp.onkeydown = e => { if (e.key === "Enter") send(); };
    box.appendChild(go);
  };
  pick.onchange = draw;
  draw();

  card.appendChild(out);
  wrap.appendChild(card);
}

async function runWhatIf(changes, out) {
  out.innerHTML = "";
  out.appendChild(el("div","sub", t("ui.checking") || "Checking"));
  let d;
  try { d = await api("/api/simulate", {facts:S.facts, changes:changes}); }
  catch { out.innerHTML = ""; return; }
  out.innerHTML = "";

  if (!d.ok) {
    const box = el("div","note stop");
    box.appendChild(el("div", null, d.impossible
      ? t("ui.whatif_impossible") : t("ui.assist_not_usable")));
    if (d.detail) box.appendChild(el("div","sub", d.detail));
    return out.appendChild(box);
  }

  d.shifts.forEach(sh => out.appendChild(el("div","fact",
    sh.label + ": " + (sh.was == null ? "?" : sh.was) + " → " + sh.now)));
  out.appendChild(el("div","note", t("ui.whatif_counts",
    {before:d.before, after:d.after})));

  if (d.gained.length) {
    const box = el("div","note ok");
    box.appendChild(el("div", null, t("ui.whatif_gained")));
    d.gained.forEach(x => box.appendChild(el("div","sub", "+  " + x.name)));
    out.appendChild(box);
  }
  if (d.lost.length) {
    const box = el("div","note stop");
    box.appendChild(el("div", null, t("ui.whatif_lost")));
    d.lost.forEach(x => box.appendChild(el("div","sub",
      "−  " + x.name + (x.because ? ": " + x.because : ""))));
    out.appendChild(box);
  }
  if (!d.gained.length && !d.lost.length) {
    out.appendChild(el("div","note", t("ui.whatif_same")));
  }
}

/* ---------- papers ---------- */

function papersTab() {
  const outer = view();
  crumbs(outer, [{name:t("ui.nav_papers")}]);
  const v = wrapped(outer, "");
  const p = S.result && S.result.paperwork;
  if (!p || !p.steps.length) {
    return v.appendChild(el("div","empty", t("ui.papers_empty") ||
      "Finish the questions and your paper list appears here."));
  }

  const head = el("div","card");
  head.appendChild(el("h2", null, t("ui.papers_title")));
  head.appendChild(el("p","sub", t("ui.papers_summary",
    {trips:p.trips, fee:p.fee, days:p.days})));
  if (p.first) {
    const n = el("div","note ok");
    n.appendChild(el("div", null, "⭐  " + t("ui.papers_first")));
    n.appendChild(el("b", null, (p.first.step ? p.first.step + ". " : "") + p.first.name));
    if (p.first.unlocks.length)
      n.appendChild(el("div","sub", t("ui.papers_unlocks") + ": " + p.first.unlocks.join(", ")));
    head.appendChild(n);
  }
  v.appendChild(head);

  const list = el("div","card");
  const ol = el("ol","route");
  p.steps.forEach(s => {
    const li = el("li");
    li.appendChild(el("b", null, s.name));
    li.appendChild(el("div","sub", (t("ui.papers_where")||"Go to") + ": " + s.issuer));
    const bits = [];
    bits.push(s.fee ? (t("ui.papers_cost")||"Cost") + " ₹" + s.fee
                    : (t("ui.papers_free")||"Free"));
    if (s.days) bits.push(t("ui.papers_time", {days:s.days}));
    bits.push(s.trips > 1 ? t("ui.papers_trips", {n:s.trips}) : t("ui.papers_trip"));
    li.appendChild(el("div","sub", bits.join("  ·  ")));
    if (s.unlocks.length)
      li.appendChild(el("div","note ok", t("ui.papers_unlocks") + ": " + s.unlocks.join(", ")));
    ol.appendChild(li);
  });
  list.appendChild(ol);
  list.appendChild(paperWorking());
  v.appendChild(list);
  v.appendChild(searchCard());

  const pr = el("div","card");
  const b = labelled(null, "print", t("ui.print") || "Print", 19);
  b.style.width = "100%"; b.style.justifyContent = "center";
  b.onclick = () => window.print();
  pr.appendChild(b);
  v.appendChild(pr);
}

/* The same route, found four ways. Nothing here changes the answer above; it
   is the identical problem solved again by each strategy, so what a heuristic
   is actually worth can be seen rather than asserted. */
function searchCard() {
  const card = el("div","card");
  card.appendChild(el("h3", null, t("ui.search_title")));
  card.appendChild(el("p","sub", t("ui.search_blurb")));
  const out = el("div","mt");
  const go_ = el("button","cta", t("ui.search_run"));
  go_.onclick = async () => {
    out.innerHTML = "";
    out.appendChild(el("div","sub waiting", t("ui.camp_working")));
    let d;
    try {
      d = await api("/api/search-compare",
                    {targets:(S.result && S.result.targets) || [],
                     documents:[...S.held]});
    } catch { out.innerHTML = ""; return; }
    out.innerHTML = "";
    if (!d.rows.length) return;

    const most = Math.max(...d.rows.map(r => r.expanded)) || 1;
    d.rows.forEach((r, i) => {
      const row = el("div","counter");
      const what = el("div","what");
      const head = el("div");
      head.style.cssText = "display:flex;align-items:baseline;gap:9px;flex-wrap:wrap";
      head.appendChild(el("b", null, t("ui.search_" + r.strategy)));
      const pill = el("span","pill " + (r.optimal ? "yes" : "no"));
      pill.style.margin = "0";
      pill.textContent = r.optimal ? t("ui.search_optimal") + " \u2713"
                                   : t("ui.search_cost") + " " + r.cost;
      head.appendChild(pill);
      what.appendChild(head);
      what.appendChild(el("div","sub",
        t("ui.search_cost") + " " + r.cost + "  \u00b7  "
        + t("ui.search_papers") + " " + r.papers + "  \u00b7  "
        + t("ui.search_expanded") + " " + r.expanded));
      const bar = el("div","bar");
      const fill = el("i");
      if (!r.optimal) fill.className = "full";
      fill.style.width = "0%";
      bar.appendChild(fill);
      what.appendChild(bar);
      row.appendChild(what);
      out.appendChild(enter(row, i));
      setTimeout(() => { fill.style.width =
        Math.max(2, Math.round(100 * r.expanded / most)) + "%"; }, 70 + i * 70);
    });
  };
  card.appendChild(go_);
  card.appendChild(out);
  return card;
}

function paperWorking() {
  const box = el("details","work");
  box.appendChild(el("summary", null,
    t("ui.working_papers") || "How this order was worked out"));
  let loaded = false;
  box.ontoggle = async () => {
    if (!box.open || loaded) return;
    loaded = true;
    let tr;
    try {
      tr = await api("/api/paper-trace",
        {targets:S.result.targets || [], documents:[...S.held], facts:{}});
    } catch { return; }
    (tr.steps || []).forEach(s => box.appendChild(stepBlock(s)));
  };
  return box;
}

/* ---------- help ---------- */

function helpTab() {
  const outer = view();
  crumbs(outer, [{name:t("ui.nav_help")}]);
  const v = wrapped(outer, "");
  const c = el("div","card");
  c.appendChild(el("h2", null, t("ui.help_title") || "Questions"));
  c.appendChild(el("p","sub", t("ui.help_body") || ""));
  const open = labelled("cta mt", "chat", t("ui.chat_open") || "Ask a question", 19, "#fff");
  open.style.width = "100%"; open.style.justifyContent = "center";
  open.onclick = openChat;
  c.appendChild(open);
  v.appendChild(c);

  const about = el("div","card");
  about.appendChild(el("h3", null, t("ui.about_title") || "About this app"));
  [t("ui.about_1"), t("ui.about_2"), t("ui.about_3")].filter(Boolean)
    .forEach(x => about.appendChild(el("p","sub", x)));
  v.appendChild(about);
}

/* ---------- chat ---------- */

function openChat() {
  show("chat");
  if (!$("chat-log").childElementCount) {
    // The fourth example only works once there are answers to reason about,
    // so it appears when there are.
    const egs = [t("ui.chat_eg1"), t("ui.chat_eg2"), t("ui.chat_eg3")];
    if (Object.keys(S.facts).length) egs.push(t("ui.chat_eg4"));
    bubble("it", t("ui.chat_greet") || "Ask me about a scheme or a paper.", [],
      egs.filter(Boolean));
  }
  setTimeout(() => $("chat-in").focus(), 60);
}
$("fab").onclick = openChat;
$("chat-close").onclick = () => hide("chat");

function bubble(who, text, bullets, chips, steps, apply) {
  const log = $("chat-log");
  const b = el("div","bubble " + who);
  if (who === "it") b.appendChild(el("b", null, text));
  else b.textContent = text;
  (bullets || []).forEach(x => b.appendChild(el("div","li", x)));
  (steps || []).forEach((s, i) => b.appendChild(
    el("div","li", (i+1) + ". " + s.name + ", " + s.issuer)));
  log.appendChild(b);

  // Facts read out of something somebody said are offered, not taken. The
  // chat window is a conversation; quietly rewriting answers given on another
  // screen would be the worst kind of helpful.
  if (apply && Object.keys(apply).length) {
    const take = el("button","cta", t("ui.apply_facts"));
    take.style.width = "auto";
    take.onclick = () => {
      Object.entries(apply).forEach(([name, value]) => adopt(name, value, "spoken"));
      take.remove();
      hide("chat");
      ask();
    };
    log.appendChild(take);
  }
  if (chips && chips.length) {
    const row = el("div");
    chips.forEach(c => {
      const ch = el("button","chip", c);
      ch.onclick = () => sendChat(c);
      row.appendChild(ch);
    });
    log.appendChild(row);
  }
  log.scrollTop = log.scrollHeight;
}

async function sendChat(text) {
  const q = (text != null ? text : $("chat-in").value).trim();
  if (!q) return;
  $("chat-in").value = "";
  bubble("me", q);
  let a;
  // The profile goes with the question. Without it "what if our income were
  // eighty thousand" and "what should I do next" have nothing to work on, and
  // "am I eligible" cannot be put to the solver at all.
  try { a = await api("/api/ask",
    {question:q, facts:S.facts, documents:[...S.held]}); }
  catch { return bubble("it", t("ui.error_body") || "Could not answer"); }
  bubble("it", a.text, a.bullets, a.suggestions, a.steps, a.apply);
  say(a.text);
}
$("chat-send").onclick = () => sendChat();
$("chat-in").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

/* ---------- misc ---------- */

function restart() {
  S.facts = {}; S.order = []; S.held = new Set(); S.asked = 0; S.result = null;
  S.sources = {}; S.relation = null; S.topics = [];
  go("home");
}

if ("speechSynthesis" in window) speechSynthesis.getVoices();
boot();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6e4e">
<title>PATRA</title>
<link rel="icon" href="/assets/mark.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/mark.png">
<style>
  /* Built after usa.gov, and coloured from our own logo rather than from a
     palette generator. The three colours are the ones in the mark: the navy
     of the wordmark, the teal of the check, and the gold of the rules under
     it. Nothing else is invented.

     The structural borrowings from usa.gov are deliberate and all of them do
     work: a strip above the header that says what kind of site this is, a
     serif heading with a heavy rule under it, a tinted band behind every card
     grid, square cards with a thin border and a dotted rule under the icon,
     a breadcrumb and a left rail on every inner page, and a great deal of
     air. It reads as an official document you can trust rather than as a
     product trying to be friendly.

     Square corners and serif headings are the two choices doing most of the
     work. Rounded cards and a sans-serif stack are what make an interface
     look generic. */
  :root {
    /* from the logo */
    --navy:#0e334f; --navy-2:#092638; --navy-3:#1a5076; --navy-soft:#e7eef4;
    --teal:#098493; --teal-2:#066b78; --teal-soft:#e2f3f5;
    --gold:#d89030; --gold-2:#a96c1d; --gold-soft:#fdf3e2;

    /* structure */
    --band:#e3eef5; --sky:#d5e8f2;
    --ink:#1b1b1b; --grey:#55616b; --line:#c3cfd8; --hair:#e4eaee;
    --bg:#ffffff; --card:#ffffff;

    /* verdicts, and only verdicts */
    --ok:#1b7a4b; --ok-soft:#e6f4ec;
    --warn:#9c5a06; --warn-soft:#fdf3e2;
    --stop:#982a22; --stop-soft:#fbeae8;

    --bar-h:58px;
    --measure:1040px;
    --serif: Georgia, "Times New Roman", "Noto Serif Devanagari", serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  html,body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Source Sans Pro", system-ui, -apple-system, "Segoe UI", Roboto,
                "Noto Sans", sans-serif;
    font-size:17px; line-height:1.6;
  }
  body { padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom)); }
  .wrap { max-width:var(--measure); margin:0 auto; padding:0 20px; }

  /* Visible only to a keyboard, and the first thing it reaches. */
  .skip {
    position:absolute; left:-9999px; top:0; z-index:90; width:auto;
    background:var(--navy); color:#fff; padding:12px 18px; margin:0;
  }
  .skip:focus { left:0; }
  :focus-visible { outline:3px solid var(--gold); outline-offset:2px; }

  /* ---- the strip above the header ----
     usa.gov puts "An official website of the United States government" here.
     Ours has to say the opposite, in the same place, because the one thing
     this layout could borrow and should not is the authority. */
  .gov { background:var(--navy-soft); border-bottom:1px solid var(--line);
         font-size:14px; }
  .gov .wrap { display:flex; align-items:center; gap:9px; padding-top:7px;
               padding-bottom:7px; flex-wrap:wrap; }
  .gov svg { flex:none; }
  .gov b { font-weight:600; color:var(--navy); }
  .gov button {
    width:auto; margin:0; padding:2px 6px; border:0; background:none;
    color:var(--teal-2); font:inherit; font-size:14px; text-decoration:underline;
    display:inline-flex; align-items:center; gap:4px;
  }
  .gov button:hover { color:var(--navy); }
  .gov-panel { background:#fff; border-bottom:1px solid var(--line); }
  .gov-panel .wrap { display:grid; gap:20px; padding:20px;
                     grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); }
  .gov-panel .bit { display:flex; gap:11px; font-size:15px; color:var(--grey); }
  .gov-panel .bit svg { flex:none; margin-top:2px; }

  /* ---- header ---- */
  .site { background:#fff; border-bottom:1px solid var(--line); }
  .site .wrap { display:flex; align-items:center; gap:16px;
                padding-top:14px; padding-bottom:14px; }
  .brand { display:flex; align-items:center; gap:10px; border:0; background:none;
           padding:0; margin:0; width:auto; cursor:pointer; }
  .brand img { height:46px; width:auto; display:block; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:9px; }
  .tools button {
    width:auto; margin:0; padding:8px 14px; font-size:15px; font-weight:600;
    border:1px solid var(--navy); background:#fff; color:var(--navy);
    display:inline-flex; align-items:center; gap:7px; transition:.12s;
  }
  .tools button:hover { background:var(--navy); color:#fff; }
  .tools button:hover svg path,
  .tools button:hover svg circle { stroke:#fff; }

  /* ---- the row of sections ---- */
  .mainnav { background:var(--navy); }
  .mainnav .wrap { display:flex; gap:2px; padding:0 14px; overflow-x:auto;
                   scrollbar-width:none; }
  .mainnav .wrap::-webkit-scrollbar { display:none; }
  .mainnav button {
    width:auto; margin:0; border:0; background:none; color:#dde8f0;
    font-size:15.5px; font-weight:600; padding:14px 14px 11px;
    border-bottom:4px solid transparent; white-space:nowrap; transition:.12s;
  }
  .mainnav button:hover { color:#fff; border-bottom-color:var(--teal); }
  .mainnav button.on { color:#fff; border-bottom-color:var(--gold); }

  /* ---- hero ---- */
  .hero { position:relative; background:var(--sky); overflow:hidden; }
  .hero-art { position:absolute; inset:0; width:100%; height:100%; }
  .hero .wrap { position:relative; padding-top:34px; padding-bottom:34px; }
  .hero-card {
    background:var(--navy); color:#fff; padding:26px 28px; max-width:540px;
    border-left:6px solid var(--gold);
  }
  .hero-card h2 { font-family:var(--serif); font-size:31px; line-height:1.22;
                  margin:0 0 12px; font-weight:700; }
  .hero-card p { margin:0 0 18px; font-size:16.5px; color:#dbe6ef; }
  .hero-card .cta { display:inline-flex; width:auto; background:var(--gold);
                    color:#20170a; border-color:var(--gold); font-size:17px;
                    padding:13px 26px; }
  .hero-card .cta:hover { background:#f0a63f; border-color:#f0a63f; }
  .hero-card .when { display:block; margin-top:11px; font-size:14px;
                     color:#b9cbdb; }

  /* ---- "How do I ..." ---- */
  .quick { background:#fff; border:1px solid var(--line);
           margin:-22px auto 0; position:relative; z-index:2; }
  .quick h3 { font-family:var(--serif); font-size:21px; margin:0;
              padding:18px 22px 14px; color:var(--navy); }
  .quick .row { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr));
                border-top:1px solid var(--hair); }
  .quick button {
    width:100%; margin:0; border:0; border-left:4px solid var(--teal);
    background:#fff; text-align:left; padding:16px 18px; font-size:16px;
    color:var(--ink); transition:.12s;
  }
  .quick button:hover { background:var(--teal-soft); border-left-color:var(--gold);
                        color:var(--navy); }
  .quick .row button + button { border-top:1px solid var(--hair); }

  /* ---- the big call to action band ---- */
  .promo { background:var(--teal-soft); border-top:1px solid #bfe0e4;
           border-bottom:1px solid #bfe0e4; margin-top:30px; }
  .promo .wrap { display:flex; gap:22px; align-items:center; padding-top:26px;
                 padding-bottom:26px; flex-wrap:wrap; }
  .promo .art { flex:none; }
  .promo .txt { flex:1 1 320px; }
  .promo h3 { font-family:var(--serif); font-size:25px; margin:0 0 7px;
              color:var(--navy); }
  .promo p { margin:0; color:var(--grey); font-size:16px; }
  .promo .cta { width:auto; flex:none; padding:15px 30px; }

  /* ---- topic grid ---- */
  .grid { display:grid; gap:18px; padding:22px 0 8px;
          grid-template-columns:repeat(auto-fill, minmax(236px, 1fr)); }
  .tile {
    background:#fff; border:1px solid var(--line); padding:20px 18px;
    text-align:left; margin:0; width:100%; transition:.14s; position:relative;
  }
  .tile:hover { border-color:var(--teal); box-shadow:0 3px 0 0 var(--teal);
                transform:translateY(-2px); }
  .tile .ic { display:grid; place-items:center; padding-bottom:13px;
              margin-bottom:13px; border-bottom:1px dotted var(--line); }
  .tile h4 { margin:0 0 6px; font-size:17.5px; font-weight:700;
             color:var(--navy); font-family:var(--serif); }
  .tile p { margin:0; font-size:14.5px; color:var(--grey); line-height:1.5; }
  .tile .n { display:inline-block; margin-top:11px; font-size:13px;
             font-weight:700; letter-spacing:.3px; color:var(--teal-2);
             text-transform:uppercase; }
  .tile .mine { background:var(--gold); color:#20170a; padding:2px 8px;
                margin-left:6px; text-transform:none; letter-spacing:0; }

  /* ---- breadcrumb and the inner-page rail ---- */
  .crumb { font-size:14.5px; color:var(--grey); padding:16px 0 4px; }
  .crumb button { display:inline; width:auto; margin:0; padding:0; border:0;
                  background:none; color:var(--teal-2); font:inherit;
                  text-decoration:underline; }
  .crumb button:hover { color:var(--navy); }
  .crumb span { margin:0 7px; color:var(--line); }

  .layout { display:grid; gap:30px; padding:6px 0 34px;
            grid-template-columns:260px minmax(0,1fr); }
  .side { border-top:4px solid var(--navy); align-self:start; }
  .side h4 { margin:0; padding:13px 0 9px; font-family:var(--serif);
             font-size:17px; color:var(--navy); }
  .side button {
    width:100%; margin:0; border:0; border-top:1px solid var(--hair);
    background:none; text-align:left; padding:11px 10px 11px 0; font-size:15.5px;
    color:var(--ink); transition:.12s;
  }
  .side button:hover { color:var(--teal-2); padding-left:6px; }
  .side button.on { font-weight:700; color:var(--navy);
                    box-shadow:inset 4px 0 0 var(--gold); padding-left:12px; }

  /* ---- page heading ---- */
  .head { padding:20px 0 0; }
  .head h2 { font-family:var(--serif); font-size:29px; line-height:1.22;
             margin:0 0 12px; color:var(--navy); font-weight:700; }
  .head .rule { height:5px; background:var(--gold); width:100%; margin-bottom:16px; }
  .head p { margin:0 0 16px; color:var(--grey); font-size:16.5px; }

  .band { background:var(--band); padding:20px; margin-bottom:4px; }
  .plain { padding:0; }

  /* ---- cards and buttons ---- */
  .card { background:var(--card); border:1px solid var(--line);
          padding:20px; margin-bottom:16px; }
  .card h2 { font-family:var(--serif); font-size:24px; margin:0 0 10px;
             color:var(--navy); }
  .card h3 { margin:0 0 6px; font-size:18px; font-weight:700; color:var(--navy); }
  .card .mark { text-align:center; padding-bottom:12px; margin-bottom:14px;
                border-bottom:1px dotted var(--line); }
  .sub { color:var(--grey); font-size:15.5px; }
  .mt { margin-top:14px; }

  button {
    font:inherit; cursor:pointer; display:block; width:100%; text-align:left;
    padding:13px 15px; margin-bottom:9px; border:1px solid var(--line);
    background:#fff; color:var(--ink); transition:background .12s,
    border-color .12s, color .12s, transform .12s;
  }
  button:hover { border-color:var(--teal); background:var(--teal-soft); }
  button:active { transform:translateY(1px); }
  .cta { background:var(--navy); color:#fff; border-color:var(--navy);
         text-align:center; font-weight:700; font-size:17px; padding:15px; }
  .cta:hover { background:var(--navy-2); border-color:var(--navy-2);
               color:#fff; }
  .ghost { text-align:center; color:var(--navy); background:transparent;
           border-color:var(--navy); font-weight:600; }
  .ghost:hover { background:var(--navy); color:#fff; }
  .pair { display:flex; gap:10px; }
  .pair button { margin-bottom:0; flex:1; }

  .opt { display:flex; align-items:center; gap:12px; }
  .opt.on { border-color:var(--teal); border-width:2px; background:var(--teal-soft); }
  .opt.on::after { content:"\2713"; margin-left:auto; color:var(--teal-2);
                   font-weight:800; font-size:19px; }

  /* ---- a verdict badge ---- */
  .pill { display:inline-block; width:auto; margin:0 0 10px; padding:4px 11px;
          font-size:13.5px; font-weight:700; letter-spacing:.2px; border:1px solid; }
  .pill.yes { background:var(--ok-soft); color:var(--ok); border-color:var(--ok); }
  .pill.no { background:var(--warn-soft); color:var(--warn); border-color:var(--warn); }
  .pill.unknown { background:var(--navy-soft); color:var(--navy);
                  border-color:var(--navy-3); }

  /* ---- the interview ---- */
  .track { display:flex; gap:3px; margin-bottom:16px; }
  .track i { flex:1; height:5px; background:var(--hair); }
  .track i.on { background:var(--teal); }
  .qtext { font-family:var(--serif); font-size:25px; font-weight:700;
           line-height:1.32; margin:0 0 6px; color:var(--navy); }
  .qwhy { color:var(--gold-2); font-size:14px; margin:0 0 12px; }
  .hear { width:auto; padding:8px 14px; margin:0 0 16px; font-size:15px;
          color:var(--teal-2); border-color:var(--teal); background:#fff;
          font-weight:600; }
  .hear:hover { background:var(--teal); color:#fff; }
  input[type=number], input[type=text], select {
    font:inherit; font-size:20px; width:100%; padding:13px;
    border:1px solid var(--line); background:#fff; margin-bottom:10px;
  }
  input:focus, select:focus { border-color:var(--teal); outline:0;
                              box-shadow:0 0 0 3px var(--teal-soft); }
  input[type=number] { text-align:center; }

  /* ---- one claim, one card ---- */
  .item { background:#fff; border:1px solid var(--line); padding:17px;
          margin-bottom:14px; transition:.12s; }
  .item.near { border-left:5px solid var(--gold); }
  .item.ok { border-left:5px solid var(--ok); }
  .item h3 { font-family:var(--serif); font-size:19.5px; margin:0 0 6px;
             color:var(--navy); }
  .item .what { color:var(--grey); font-size:15.5px; margin-bottom:10px; }
  .item .where { font-size:16px; }

  .note { padding:12px 14px; font-size:15px; margin-top:10px;
          border-left:4px solid var(--line); background:var(--navy-soft); }
  .note.ok { background:var(--ok-soft); border-left-color:var(--ok); }
  .note.warn { background:var(--warn-soft); border-left-color:var(--gold); }
  .note.stop { background:var(--stop-soft); border-left-color:var(--stop); }

  /* ---- the "Important" callout, straight off an inner usa.gov page ---- */
  .callout { background:var(--teal-soft); border-left:6px solid var(--teal);
             padding:16px 18px; margin:18px 0; display:flex; gap:13px; }
  .callout svg { flex:none; margin-top:2px; }
  .callout b { display:block; font-family:var(--serif); font-size:17px;
               color:var(--navy); margin-bottom:4px; }
  .callout div { font-size:15.5px; }

  /* ---- numbered route ---- */
  ol.route { list-style:none; counter-reset:r; padding:0; margin:4px 0 0; }
  ol.route li { counter-increment:r; position:relative; padding:0 0 22px 52px; }
  ol.route li::before {
    content:counter(r); position:absolute; left:0; top:-2px; width:34px;
    height:34px; background:var(--navy); color:#fff; border-radius:50%;
    display:grid; place-items:center; font-weight:700; font-size:16px;
  }
  ol.route li::after { content:""; position:absolute; left:16.5px; top:36px;
                       bottom:6px; width:1px; background:var(--line); }
  ol.route li:last-child::after { display:none; }
  ol.route li b { font-size:17px; color:var(--navy); }

  details.work { border-top:1px dotted var(--line); margin-top:14px; padding-top:11px; }
  details.work summary { cursor:pointer; color:var(--teal-2); font-weight:700;
                         font-size:15px; list-style:none; text-decoration:underline; }
  details.work summary:hover { color:var(--navy); }
  details.work summary::-webkit-details-marker { display:none; }
  .step { border-left:2px solid var(--hair); margin:10px 0 0 4px; padding:0 0 4px 14px; }
  .step .how { font-size:12.5px; color:var(--teal-2); font-weight:700;
               text-transform:uppercase; letter-spacing:.5px; }
  .step .what2 { font-size:15px; }
  .step .bits { font-size:14px; color:var(--grey); }
  .step .bits div { padding:1px 0; }
  .qc { font-size:13px; color:var(--grey); font-style:italic; }

  /* ---- what was understood ---- */
  .heard { background:var(--ok-soft); border:1px solid var(--ok);
           padding:13px 15px; margin-bottom:12px; }
  .heard .who { font-family:var(--serif); font-size:16px; margin-bottom:8px;
                color:var(--navy); }
  .fact { display:flex; gap:10px; align-items:baseline; padding:5px 0;
          border-bottom:1px dotted var(--line); }
  .fact:last-child { border-bottom:0; }
  .fact b { font-size:16px; }
  .fact .ev { font-size:13px; color:var(--grey); font-style:italic;
              margin-left:auto; text-align:right; }
  .askrow { background:var(--gold-soft); border-left:5px solid var(--gold);
            padding:13px 15px; margin-bottom:10px; }
  .askrow .why { font-size:13.5px; color:var(--gold-2); margin-bottom:8px;
                 font-weight:600; }
  .askrow .pair button { font-size:15px; padding:10px; }
  .tellbox { display:flex; gap:8px; align-items:flex-start; }
  .tellbox input { margin:0; font-size:18px; }
  .mic { width:auto; margin:0; padding:0 15px; align-self:stretch;
         font-size:20px; line-height:1; border-color:var(--teal);
         color:var(--teal-2); }
  .mic:hover { background:var(--teal); color:#fff; }
  .mic.on { background:var(--stop); color:#fff; border-color:var(--stop); }

  /* ---- a ranked errand ---- */
  .act { border:1px solid var(--line); padding:16px; margin-bottom:12px;
         background:#fff; transition:.12s; }
  .act:hover { border-color:var(--teal); }
  .act.first { border-left:5px solid var(--teal); }
  .act .rank { font-size:12.5px; font-weight:700; letter-spacing:.5px;
               text-transform:uppercase; color:var(--teal-2); }
  .act h4 { margin:3px 0 5px; font-family:var(--serif); font-size:18px;
            color:var(--navy); font-weight:700; }
  .act .cost { font-size:14.5px; color:var(--grey); }
  .src { font-size:12.5px; color:var(--grey); }

  /* ---- timeline ---- */
  .when-row { display:flex; gap:14px; padding:14px 0;
              border-bottom:1px solid var(--hair); align-items:flex-start; }
  .when-row:last-child { border-bottom:0; }
  .when-age { flex:none; width:62px; text-align:center; font-family:var(--serif);
              font-size:25px; font-weight:700; color:var(--navy); line-height:1.1; }
  .when-age small { display:block; font-size:11.5px; color:var(--grey);
                    font-family:inherit; letter-spacing:.4px;
                    text-transform:uppercase; font-weight:600; }
  .when-row.shut .when-age { color:var(--stop); }
  .when-body b { font-size:16.5px; color:var(--navy); }
  .when-body div { font-size:15px; color:var(--grey); }

  /* ---- footer ---- */
  .foot { background:#f3f6f8; border-top:1px solid var(--line); margin-top:40px; }
  .foot .wrap { display:grid; gap:26px; padding-top:32px; padding-bottom:28px;
                grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); }
  .foot h4 { margin:0 0 12px; font-family:var(--serif); font-size:17px;
             color:var(--navy); }
  .foot button, .foot a { display:block; width:auto; margin:0 0 9px; padding:0;
                          border:0; background:none; color:var(--teal-2);
                          font:inherit; font-size:15.5px; text-align:left;
                          text-decoration:underline; }
  .foot button:hover, .foot a:hover { color:var(--navy); background:none; }
  .foot .tail { background:var(--navy); color:#c9d8e4; }
  .foot .tail .wrap { display:block; padding-top:20px; padding-bottom:20px;
                      font-size:14.5px; }
  .foot .tail img { height:32px; margin-bottom:12px; display:block; opacity:.95; }

  /* ---- bottom bar, chat ---- */
  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex;
          background:#fff; border-top:3px solid var(--navy);
          padding-bottom:env(safe-area-inset-bottom); }
  .tabs button { flex:1; margin:0; border:0; background:none; padding:8px 3px;
                 color:var(--grey); font-size:12.5px; line-height:1.25;
                 display:flex; flex-direction:column; align-items:center;
                 justify-content:flex-start; gap:3px; text-align:center;
                 min-height:52px; }
  .tabs button:hover { background:var(--navy-soft); }
  .tabs button .ic { display:block; flex:none; }
  .tabs button.on { color:var(--navy); font-weight:700;
                    box-shadow:inset 0 3px 0 var(--gold); }

  .fab { position:fixed; right:18px; z-index:25; width:58px; height:58px;
         bottom:calc(var(--bar-h) + 16px + env(safe-area-inset-bottom));
         border-radius:50%; border:0; padding:0; margin:0; background:var(--teal);
         color:#fff; display:grid; place-items:center;
         box-shadow:0 4px 14px rgba(9,38,56,.34); transition:.14s; }
  .fab:hover { background:var(--teal-2); transform:scale(1.06); }
  .sheet { position:fixed; inset:0; z-index:40; background:#fff;
           display:flex; flex-direction:column; }
  .sheet .chead { background:var(--navy); color:#fff; display:flex;
                  align-items:center; gap:12px; padding:14px 18px; }
  .sheet .chead h1 { margin:0; font-family:var(--serif); font-size:20px; }
  .sheet .chead .sub { color:#c0d2e0; font-size:13.5px; }
  .sheet .chead button { margin-left:auto; width:auto; background:rgba(255,255,255,.14);
                         border:1px solid rgba(255,255,255,.36); color:#fff;
                         padding:7px 13px; }
  .sheet .chead button:hover { background:#fff; color:var(--navy); }
  .sheet .log { flex:1; overflow-y:auto; padding:16px; background:var(--band); }
  .sheet .compose { display:flex; gap:8px; padding:11px 14px;
                    padding-bottom:calc(11px + env(safe-area-inset-bottom));
                    background:#fff; border-top:1px solid var(--line); }
  .sheet .compose input { margin:0; font-size:17px; }
  .sheet .compose button { width:auto; margin:0; padding:0 20px; }
  .bubble { max-width:88%; padding:12px 15px; margin-bottom:10px;
            font-size:16px; border:1px solid var(--line); background:#fff; }
  .bubble.me { margin-left:auto; background:var(--navy); color:#fff;
               border-color:var(--navy); }
  .bubble.it b { display:block; margin-bottom:4px; font-family:var(--serif);
                 font-size:17px; color:var(--navy); }
  .bubble.it .li { font-size:15px; color:var(--grey); padding:2px 0; }
  .chip { display:inline-block; width:auto; margin:5px 6px 0 0; padding:8px 12px;
          font-size:14px; background:#fff; border-color:var(--teal); }
  .empty { text-align:center; color:var(--grey); padding:34px 18px; }
  .hide { display:none !important; }

  /* ---- motion ----
     Every animation here is showing something: content arriving, a number
     being counted, a search exploring. None of it is decoration, and all of
     it stops when the machine says the person does not want it. */
  @keyframes rise {
    from { opacity:0; transform:translateY(9px); }
    to   { opacity:1; transform:none; }
  }
  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:.45; }
  }
  @keyframes sweep {
    from { stroke-dashoffset:var(--len); }
    to   { stroke-dashoffset:0; }
  }
  .rise { animation:rise .34s cubic-bezier(.22,.8,.3,1) both; }
  .waiting { animation:pulse 1.5s ease-in-out infinite; }

  /* ---- the camp ---- */
  .dials { display:grid; gap:18px; grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
           margin-bottom:18px; }
  .dial { border:1px solid var(--line); padding:16px 18px; background:#fff; }
  .dial h4 { margin:0 0 4px; font-size:14px; letter-spacing:.4px;
             text-transform:uppercase; color:var(--teal-2); font-weight:700; }
  .dial .big { font-family:var(--serif); font-size:30px; color:var(--navy);
               line-height:1.15; font-weight:700; }
  .dial .big.down { color:var(--stop); }
  .dial p { margin:5px 0 0; font-size:14.5px; color:var(--grey); }

  input[type=range] { width:100%; margin:10px 0 2px; accent-color:var(--teal); }
  .slider-row { display:flex; align-items:baseline; gap:10px; }
  .slider-row b { font-family:var(--serif); font-size:26px; color:var(--navy); }

  .ways { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:10px; }
  .ways button { width:auto; margin:0; font-size:15px; font-weight:600;
                 padding:10px 16px; }
  .ways button.on { background:var(--navy); color:#fff; border-color:var(--navy); }

  .counter { display:flex; gap:13px; align-items:center; padding:13px 0;
             border-bottom:1px solid var(--hair); }
  .counter:last-child { border-bottom:0; }
  .counter .what { flex:1; }
  .counter b { font-size:16.5px; color:var(--navy); }
  .counter .bar { height:7px; background:var(--hair); margin-top:6px;
                  max-width:240px; }
  .counter .bar i { display:block; height:100%; background:var(--teal);
                    transition:width .6s cubic-bezier(.22,.8,.3,1); }
  .counter .bar i.full { background:var(--gold); }

  .chart { width:100%; height:190px; display:block; background:#fff;
           border:1px solid var(--line); }
  .chart .grid-line { stroke:var(--hair); stroke-width:1; }
  .chart .walk { fill:none; stroke:var(--teal); stroke-width:2;
                 stroke-linejoin:round; }
  .chart .crest { fill:none; stroke:var(--gold); stroke-width:2.5;
                  stroke-linejoin:round; }
  .chart .ceiling { stroke:var(--stop); stroke-width:1.5; stroke-dasharray:5 4; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:13.5px;
            color:var(--grey); margin-top:9px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:16px; height:3px; display:inline-block; }

  /* ---- the studio ---- */
  .probe { border:1px solid var(--line); padding:20px; margin-bottom:16px;
           background:#fff; }
  .probe h3 { margin:0 0 7px; font-family:var(--serif); font-size:20px;
              color:var(--navy); }
  .probe > p { margin:0 0 14px; color:var(--grey); font-size:15.5px; }
  .probe select { margin-bottom:10px; }
  .card-out { background:var(--band); padding:15px; margin-top:14px; }
  .card-out .fact b { color:var(--navy); }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
    html { scroll-behavior:auto; }
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns:1fr; gap:18px; }
    .side { order:2; }
    .hero-card { max-width:none; }
    .quick { margin-top:0; }
    .mainnav { display:none; }
    .promo .cta { width:100%; }
  }
  @media (min-width: 861px) {
    .tabs { display:none; }
    .fab { bottom:26px; }
    body { padding-bottom:0; }
  }

  @media print {
    body { padding:0; }
    .gov,.site,.mainnav,.tabs,.fab,.hero,.quick,.promo,.foot,
    button,details.work,.crumb,.side { display:none !important; }
    .band { background:#fff; }
    .card,.item,.act { border:1px solid #999; page-break-inside:avoid; }
    .layout { grid-template-columns:1fr; }
  }
</style>
</head>

<script>
"use strict";

/* Concrete objects, not abstract glyphs. The research on low-literate users is
   blunt: a stylised symbol carries no meaning, a recognisable thing does. */
const PIC = {
  aadhaar:"🪪", voter_id:"🗳️", pan_card:"💳", ration_card:"🍚",
  birth_certificate:"👶", school_certificate:"🎓", electricity_bill:"💡",
  domicile_certificate:"🏠", income_certificate:"💰", caste_certificate:"📜",
  bank_account:"🏦", bank_aadhaar_seeding:"🔗", disability_certificate:"♿",
  death_certificate:"🕯️", land_records:"🌾", job_card:"⛏️", passport_photo:"📷"
};

const S = {
  lang:"en", speech:"en-IN", words:{}, langs:[],
  facts:{}, order:[], held:new Set(), asked:0,
  result:null, tab:"home",
  /* Where each fact came from, so the result page can distinguish an answer
     somebody gave from one we read off a photograph. */
  sources:{}, relation:null,
  can:{documents:false}, micOk:false, listening:null,
  topics:[], how:[], crumbs:[],
  camp:{budget:4, method:"exact"}
};
const KEY = "patra.lang";

const $  = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const show = (id) => $(id).classList.remove("hide");
const hide = (id) => $(id).classList.add("hide");

function t(path, vars) {
  let n = S.words;
  for (const k of path.split(".")) {
    if (!n || typeof n !== "object" || !(k in n)) return "";
    n = n[k];
  }
  let out = String(n ?? "");
  if (vars) for (const [k, v] of Object.entries(vars)) out = out.split("{"+k+"}").join(v);
  return out;
}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({...body, lang:S.lang})
  } : {});
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

/* Voice uses the browser's own synthesiser, so it needs no network and no
   model. Where a language has no voice installed the button is simply quiet,
   which is why text is never replaced by audio. */
function bestVoice() {
  const want = S.speech.toLowerCase();
  const all = speechSynthesis.getVoices();
  return all.find(v => v.lang && v.lang.toLowerCase() === want)
      || all.find(v => v.lang && v.lang.toLowerCase().startsWith(want.slice(0,2)))
      || null;
}

let playing = null;

/* A real recorded voice when one exists, the browser's otherwise.
   tools/voice.py generates the clips ahead of time, so this reads a local
   file and never calls out. */
function say(text) {
  if (!text) return;
  if (playing) { playing.pause(); playing = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();

  let handed = false;
  const fallback = () => {
    if (handed) return;
    handed = true;
    playing = null;
    robot(text);
  };

  const clip = new Audio("/api/voice?lang=" + encodeURIComponent(S.lang) +
                         "&text=" + encodeURIComponent(String(text).trim()));
  clip.onerror = fallback;
  clip.onplaying = () => { handed = true; };
  playing = clip;
  clip.play().catch(fallback);
}

function robot(text) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const voice = bestVoice();
  // One utterance per clause. The browser voice is what it is, but reading a
  // long sentence as a single breathless run is most of what makes it hard to
  // follow, and splitting on punctuation fixes that much.
  String(text).split(/(?<=[.!?।])\s+|,\s+/).filter(Boolean).forEach(part => {
    const u = new SpeechSynthesisUtterance(part.trim());
    u.lang = S.speech; u.rate = .85; u.pitch = 1.0;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  });
}

/* Screens fetch before they draw, so a second screen can be opened while the
   first is still waiting. Without a token the slower one wakes up and appends
   its cards into a page that has moved on, which looks like two screens drawn
   on top of each other. Every render takes a number; anything that comes back
   late checks whether it is still the current one. */
let drawing = 0;
function view() {
  drawing += 1;
  const v = $("view");
  v.innerHTML = "";
  return v;
}
const stale = (token) => token !== drawing;

/* Every block is full-bleed on the outside and held to one measure on the
   inside, which is what stops a wide screen stranding the text in the middle
   of an empty page. The three helpers hand back the inner element, so screens
   written before the layout existed still work unchanged. */
function wrapped(parent, cls) {
  const outer = el("div", cls);
  const inner = el("div", "wrap");
  outer.appendChild(inner);
  parent.appendChild(outer);
  return inner;
}

function heading(parent, title, blurb) {
  const w = wrapped(parent, "");
  const h = el("div","head");
  h.appendChild(el("h2", null, title));
  h.appendChild(el("div","rule"));
  if (blurb) h.appendChild(el("p", null, blurb));
  w.appendChild(h);
  return h;
}

function band(parent)  { return wrapped(parent, "band"); }
function plain(parent) { return wrapped(parent, "plain"); }

/* A button whose label is preceded by a line icon rather than an emoji.
   Emoji render differently on every machine and read as decoration; the
   document pictures are the one deliberate exception, because a recognisable
   object means something to somebody who cannot read the label. */
function labelled(cls, name, text, size, colour) {
  const b = el("button", cls);
  b.appendChild(icon(name, size || 18, colour));
  b.appendChild(el("span", null, "  " + text));
  b.style.display = "inline-flex";
  b.style.alignItems = "center";
  b.style.gap = "4px";
  return b;
}

function icon(name, size, colour) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", size); svg.setAttribute("height", size);
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("stroke", colour || "currentColor");
  svg.setAttribute("fill", "none");
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#g-" + name);
  svg.appendChild(use);
  return svg;
}

/* A breadcrumb, and the left rail beside it. Both come straight off an inner
   usa.gov page, and both earn their place here for the same reason: once the
   app has more than one screen, somebody has to be able to see where they are
   and get back. */
function crumbs(parent, trail) {
  const w = wrapped(parent, "");
  const bar = el("div","crumb");
  const home = el("button", null, t("ui.breadcrumb_home"));
  home.onclick = () => go("home");
  bar.appendChild(home);
  trail.forEach((step, i) => {
    bar.appendChild(el("span", null, "\u203a"));
    if (i === trail.length - 1 || !step.go) {
      bar.appendChild(el("span", null, step.name));
    } else {
      const b = el("button", null, step.name);
      b.onclick = step.go;
      bar.appendChild(b);
    }
  });
  w.appendChild(bar);
  return w;
}

function railed(parent, items, current) {
  const w = wrapped(parent, "");
  const grid = el("div","layout");
  const side = el("nav","side");
  side.appendChild(el("h4", null, t("ui.nav_schemes")));
  items.forEach(it => {
    const b = el("button", null, it.name);
    if (it.id === current) b.className = "on";
    b.onclick = it.go;
    side.appendChild(b);
  });
  const body = el("div");
  grid.appendChild(side); grid.appendChild(body);
  w.appendChild(grid);
  return body;
}

function offline() {
  const v = wrapped(view(), "");
  const c = el("div","card");
  c.appendChild(el("h2", null, t("ui.error_title") || "Cannot reach the app"));
  c.appendChild(el("p","sub", t("ui.error_offline") ||
    'Open a terminal, run "python3 -m patra.web.server", then open http://127.0.0.1:8765'));
  v.appendChild(c);
}

async function boot() {
  try { S.langs = await api("/api/languages"); }
  catch { return offline(); }
  // Whether this machine can read a photograph is a fact about the machine,
  // so the page asks once instead of offering a button that cannot work.
  try { S.can = await api("/api/capabilities"); } catch {}
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  const found = S.langs.find(l => l.code === saved);
  if (found) return pickLanguage(found);
  languageScreen();
}

   ["papers", "nav_papers"], ["camp", "nav_camp"], ["rulebook", "nav_rulebook"],
   ["course", "nav_course"], ["help", "nav_help"]]

  show("tabs"); show("fab"); show("mainnav"); show("foot");
  $("chat-log").innerHTML = "";
  S.facts = {}; S.order = []; S.held = new Set(); S.asked = 0; S.result = null;
  S.sources = {}; S.relation = null; S.topics = []; S.how = [];
  go("home");
}

function buildFooter() {
  const links = $("ft-links");
  links.innerHTML = "";
  [["nav_schemes", () => go("schemes")],
   ["nav_how",     () => go("how")],

function govPanel(open) {

/* ---------- tabs ---------- */

document.querySelectorAll(".tabs button, .mainnav button").forEach(b =>
  b.onclick = () => go(b.dataset.tab));

function go(tab, arg) {
  S.tab = tab;
  document.querySelectorAll(".tabs button, .mainnav button").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === tab));
  window.scrollTo(0, 0);
  if (tab === "home")    return homeScreen();
  if (tab === "check")   return S.result ? renderResult() : startScreen();
  if (tab === "schemes") return arg ? topicScreen(arg) : schemesScreen();
  if (tab === "scheme")  return schemeScreen(arg);
  if (tab === "how")     return arg ? howArticle(arg) : howScreen();
  if (tab === "papers")  return papersTab();
  if (tab === "camp")    return campScreen();
  if (tab === "course")  return courseScreen();
  if (tab === "trust")   return trustScreen();
  if (tab === "help")    return helpTab();
}

async function howArticle(howId) {
  const v = view(), tok = drawing;

  }

  try { d = await api("/api/how-page", {how:howId, documents:[...S.held]}); }

  if (d.summary) {

  if (d.steps.length) {

/* ---------- animation helpers ---------- */

const CALM = window.matchMedia
  && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* A number that climbs to its value. Worth the few lines: a lakh appearing
   instantly reads as a label, and a lakh counting up reads as a total
   somebody arrived at. */
function countTo(node, value, suffix) {
  const done = () => { node.textContent = value.toLocaleString("en-IN")
                                          + (suffix || ""); };
  if (CALM || value < 1000) return done();
  const span = 620, t0 = performance.now();
  const tick = (now) => {
    const at = Math.min(1, (now - t0) / span);
    const eased = 1 - Math.pow(1 - at, 3);
    node.textContent = Math.round(value * eased).toLocaleString("en-IN")
                       + (suffix || "");
    if (at < 1) requestAnimationFrame(tick); else done();
  };
  requestAnimationFrame(tick);
}

function enter(node, index) {
  if (CALM) return node;
  node.classList.add("rise");
  node.style.animationDelay = Math.min(index || 0, 8) * 45 + "ms";
  return node;
}

/* The search itself, drawn as it ran. A final number hides the interesting
   part: local search climbs, stalls, takes a step backwards on purpose and
   finds something better. The dashed line is the true optimum, which we have
   because eleven counters is small enough to enumerate. */
function traceChart(d) {
  const box = el("div","card");
  box.appendChild(el("h3", null, t("ui.camp_trace")));
  box.appendChild(el("p","sub", t("ui.camp_trace_blurb")));

  const W = 640, H = 190, pad = 10;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "chart");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");

  const top = Math.max(d.optimum, ...d.trace.map(p => p.best)) * 1.06 || 1;
  const n = d.trace.length;
  const x = (i) => pad + (W - 2 * pad) * (n > 1 ? i / (n - 1) : 0);
  const y = (val) => H - pad - (H - 2 * pad) * (val / top);

  for (let g = 1; g < 4; g++) {
    const line = document.createElementNS(svg.namespaceURI, "line");
    line.setAttribute("class", "grid-line");
    line.setAttribute("x1", 0); line.setAttribute("x2", W);
    line.setAttribute("y1", H * g / 4); line.setAttribute("y2", H * g / 4);
    svg.appendChild(line);
  }

  const ceiling = document.createElementNS(svg.namespaceURI, "line");
  ceiling.setAttribute("class", "ceiling");
  ceiling.setAttribute("x1", 0); ceiling.setAttribute("x2", W);
  ceiling.setAttribute("y1", y(d.optimum)); ceiling.setAttribute("y2", y(d.optimum));
  svg.appendChild(ceiling);

  const path = (key, cls) => {
    const node = document.createElementNS(svg.namespaceURI, "polyline");
    node.setAttribute("class", cls);
    node.setAttribute("points",
      d.trace.map((p, i) => `${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" "));
    svg.appendChild(node);
    return node;
  };
  const walk = path("value", "walk");
  const crest = path("best", "crest");

  // Drawn rather than appearing, so the search is watched instead of reported.
  if (!CALM) {
    [walk, crest].forEach((node, k) => {
      const len = node.getTotalLength ? 0 : 0;
      requestAnimationFrame(() => {
        const total = node.getTotalLength();
        node.style.setProperty("--len", total);
        node.style.strokeDasharray = total;
        node.style.strokeDashoffset = total;
        node.style.animation = `sweep ${1.1 + k * 0.25}s ease-out forwards`;
      });
    });
  }
  box.appendChild(svg);

  const key = el("div","legend");
  [[t("ui.camp_line_now"), "var(--teal)"],
   [t("ui.camp_line_best"), "var(--gold)"],
   [t("ui.camp_line_top"), "var(--stop)"]].forEach(([label, colour]) => {
    const item = el("span");
    const swatch = el("i");
    swatch.style.background = colour;
    item.appendChild(swatch);
    item.appendChild(el("span", null, label));
    key.appendChild(item);
  });
  box.appendChild(key);
  return box;
}

/* ---------- asking the rulebook about itself ---------- */

/* Om's layer. Every other screen runs the rules forwards: here is a family,
   here is what they can claim. These three run them backwards, and not one of
   them needs a single applicant.

   Abduction, verification and diagnosis, which are three named corners of
   classical AI and all three answerable with the solver that is already
   here. */
async function studioSection(body) {
  const tok = drawing;
  const head = el("div","head mt");
  head.appendChild(el("h2", null, t("ui.studio_title")));
  head.appendChild(el("div","rule"));
  head.appendChild(el("p", null, t("ui.studio_blurb")));
  body.appendChild(head);

  let reach;
  try { reach = await api("/api/studio-reach?lang=" + S.lang); }
  catch { return; }
  if (stale(tok)) return;

  const ok = el("div", reach.unreachable.length ? "note stop" : "note ok");
  ok.appendChild(el("div", null, t("ui.studio_reach")));
  ok.appendChild(el("div","sub",
    t("ui.studio_reach_line", {ok:reach.ok, total:reach.total})));
  if (reach.unreachable.length) {
    ok.appendChild(el("div","sub",
      reach.unreachable.map(x => x.name).join(", ")));
  }
  body.appendChild(ok);

  body.appendChild(witnessProbe(reach.schemes));
  body.appendChild(gapProbe());
  body.appendChild(faultProbe(reach.schemes));
}

function picker(schemes, current) {
  const sel = document.createElement("select");
  schemes.forEach(x => {
    const o = document.createElement("option");
    o.value = x.id; o.textContent = x.name;
    sel.appendChild(o);
  });
  if (current) sel.value = current;
  return sel;
}

/* Abduction: hand the solver a scheme's clauses and ask it to invent somebody
   who satisfies them. A rule with a mistake in it produces a witness that is
   visibly odd, which is faster than reading the rule again. */
function witnessProbe(schemes) {
  const box = el("div","probe");
  box.appendChild(el("h3", null, t("ui.studio_witness")));
  box.appendChild(el("p", null, t("ui.studio_witness_blurb")));
  const sel = picker(schemes);
  box.appendChild(sel);
  const out = el("div");
  const go = el("button","cta", t("ui.studio_witness_go"));
  go.onclick = async () => {
    out.innerHTML = "";
    out.appendChild(el("div","sub waiting", t("ui.checking") || "..."));
    let d;
    try { d = await api("/api/studio-witness", {scheme:sel.value}); }
    catch { out.innerHTML = ""; return; }
    out.innerHTML = "";
    if (!d.found) return out.appendChild(
      el("div","note stop", t("ui.studio_witness_none")));
    const card = el("div","card-out");
    d.about.forEach((a, i) => {
      const line = el("div","fact");
      line.appendChild(el("b", null, a.label));
      line.appendChild(el("span","ev", a.value));
      card.appendChild(enter(line, i));
    });
    out.appendChild(card);
  };
  box.appendChild(go);
  box.appendChild(out);
  return box;
}

/* Verification: add the negation of every scheme at once and ask whether a
   household exists that satisfies none of them. The answer is only
   interesting once they are pinned poor, and more interesting still once
   they are pinned to have done the paperwork right. */
function gapProbe() {
  const box = el("div","probe");
  box.appendChild(el("h3", null, t("ui.studio_gap")));
  box.appendChild(el("p", null, t("ui.studio_gap_blurb")));

  const ways = el("div","ways");
  const out = el("div");
  let mode = "poor";

  const run = async () => {
    out.innerHTML = "";
    out.appendChild(el("div","sub waiting", t("ui.checking") || "..."));
    let d;
    try { d = await api("/api/studio-gap", {mode:mode}); }
    catch { out.innerHTML = ""; return; }
    out.innerHTML = "";

    const verdict = el("div", d.found ? "note stop" : "note ok");
    verdict.textContent = d.found ? t("ui.studio_gap_found")
                                  : t("ui.studio_gap_none");
    out.appendChild(verdict);

    if (d.found) {
      const card = el("div","card-out");
      d.about.forEach((a, i) => {
        const line = el("div","fact");
        line.appendChild(el("b", null, a.label));
        line.appendChild(el("span","ev", a.value));
        card.appendChild(enter(line, i));
      });
      out.appendChild(card);
      out.appendChild(el("div","src mt", t("ui.studio_gap_note")));
    }
  };

  [["anyone","studio_gap_anyone"], ["poor","studio_gap_poor"],
   ["doing_right","studio_gap_doing_right"]].forEach(([id, key]) => {
    const b = el("button", id === mode ? "on" : null, t("ui." + key));
    b.onclick = () => {
      mode = id;
      [...ways.children].forEach(c => c.classList.remove("on"));
      b.classList.add("on");
      run();
    };
    ways.appendChild(b);
  });
  box.appendChild(ways);

  const go = el("button","cta", t("ui.studio_gap_go"));
  go.onclick = run;
  box.appendChild(go);
  box.appendChild(out);
  return box;
}

/* Diagnosis: the app says they qualify, the counter said otherwise, so one of
   the two is working from a different answer. Single fault first, which is
   the ordinary assumption and the right one: a clerk mistyping one figure is
   far likelier than two independent errors, and one cause is something
   somebody can go and check. */
function faultProbe(schemes) {
  const box = el("div","probe");
  box.appendChild(el("h3", null, t("ui.studio_fault")));
  box.appendChild(el("p", null, t("ui.studio_fault_blurb")));
  const sel = picker(schemes);
  box.appendChild(sel);
  const out = el("div");

/* ---------- saying it in your own words ---------- */

/* The interview is a good way to be asked and a slow way to volunteer. Someone
   who already knows their mother is 62 and widowed should be able to say so in
   one sentence, and the questions should then skip what they covered.

   What comes back is not applied blindly. The server returns three lists, and
   the shape of the reply is the architecture: facts it accepted, facts it
   wants confirmed, and readings it refused with the reason. */
function tellCard() {
  const c = el("div","card");
  c.appendChild(el("h3", null, t("ui.tell_title")));
  c.appendChild(el("div","sub", t("ui.tell_help")));

  const row = el("div","tellbox mt");
  const inp = document.createElement("input");
  inp.type = "text";
  inp.placeholder = t("ui.tell_hint");
  row.appendChild(inp);

  const mic = el("button","mic");
  mic.appendChild(icon("mic", 21, "currentColor"));
  mic.title = t("ui.mic");
  mic.onclick = () => speak(inp, mic, out);
  row.appendChild(mic);
  c.appendChild(row);

  const go = el("button","cta", t("ui.tell_go"));
  const out = el("div","mt");
  go.onclick = () => understand(inp.value, out, inp);
  inp.onkeydown = e => { if (e.key === "Enter") understand(inp.value, out, inp); };
  c.appendChild(go);
  c.appendChild(out);
  return c;
}

async function understand(text, out, inp) {
  if (!text || !text.trim()) return;
  out.innerHTML = "";
  out.appendChild(el("div","sub", t("ui.checking") || "Checking"));

  let data;
  try { data = await api("/api/understand", {text:text, facts:S.facts}); }
  catch { out.innerHTML = ""; return out.appendChild(el("div","note stop",
    t("ui.error_body") || "Could not read that")); }

  out.innerHTML = "";
  renderHeard(data, out);
  if (!data.accepted.length && !data.confirm.length && !data.refused.length) {
    return out.appendChild(el("div","note warn", t("ui.tell_nothing")));
  }
  out.appendChild(readWorking(text));
  if (inp) inp.value = "";
  const on = el("button","cta mt", t("ui.start"));
  on.onclick = ask;
  out.appendChild(on);
}

/* The same panel a decision gets, one layer earlier. A word list that cannot
   show its working is indistinguishable from a model that guessed, which is
   the entire argument for using a word list. */
function readWorking(text) {
  const box = el("details","work");
  box.appendChild(el("summary", null, t("ui.working") || "How we worked this out"));
  let loaded = false;
  box.ontoggle = async () => {
    if (!box.open || loaded) return;
    loaded = true;
    let tr;
    try { tr = await api("/api/read-trace", {text:text, facts:S.facts}); }
    catch { return; }
    (tr.steps || []).forEach(s => box.appendChild(stepBlock(s)));
  };
  return box;
}

function renderHeard(data, out) {
  data.accepted.forEach(a => adopt(a.attribute, a.raw, a.source));
  if (data.relation) S.relation = data.relation;

  if (data.accepted.length) {
    const box = el("div","heard");
    if (data.relation) {
      box.appendChild(el("div","who",
        t("ui.tell_relation") + ": " + data.relation.label));
    }
    data.accepted.forEach(a => {
      const r = el("div","fact");
      r.appendChild(el("b", null, a.label + ": " + a.value));
      const why = a.inferred_from
        ? t("ui.tell_inferred") + " " + (a.evidence || "")
        : t("ui.tell_from") + " " + (a.evidence || "");
      r.appendChild(el("span","ev", why));
      box.appendChild(r);
    });
    out.appendChild(box);
  }

  data.confirm.forEach(q => out.appendChild(askRow(q, out)));

  if (data.refused.length) {
    const box = el("div","note stop");
    box.appendChild(el("div", null, t("ui.refused_title")));
    data.refused.forEach(r => box.appendChild(el("div","sub",
      r.label + ": " + r.value + (r.detail ? "  ·  " + r.detail : ""))));
    out.appendChild(box);
  }
}

/* A reading the system is not sure enough to use. "Around a lakh" is an
   estimate, and "husband nahi hai" is said by unmarried women as often as by
   widows, so both are read back rather than assumed. */
function askRow(q, out) {
  const box = el("div","askrow");
  box.appendChild(el("div","why", q.why));
  let line = q.label + ": " + q.value;
  if (q.alternative != null) line += "   (" + q.alternative + "?)";
  box.appendChild(el("div", null, line));
  if (q.evidence) box.appendChild(el("div","ev", t("ui.tell_from") + " " + q.evidence));

  const pair = el("div","pair mt");
  const yes = el("button","cta", t("ui.confirm_yes"));
  yes.onclick = async () => {
    let res;
    try { res = await api("/api/confirm",
      {attribute:q.attribute, value:q.raw, facts:S.facts}); }
    catch { return; }
    box.innerHTML = "";
    if (!res.ok) {
      box.className = "note stop";
      return box.appendChild(el("div", null,
        res.label + ": " + (res.detail || t("ui.assist_not_usable"))));
    }
    adopt(res.attribute, res.raw, "confirmed");
    box.className = "heard";
    const r = el("div","fact");
    r.appendChild(el("b", null, res.label + ": " + res.value));
    box.appendChild(r);
  };
  const no = el("button","ghost", t("ui.confirm_no"));
  no.onclick = () => box.remove();
  pair.appendChild(yes); pair.appendChild(no);
  box.appendChild(pair);
  return box;
}

/* ---------- speaking ---------- */

/* The browser's speech recogniser sends the audio to whoever made the browser.
   Everything else in this app stays on the machine, so this is the one place
   that is not true, and it is said plainly and asked for once rather than
   buried in a policy. Off unless the person says yes; typing always works. */
function speak(inp, mic, out) {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) {
    out.innerHTML = "";
    return out.appendChild(el("div","note warn", t("ui.mic_unavailable")));
  }
  if (S.listening) { S.listening.stop(); return; }
  if (!S.micOk) return micConsent(inp, mic, out);

  const rec = new Rec();
  rec.lang = S.speech;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  mic.classList.add("on");
  mic.innerHTML = "";
  mic.appendChild(icon("cross", 21, "currentColor"));
  const done = () => {
    mic.classList.remove("on"); mic.innerHTML = "";
    mic.appendChild(icon("mic", 21, "currentColor")); S.listening = null;
  };
  rec.onresult = e => {
    const said = e.results[0][0].transcript;
    inp.value = said;
    done();
    understand(said, out, inp);
  };
  rec.onerror = done;
  rec.onend = done;
  S.listening = rec;
  try { rec.start(); } catch { done(); }
}

function micConsent(inp, mic, out) {
  out.innerHTML = "";
  const box = el("div","note warn");
  box.appendChild(el("div", null, t("ui.mic_warn")));
  const pair = el("div","pair mt");
  const ok = el("button","cta", t("ui.mic"));
  ok.onclick = () => { S.micOk = true; box.remove(); speak(inp, mic, out); };
  const nope = el("button","ghost", t("ui.confirm_no"));
  nope.onclick = () => box.remove();
  pair.appendChild(ok); pair.appendChild(nope);
  box.appendChild(pair);
  out.appendChild(box);
}

/* ---------- reading a photographed paper ---------- */

function photoCard() {
  const c = el("div","card");
  c.appendChild(el("h3", null, t("ui.doc_photo_title")));
  c.appendChild(el("div","sub", t("ui.doc_photo_help")));

  const pick = document.createElement("input");

  pick.accept = "image/*";
  pick.className = "hide";

  const btn = labelled("ghost mt", "camera", t("ui.doc_photo_pick"), 20);
  btn.style.justifyContent = "center"; btn.style.width = "100%";
  btn.onclick = () => pick.click();
  pick.onchange = () => { if (pick.files[0]) readPaper(pick.files[0], out); };

  c.appendChild(btn); c.appendChild(pick); c.appendChild(out);
  if (S.can.packs && S.can.packs.length) {

      t("ui.doc_packs", {packs: S.can.packs.join(", ")})));
  }

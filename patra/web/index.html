<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6e4e">
<title>PATRA</title>
<style>
  /* Built after usa.gov rather than after a phone app. That site is the
     clearest government service index anyone has shipped, and its structure is
     deliberate: serif headings with a heavy rule under them, a tinted band
     behind every card grid, square white cards with a thin border, a centred
     line mark separated from the text by a dotted rule, and a great deal of
     air. It reads as an official document you can trust rather than a product
     trying to be friendly.

     Square corners and serif headings are the two choices doing most of the
     work. Rounded cards and a sans-serif stack are what make an interface look
     generic. */
  :root {
    --green:#12633f; --green-dark:#0c4a2f; --green-soft:#e8f2ec;
    --band:#dceaf2;
    --amber:#8a4d06; --amber-soft:#fbf1e0;
    --red:#8c2b22; --red-soft:#fbeae8;
    --ink:#1b1b1b; --grey:#565c65; --line:#c9ced4; --hair:#dfe3e7;
    --bg:#ffffff; --card:#ffffff; --bar-h:60px;
    --serif: Georgia, "Times New Roman", "Noto Serif Devanagari", serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Source Sans Pro", system-ui, -apple-system, "Segoe UI", Roboto,
                "Noto Sans", sans-serif;
    font-size:17px; line-height:1.6;
  }
  body { padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom)); }

  .bar {
    position:sticky; top:0; z-index:20; background:var(--green-dark); color:#fff;
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top));
    border-bottom:4px solid var(--green);
  }
  .bar h1 { margin:0; font-family:var(--serif); font-size:21px; font-weight:700; }
  .bar .sub { font-size:13px; opacity:.88; color:#fff; }
  .bar .lang {
    margin-left:auto; background:rgba(255,255,255,.14); color:#fff;
    border:1px solid rgba(255,255,255,.35); border-radius:2px;
    padding:7px 12px; font:inherit; font-size:14px; width:auto;
    cursor:pointer; margin-bottom:0;
  }

  .body { max-width:660px; margin:0 auto; padding:0 0 28px; }

  /* A page heading with the heavy rule under it, straight off usa.gov. */
  .head { padding:22px 16px 0; }
  .head h2 {
    font-family:var(--serif); font-size:27px; line-height:1.25;
    margin:0 0 12px; color:var(--green-dark); font-weight:700;
  }
  .head .rule { height:5px; background:var(--green); margin-bottom:16px; }
  .head p { margin:0 0 16px; color:var(--grey); font-size:16px; }

  .band { background:var(--band); padding:18px 16px 4px; }
  .plain { padding:0 16px; }

  .card {
    background:var(--card); border:1px solid var(--line); border-radius:2px;
    padding:18px; margin-bottom:16px;
  }
  .card h3 {
    margin:0 0 6px; font-size:18px; font-weight:700; color:var(--ink);
  }
  .card .mark {
    text-align:center; font-size:26px; line-height:1;
    padding-bottom:12px; margin-bottom:14px;
    border-bottom:1px dotted var(--line);
  }
  .sub { color:var(--grey); font-size:15.5px; }
  .mt { margin-top:14px; }

  button {
    font:inherit; cursor:pointer; display:block; width:100%; text-align:left;
    padding:14px 15px; margin-bottom:9px; border:1px solid var(--line);
    border-radius:2px; background:#fff; color:var(--ink);
  }
  button:hover { border-color:var(--green); }
  .cta { background:var(--green); color:#fff; border-color:var(--green);
         text-align:center; font-weight:700; font-size:17px; padding:15px; }
  .ghost { text-align:center; color:var(--green); background:transparent;
           border-color:var(--green); font-weight:600; }
  .pair { display:flex; gap:10px; }
  .pair button { margin-bottom:0; }

  .opt { display:flex; align-items:center; gap:12px; }
  .opt.on { border-color:var(--green); border-width:2px; background:var(--green-soft); }
  .opt.on::after { content:"\2713"; margin-left:auto; color:var(--green);
                   font-weight:800; font-size:19px; }

  .track { display:flex; gap:3px; margin-bottom:16px; }
  .track i { flex:1; height:4px; background:var(--hair); }
  .track i.on { background:var(--green); }
  .qtext { font-family:var(--serif); font-size:24px; font-weight:700;
           line-height:1.35; margin:0 0 6px; }
  .qwhy { color:var(--amber); font-size:14px; margin:0 0 12px; }
  .hear { width:auto; padding:8px 14px; margin:0 0 16px; font-size:15px;
          color:var(--green); border-color:var(--green); background:#fff;
          font-weight:600; }
  input[type=number], input[type=text] {
    font:inherit; font-size:21px; width:100%; padding:14px;
    border:1px solid var(--line); border-radius:2px; margin-bottom:10px;
  }
  input[type=number] { text-align:center; }

  /* One claim, one card, like a topic tile. */
  .item { background:#fff; border:1px solid var(--line); border-radius:2px;
          padding:16px; margin-bottom:14px; }
  .item.near { border-left:5px solid var(--amber); }
  .item.ok { border-left:5px solid var(--green); }
  .item h3 { font-family:var(--serif); font-size:19px; margin:0 0 6px;
             color:var(--green-dark); }
  .item.near h3 { color:var(--amber); }
  .item .what { color:var(--grey); font-size:15.5px; margin-bottom:10px; }
  .item .where { font-size:16px; }

  .note { border-radius:2px; padding:11px 13px; font-size:15px; margin-top:10px;
          border-left:4px solid var(--line); }
  .note.ok { background:var(--green-soft); border-left-color:var(--green); }
  .note.warn { background:var(--amber-soft); border-left-color:var(--amber); }
  .note.stop { background:var(--red-soft); border-left-color:var(--red); }

  ol.route { list-style:none; counter-reset:r; padding:0; margin:4px 0 0; }
  ol.route li { counter-increment:r; position:relative; padding:0 0 20px 46px; }
  ol.route li::before {
    content:counter(r); position:absolute; left:0; top:0; width:30px; height:30px;
    background:var(--green); color:#fff; border-radius:2px;
    display:grid; place-items:center; font-weight:700; font-size:15px;
  }
  ol.route li::after { content:""; position:absolute; left:14.5px; top:32px;
                       bottom:8px; width:1px; background:var(--line); }
  ol.route li:last-child::after { display:none; }
  ol.route li b { font-size:16.5px; }

  details.work { border-top:1px dotted var(--line); margin-top:14px; padding-top:11px; }
  details.work summary { cursor:pointer; color:var(--green); font-weight:700;
                         font-size:15px; list-style:none; text-decoration:underline; }
  details.work summary::-webkit-details-marker { display:none; }
  .step { border-left:2px solid var(--hair); margin:10px 0 0 4px; padding:0 0 4px 14px; }
  .step .how { font-size:12.5px; color:var(--green); font-weight:700;
               text-transform:uppercase; letter-spacing:.5px; }
  .step .what2 { font-size:15px; }
  .step .bits { font-size:14px; color:var(--grey); }
  .step .bits div { padding:1px 0; }
  .qc { font-size:13px; color:var(--grey); font-style:italic; }

  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex;
          background:#fff; border-top:2px solid var(--green);
          padding-bottom:env(safe-area-inset-bottom); }
  .tabs button { flex:1; margin:0; border:0; border-radius:0; background:none;
                 text-align:center; padding:9px 4px; color:var(--grey);
                 font-size:12.5px; line-height:1.25; }
  .tabs button .ic { display:block; font-size:19px; margin-bottom:2px; }
  .tabs button.on { color:var(--green-dark); font-weight:700;
                    box-shadow:inset 0 3px 0 var(--green); }

  .fab { position:fixed; right:16px; z-index:25; width:56px; height:56px;
         bottom:calc(var(--bar-h) + 16px + env(safe-area-inset-bottom));
         border-radius:50%; border:0; padding:0; margin:0; background:var(--green);
         color:#fff; font-size:23px; box-shadow:0 3px 10px rgba(0,0,0,.3);
         display:grid; place-items:center; }
  .sheet { position:fixed; inset:0; z-index:40; background:#fff;
           display:flex; flex-direction:column; }
  .sheet .bar { position:static; }
  .sheet .log { flex:1; overflow-y:auto; padding:14px 16px; background:var(--band); }
  .sheet .compose { display:flex; gap:8px; padding:10px 12px;
                    padding-bottom:calc(10px + env(safe-area-inset-bottom));
                    background:#fff; border-top:1px solid var(--line); }
  .sheet .compose input { margin:0; font-size:17px; }
  .sheet .compose button { width:auto; margin:0; padding:0 18px; }
  .bubble { max-width:88%; padding:11px 14px; border-radius:2px;
            margin-bottom:10px; font-size:16px; border:1px solid var(--line); }
  .bubble.me { margin-left:auto; background:var(--green); color:#fff;
               border-color:var(--green); }
  .bubble.it { background:#fff; }
  .bubble.it b { display:block; margin-bottom:4px; font-family:var(--serif);
                 font-size:17px; }
  .bubble.it .li { font-size:15px; color:var(--grey); padding:2px 0; }
  .chip { display:inline-block; width:auto; margin:5px 6px 0 0; padding:8px 12px;
          font-size:14px; border-radius:2px; background:#fff; }
  .empty { text-align:center; color:var(--grey); padding:34px 18px; }
  .hide { display:none !important; }

  @media print {
    body { padding:0; }
    .bar,.tabs,.fab,button,details.work { display:none !important; }
    .band { background:#fff; }
    .card,.item { border:1px solid #999; page-break-inside:avoid; }
  }
</style>
</head>
<body>

<header class="bar">
  <div>
    <h1 id="brand">PATRA</h1>
    <div class="sub" id="tagline"></div>
  </div>
  <button class="lang hide" id="lang-btn"></button>
</header>

<main class="body" id="view"></main>

<button class="fab hide" id="fab" aria-label="Help">💬</button>

<nav class="tabs hide" id="tabs">
  <button data-tab="home" class="on"><span class="ic">🏠</span><span id="tab-home"></span></button>
  <button data-tab="papers"><span class="ic">📋</span><span id="tab-papers"></span></button>
  <button data-tab="help"><span class="ic">❓</span><span id="tab-help"></span></button>
</nav>

<div class="sheet hide" id="chat">
  <header class="bar">
    <div><h1 id="chat-title"></h1><div class="sub" id="chat-sub"></div></div>
    <button class="lang" id="chat-close">✕</button>
  </header>
  <div class="log" id="chat-log"></div>
  <div class="compose">
    <input type="text" id="chat-in" autocomplete="off">
    <button class="cta" id="chat-send">→</button>
  </div>
</div>

<script>
"use strict";

/* Concrete objects, not abstract glyphs. The research on low-literate users is
   blunt: a stylised symbol carries no meaning, a recognisable thing does. */
const PIC = {
  aadhaar:"🪪", voter_id:"🗳️", pan_card:"💳", ration_card:"🍚",
  birth_certificate:"👶", school_certificate:"🎓", electricity_bill:"💡",
  domicile_certificate:"🏠", income_certificate:"💰", caste_certificate:"📜",
  bank_account:"🏦", bank_aadhaar_seeding:"🔗", disability_certificate:"♿",
  death_certificate:"🕯️", land_records:"🌾", job_card:"⛏️", passport_photo:"📷"
};

const S = {
  lang:"en", speech:"en-IN", words:{}, langs:[],
  facts:{}, order:[], held:new Set(), asked:0,
  result:null, tab:"home"
};
const KEY = "patra.lang";

const $  = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const show = (id) => $(id).classList.remove("hide");
const hide = (id) => $(id).classList.add("hide");

function t(path, vars) {
  let n = S.words;
  for (const k of path.split(".")) {
    if (!n || typeof n !== "object" || !(k in n)) return "";
    n = n[k];
  }
  let out = String(n ?? "");
  if (vars) for (const [k, v] of Object.entries(vars)) out = out.split("{"+k+"}").join(v);
  return out;
}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({...body, lang:S.lang})
  } : {});
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

/* Voice uses the browser's own synthesiser, so it needs no network and no
   model. Where a language has no voice installed the button is simply quiet,
   which is why text is never replaced by audio. */
function bestVoice() {
  const want = S.speech.toLowerCase();
  const all = speechSynthesis.getVoices();
  return all.find(v => v.lang && v.lang.toLowerCase() === want)
      || all.find(v => v.lang && v.lang.toLowerCase().startsWith(want.slice(0,2)))
      || null;
}

let playing = null;

/* A real recorded voice when one exists, the browser's otherwise.
   tools/voice.py generates the clips ahead of time, so this reads a local
   file and never calls out. */
function say(text) {
  if (!text) return;
  if (playing) { playing.pause(); playing = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();

  const clip = new Audio("/api/voice?lang=" + encodeURIComponent(S.lang) +
                         "&text=" + encodeURIComponent(String(text).trim()));
  clip.onerror = () => { playing = null; robot(text); };
  playing = clip;
  clip.play().catch(() => { playing = null; robot(text); });
}

function robot(text) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const voice = bestVoice();
  // One utterance per clause. The browser voice is what it is, but reading a
  // long sentence as a single breathless run is most of what makes it hard to
  // follow, and splitting on punctuation fixes that much.
  String(text).split(/(?<=[.!?।])\s+|,\s+/).filter(Boolean).forEach(part => {
    const u = new SpeechSynthesisUtterance(part.trim());
    u.lang = S.speech; u.rate = .85; u.pitch = 1.0;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  });
}

function view() { const v = $("view"); v.innerHTML = ""; return v; }

function heading(parent, title, blurb) {
  const h = el("div","head");
  h.appendChild(el("h2", null, title));
  h.appendChild(el("div","rule"));
  if (blurb) h.appendChild(el("p", null, blurb));
  parent.appendChild(h);
  return h;
}

function band(parent) {
  const b = el("div","band");
  parent.appendChild(b);
  return b;
}

function plain(parent) {
  const b = el("div","plain");
  parent.appendChild(b);
  return b;
}

function offline() {
  const v = view();
  const c = el("div","card");
  c.appendChild(el("h2", null, t("ui.error_title") || "Cannot reach the app"));
  c.appendChild(el("p","sub", t("ui.error_offline") ||
    'Open a terminal, run "python3 -m patra.web.server", then open http://127.0.0.1:8765'));
  v.appendChild(c);
}

/* ---------- language ---------- */

async function boot() {
  try { S.langs = await api("/api/languages"); }
  catch { return offline(); }
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  const found = S.langs.find(l => l.code === saved);
  if (found) return pickLanguage(found);
  languageScreen();
}

function languageScreen() {
  hide("tabs"); hide("fab");
  const v = view();
  const c = el("div","card");
  c.appendChild(el("h2", null, "भाषा चुनें  ·  Choose your language"));
  c.appendChild(el("p","sub","अपनी भाषा पर दबाएँ"));
  const box = el("div","mt");
  S.langs.forEach(l => {
    const b = el("button", null);
    b.style.fontSize = "21px";
    b.textContent = l.name + (l.complete ? "" : "  ·  incomplete");
    if (!l.complete) b.style.color = "var(--grey)";
    b.onclick = () => pickLanguage(l);
    box.appendChild(b);
  });
  c.appendChild(box);
  v.appendChild(c);
}

async function pickLanguage(l) {
  S.lang = l.code; S.speech = l.speech || l.code;
  try { localStorage.setItem(KEY, l.code); } catch {}
  S.words = await api("/api/strings?lang=" + l.code);
  document.documentElement.lang = l.code;

  $("brand").textContent      = t("ui.title") || "PATRA";
  $("tagline").textContent    = t("ui.tagline");
  $("tab-home").textContent   = t("ui.tab_home")   || "Claims";
  $("tab-papers").textContent = t("ui.tab_papers") || "Papers";
  $("tab-help").textContent   = t("ui.tab_help")   || "Help";
  $("chat-title").textContent = t("ui.chat_title") || "Ask a question";
  $("chat-sub").textContent   = t("ui.chat_sub")   || "";
  $("chat-in").placeholder    = t("ui.chat_hint")  || "Type your question";

  const b = $("lang-btn");
  b.textContent = "🌐 " + l.name;
  b.classList.remove("hide");
  b.onclick = languageScreen;

  show("tabs"); show("fab");
  S.facts = {}; S.order = []; S.held = new Set(); S.asked = 0; S.result = null;
  go("home");
}

/* ---------- tabs ---------- */

document.querySelectorAll(".tabs button").forEach(b =>
  b.onclick = () => go(b.dataset.tab));

function go(tab) {
  S.tab = tab;
  document.querySelectorAll(".tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === tab));
  window.scrollTo(0,0);
  if (tab === "home")   return S.result ? renderResult() : startScreen();
  if (tab === "papers") return papersTab();
  if (tab === "help")   return helpTab();
}

/* ---------- start ---------- */

function startScreen() {
  const v = view();
  heading(v, t("ui.docs_title"), t("ui.docs_help"));
  const wrap = plain(v);
  const priv = el("div","note ok");
  priv.textContent = t("ui.privacy");
  wrap.appendChild(priv);

  const b = band(v);
  const box = el("div");
  b.appendChild(box);

  const foot = plain(v);
  const go_ = el("button","cta mt", t("ui.start"));
  go_.onclick = ask;
  foot.appendChild(go_);

  api("/api/documents?lang=" + S.lang).then(docs => {
    docs.forEach(d => {
      const bt = el("button","opt");
      bt.appendChild(el("span", null, d.name));
      if (S.held.has(d.id)) bt.classList.add("on");
      bt.onclick = () => {
        if (S.held.has(d.id)) { S.held.delete(d.id); bt.classList.remove("on"); }
        else { S.held.add(d.id); bt.classList.add("on"); say(d.name); }
      };
      box.appendChild(bt);
    });
  }).catch(offline);
}

/* ---------- questions ---------- */

async function ask() {
  let data;
  try { data = await api("/api/question", {facts:S.facts}); }
  catch { return offline(); }
  const q = data.question;
  if (!q) return finish();

  const v = view();
  const c = el("div","head");

  const track = el("div","track");
  for (let i = 0; i < 10; i++) {
    const seg = el("i"); if (i < S.asked) seg.className = "on"; track.appendChild(seg);
  }
  c.appendChild(track);
  c.appendChild(el("p","qtext", q.text));
  if (q.sensitive) c.appendChild(el("p","qwhy", t("ui.why_asking")));

  const hear = el("button","hear","🔊  " + (t("ui.listen") || "Listen"));
  hear.onclick = () => say(q.text);
  c.appendChild(hear);

  const box = el("div");
  c.appendChild(box);

  if (q.kind === "bool") {
    [[true, t("ui.yes")||"Yes","✔️"], [false, t("ui.no")||"No","✖️"]]
      .forEach(([val, lab, pic]) => {
        const b = el("button","opt");
        b.appendChild(el("span","pic", pic));
        b.appendChild(el("span", null, lab));
        b.onclick = () => answer(q.attribute, val);
        box.appendChild(b);
      });
  } else if (q.kind === "enum") {
    q.options.forEach(o => {
      const b = el("button", null, o.label);
      b.onclick = () => answer(q.attribute, o.value);
      box.appendChild(b);
    });
  } else {
    const inp = document.createElement("input");
    inp.type = "number"; inp.inputMode = "numeric";
    if (q.low  != null) inp.min = q.low;
    if (q.high != null) inp.max = q.high;
    box.appendChild(inp);
    const nxt = el("button","cta", t("ui.next") || "Next");
    const send = () => {
      let n = parseInt(inp.value, 10);
      if (Number.isNaN(n)) return inp.focus();
      if (q.low != null && n < q.low) n = q.low;
      // Somebody typing 500 for their age has not told us they are 500. Cap it
      // and show it back as "120+" rather than refusing the answer.
      if (q.high != null && n > q.high) n = q.high;
      answer(q.attribute, n);
    };
    nxt.onclick = send;
    inp.onkeydown = e => { if (e.key === "Enter") send(); };
    box.appendChild(nxt);
    setTimeout(() => inp.focus(), 40);
  }

  const pair = el("div","pair mt");
  if (S.order.length) {
    const back = el("button","ghost","← " + (t("ui.back") || "Back"));
    back.onclick = () => {
      const last = S.order.pop();
      if (last) delete S.facts[last];
      S.asked = Math.max(0, S.asked - 1);
      ask();
    };
    pair.appendChild(back);
  }
  const skip = el("button","ghost", t("ui.dont_know") || "Not sure");
  skip.onclick = finish;
  pair.appendChild(skip);
  c.appendChild(pair);
  v.appendChild(c);
}

function answer(name, val) {
  S.facts[name] = val;
  S.order.push(name);
  S.asked = Math.min(10, S.asked + 1);
  ask();
}

/* ---------- results ---------- */

async function finish() {
  const v = view();
  v.appendChild(el("div","empty", t("ui.checking") || "Checking"));
  try { S.result = await api("/api/result", {facts:S.facts, documents:[...S.held]}); }
  catch { return offline(); }
  renderResult();
}

function renderResult() {
  const d = S.result;
  const v = view();
  if (!d) return startScreen();

  if (d.clashes && d.clashes.length) {
    const c = el("div","card");
    c.appendChild(el("h2", null, t("ui.mismatch_title")));
    c.appendChild(el("p","sub", t("ui.mismatch_body")));
    d.clashes.forEach(x => {
      const n = el("div","note stop");
      x.rule.forEach(r => n.appendChild(el("div", null, r)));
      x.answers.forEach(a => n.appendChild(el("div","sub",
        t("ui.mismatch_you_said") + ": " + a.label + " " + a.value)));
      c.appendChild(n);
    });
    const again = el("button","cta mt", t("ui.start_over"));
    again.onclick = restart;
    c.appendChild(again);
    return v.appendChild(c);
  }

  if (d.claims.length) {
    heading(v, t("ui.claims_title", {n:d.claims.length}));
    const b = band(v);
    d.claims.forEach(x => b.appendChild(claimRow(x)));
  } else {
    heading(v, t("ui.claims_none_title"), t("ui.claims_none_body"));
  }

  if (d.near && d.near.length) {
    heading(v, t("ui.near_title"));
    const b = band(v);
    d.near.forEach(x => b.appendChild(nearRow(x)));
  }

  if (d.undecided && d.undecided.length) {
    heading(v, t("ui.undecided_title") || "Could not check these",
            t("ui.undecided_body") || "");
    const b = band(v);
    d.undecided.forEach(x => {
      const row = el("div","item near");
      row.appendChild(el("h3", null, x.name));
      row.appendChild(el("div","what",
        (t("ui.undecided_need") || "We still need") + ": " + x.missing.join(", ")));
      b.appendChild(row);
    });
    const more = el("button","cta", t("ui.undecided_go") || "Answer the rest");
    more.onclick = ask;
    b.appendChild(more);
  }

  if (d.paperwork && d.paperwork.steps.length) {
    heading(v, t("ui.papers_title"), t("ui.papers_summary",
      {trips:d.paperwork.trips, fee:d.paperwork.fee, days:d.paperwork.days}));
    const jump = el("button","cta", t("ui.papers_open") || "Open the list");
    jump.onclick = () => go("papers");
    plain(v).appendChild(jump);
  }

  const acts = plain(v);
  const pr = el("button", null, "🖨️  " + (t("ui.print") || "Print"));
  pr.onclick = () => window.print();
  acts.appendChild(pr);
  const ag = el("button","ghost", t("ui.start_over") || "Start again");
  ag.onclick = restart;
  acts.appendChild(ag);
}

function claimRow(x) {
  const row = el("div","item ok");
  const txt = el("div");
  txt.appendChild(el("h3", null, x.name));
  txt.appendChild(el("div","what", x.benefit));
  txt.appendChild(el("div","where", (t("ui.apply_at")||"Go to") + ": " + x.apply_at));
  if (x.check) {
    txt.appendChild(el("div","note warn",
      t("ui.please_check") + ". " + t("ui.check_body",
        {label:x.check.label, now:x.check.now, flips:x.check.flips})));
  }
  const hear = el("button","hear","🔊 " + (t("ui.listen") || "Listen"));
  hear.onclick = () => say(x.name + ". " + x.benefit);
  txt.appendChild(hear);
  txt.appendChild(working(x.id));
  row.appendChild(txt);
  return row;
}

function nearRow(x) {
  const row = el("div","item near");
  const txt = el("div");
  txt.appendChild(el("h3", null, x.name));
  txt.appendChild(el("div","what", x.benefit));
  if (x.needed) {
    const n = el("div","note");
    n.style.background = "var(--bg)";
    n.appendChild(el("div", null, (t("ui.near_needed")||"You need") + ": " + x.needed));
    x.you_said.forEach(a => n.appendChild(el("div","sub",
      (t("ui.near_you_said")||"You told us") + ": " + a.label + " " + a.value)));
    txt.appendChild(n);
  }
  const fix = el("div","note ok");
  fix.appendChild(el("div", null, "👉  " + (t("ui.near_change") || "What would change it")));
  x.fix.forEach(f => {
    fix.appendChild(el("div", null, f.label + ": " + f.now + " → " + f.needed));
    fix.appendChild(el("div","sub", f.easy ? t("ui.near_easy") : t("ui.near_hard")));
  });
  txt.appendChild(fix);
  txt.appendChild(working(x.id));
  row.appendChild(txt);
  return row;
}

/* The derivation, on demand. Without this the app shows only its conclusion
   and reads as a lookup table, which was exactly the complaint. */
function working(schemeId) {
  const box = el("details","work");
  box.appendChild(el("summary", null, t("ui.working") || "How we worked this out"));
  let loaded = false;
  box.ontoggle = async () => {
    if (!box.open || loaded) return;
    loaded = true;
    const hold = el("div","sub", t("ui.checking") || "Checking");
    box.appendChild(hold);
    let tr;
    try { tr = await api("/api/trace", {facts:S.facts, scheme:schemeId}); }
    catch { hold.textContent = t("ui.error_body") || "Could not load"; return; }
    hold.remove();
    (tr.steps || []).forEach(s => box.appendChild(stepBlock(s)));
  };
  return box;
}

function stepBlock(s) {
  const st = el("div","step");
  st.appendChild(el("div","how", s.method));
  st.appendChild(el("div","what2", s.headline));
  const bits = el("div","bits");
  (s.detail || []).forEach(x => bits.appendChild(el("div", null, x)));
  st.appendChild(bits);
  if (s.queries) {
    let line = (t("ui.queries") || "solver queries") + ": " + s.queries;
    if (s.compare) line += "  ·  " + s.compare.label + " " + s.compare.queries;
    st.appendChild(el("div","qc", line));
  }
  return st;
}

/* ---------- papers ---------- */

function papersTab() {
  const v = view();
  const p = S.result && S.result.paperwork;
  if (!p || !p.steps.length) {
    return v.appendChild(el("div","empty", t("ui.papers_empty") ||
      "Finish the questions and your paper list appears here."));
  }

  const head = el("div","card");
  head.appendChild(el("h2", null, t("ui.papers_title")));
  head.appendChild(el("p","sub", t("ui.papers_summary",
    {trips:p.trips, fee:p.fee, days:p.days})));
  if (p.first) {
    const n = el("div","note ok");
    n.appendChild(el("div", null, "⭐  " + t("ui.papers_first")));
    n.appendChild(el("b", null, (p.first.step ? p.first.step + ". " : "") + p.first.name));
    if (p.first.unlocks.length)
      n.appendChild(el("div","sub", t("ui.papers_unlocks") + ": " + p.first.unlocks.join(", ")));
    head.appendChild(n);
  }
  v.appendChild(head);

  const list = el("div","card");
  const ol = el("ol","route");
  p.steps.forEach(s => {
    const li = el("li");
    li.appendChild(el("b", null, s.name));
    li.appendChild(el("div","sub", (t("ui.papers_where")||"Go to") + ": " + s.issuer));
    const bits = [];
    bits.push(s.fee ? (t("ui.papers_cost")||"Cost") + " ₹" + s.fee
                    : (t("ui.papers_free")||"Free"));
    if (s.days) bits.push(t("ui.papers_time", {days:s.days}));
    bits.push(s.trips > 1 ? t("ui.papers_trips", {n:s.trips}) : t("ui.papers_trip"));
    li.appendChild(el("div","sub", bits.join("  ·  ")));
    if (s.unlocks.length)
      li.appendChild(el("div","note ok", t("ui.papers_unlocks") + ": " + s.unlocks.join(", ")));
    ol.appendChild(li);
  });
  list.appendChild(ol);
  list.appendChild(paperWorking());
  v.appendChild(list);

  const pr = el("div","card");
  const b = el("button", null, "🖨️  " + (t("ui.print") || "Print"));
  b.onclick = () => window.print();
  pr.appendChild(b);
  v.appendChild(pr);
}

function paperWorking() {
  const box = el("details","work");
  box.appendChild(el("summary", null,
    t("ui.working_papers") || "How this order was worked out"));
  let loaded = false;
  box.ontoggle = async () => {
    if (!box.open || loaded) return;
    loaded = true;
    let tr;
    try {
      tr = await api("/api/paper-trace",
        {targets:S.result.targets || [], documents:[...S.held], facts:{}});
    } catch { return; }
    (tr.steps || []).forEach(s => box.appendChild(stepBlock(s)));
  };
  return box;
}

/* ---------- help ---------- */

function helpTab() {
  const v = view();
  const c = el("div","card");
  c.appendChild(el("h2", null, t("ui.help_title") || "Questions"));
  c.appendChild(el("p","sub", t("ui.help_body") || ""));
  const open = el("button","cta mt", "💬  " + (t("ui.chat_open") || "Ask a question"));
  open.onclick = openChat;
  c.appendChild(open);
  v.appendChild(c);

  const about = el("div","card");
  about.appendChild(el("h3", null, t("ui.about_title") || "About this app"));
  [t("ui.about_1"), t("ui.about_2"), t("ui.about_3")].filter(Boolean)
    .forEach(x => about.appendChild(el("p","sub", x)));
  v.appendChild(about);
}

/* ---------- chat ---------- */

function openChat() {
  show("chat");
  if (!$("chat-log").childElementCount) {
    bubble("it", t("ui.chat_greet") || "Ask me about a scheme or a paper.", [],
      [t("ui.chat_eg1"), t("ui.chat_eg2"), t("ui.chat_eg3")].filter(Boolean));
  }
  setTimeout(() => $("chat-in").focus(), 60);
}
$("fab").onclick = openChat;
$("chat-close").onclick = () => hide("chat");

function bubble(who, text, bullets, chips, steps) {
  const log = $("chat-log");
  const b = el("div","bubble " + who);
  if (who === "it") b.appendChild(el("b", null, text));
  else b.textContent = text;
  (bullets || []).forEach(x => b.appendChild(el("div","li", x)));
  (steps || []).forEach((s, i) => b.appendChild(
    el("div","li", (i+1) + ". " + s.name + ", " + s.issuer)));
  log.appendChild(b);
  if (chips && chips.length) {
    const row = el("div");
    chips.forEach(c => {
      const ch = el("button","chip", c);
      ch.onclick = () => sendChat(c);
      row.appendChild(ch);
    });
    log.appendChild(row);
  }
  log.scrollTop = log.scrollHeight;
}

async function sendChat(text) {
  const q = (text != null ? text : $("chat-in").value).trim();
  if (!q) return;
  $("chat-in").value = "";
  bubble("me", q);
  let a;
  try { a = await api("/api/ask", {question:q, facts:{}}); }
  catch { return bubble("it", t("ui.error_body") || "Could not answer"); }
  bubble("it", a.text, a.bullets, a.suggestions, a.steps);
  say(a.text);
}
$("chat-send").onclick = () => sendChat();
$("chat-in").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

/* ---------- misc ---------- */

function restart() {
  S.facts = {}; S.order = []; S.held = new Set(); S.asked = 0; S.result = null;
  go("home");
}

if ("speechSynthesis" in window) speechSynthesis.getVoices();
boot();
</script>
</body>
</html>

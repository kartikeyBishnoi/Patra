# What a sentence has to contain before we are willing to believe a fact.
#
# This is the vocabulary of the understanding layer. It is data rather than
# code for the same reason the scheme rules are: somebody who speaks Marathi
# can correct a phrase here without reading any Python, and a wrong phrase here
# sends a real family to the wrong office.
#
# Nothing in this file decides anything. A match proposes a fact, the solver
# adjudicates it, and anything proposed with low confidence is read back to the
# person before it is used. See patra/guard.py.
#
# confidence  how much a phrase on its own is worth.
#             high    the phrase means the fact and nothing else ("widow")
#             medium  the phrase usually means it ("husband passed away")
#             low     the phrase hints at it and must be confirmed
#                     ("no husband" could be unmarried just as easily)

numbers:

  # Indic digits are written in their own script far more often than Latin
  # digits in handwriting and in speech-to-text output.
  digits:
    devanagari: "०१२३४५६७८९"
    bengali: "০১২৩৪৫৬৭৮৯"
    tamil: "௦௧௨௩௪௫௬௭௮௯"
    gujarati: "૦૧૨૩૪૫૬૭૮૯"


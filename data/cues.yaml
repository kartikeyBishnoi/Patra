  occupation:
    kind: enum
    options:
      farmer:
        high: [farmer, farmers, kisan, khet karta, किसान, खेती करता, शेतकरी, कृषक,
             কৃষক, விவசாயி, விவசாயம்]
      farm_labour:
        high: [farm labour, farm labourer, farm labourers, khet mazdoor,
             खेत मज़दूर, खेत मजदूर, शेतमजूर, ক্ষেতমজুর, வேளாண் கூலி]

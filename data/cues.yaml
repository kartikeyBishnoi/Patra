      divorced:
        high: [divorced, talaq, तलाक, तलाकशुदा, বিবাহবিচ্ছেদ, விவாகரத்து]
      separated:
        high: [separated, alag rehte, अलग रहते, আলাদা থাকে, பிரிந்து]

  area_type:
    kind: enum
    options:
      rural:
        high: [village, villages, gaon, gaav, rural, pind, गाँव, गांव, ग्रामीण, देहात,
             गाव, গ্রাম, கிராம, கிராமத்தில், கிராமத்தை]
      urban:
        high: [city, town, towns, urban, shahar, sheher, शहर, नगर, शहरी, শহর,
             நகர, நகரத்தில்]

  ration_card_type:
    kind: enum
    options:
      aay:
        high: [antyodaya, aay card, antodaya, अंत्योदय, অন্ত্যোদয়, அந்தியோதயா]

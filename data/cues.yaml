  - இல்ல

# Wanting a thing is not having it.
#
# "Mujhe pension chahiye" means somebody is asking for a pension, and reading
# it as somebody who already draws one rules them out of the pension they came
# to ask about. That is the exact failure this project exists to prevent, and
# it is structural rather than a bad phrase: a possession cue inside a clause
# that expresses a wish or asks a question is not an assertion.
#
# Scoped to the clause and skipped where the cue contains the marker itself,
# so "kaam chahiye" still reads as wanting work, because there the wish is
# the fact.
inquiries:
  - want
  - wants
  - need
  - needs
  - looking for
  - apply for
  - applying
  - how do i
  - how can i
  - how much
  - how many
  - how to
  - what is
  - what are
  - which
  - where
  - who can
  - should i
  - can i get
  - give me
  - tell me
  - chahiye
  - chahie
  - milega
  - milegi
  - kaise
  - kaisa
  - kitna
  - kahan
  - batao
  - bataiye
  - चाहिए
  - चाहिये
  - मिलेगा
  - मिलेगी
  - कैसे
  - कितना
  - कहाँ
  - बताओ
  - बताइए
  - लेना है
  - हवे
  - कसे
  - किती
  - कुठे
  - सांगा
  - দরকার
  - কীভাবে
  - কত
  - কোথায়
  - বলুন
  - வேண்டும்
  - எப்படி
  - எவ்வளவு
  - எங்கே
  - சொல்லுங்கள்

# Who the answers are about. The interview asks "how old are you", but people
# arrive asking on behalf of somebody: a mother, a father, a daughter. Getting
# this wrong attaches a widow's pension to the wrong person, so it is reported
# back rather than assumed, and a relation that implies a gender says so.
#
# first_person marks the possessives that introduce the subject. "Meri maa ka
# husband nahi hai" mentions two relatives and is about the first one, so a
# relation introduced by "my" outranks one introduced by "their", and position
# settles the rest.
first_person:
  - my
  - mine
  - mera
  - meri
  - mere
  - hamari
  - hamara
  - apni
  - apna
  - मेरा
  - मेरी
  - मेरे
  - हमारी
  - हमारा
  - अपनी
  - माझा
  - माझी
  - आमचा
  - আমার
  - আমাদের
  - என்
  - எனது

relations:
  self:
    phrases: [i am, my own, mera, meri, mujhe, मैं, मेरा, मेरी, माझे, আমার, என்]
  mother:
    phrases: [my mother, mother, mummy, maa, maaji, ammi, aai, मां, माँ, माता, माताजी, आई, মা, আম্মা, அம்மா]
    implies: {gender: female}
  father:
    phrases: [my father, father, papa, pita, abba, baba, पिता, पिताजी, बाप, वडील, বাবা, অপ্পা, அப்பா]
    implies: {gender: male}
  wife:
    phrases: [my wife, wife, patni, biwi, बीवी, पत्नी, बायको, স্ত্রী, மனைவி]
    implies: {gender: female}
  husband:
    phrases: [my husband, husband, pati, shauhar, पति, नवरा, স্বামী, கணவர்]
    implies: {gender: male}
  daughter:
    phrases: [my daughter, daughter, beti, ladki, बेटी, लड़की, मुलगी, মেয়ে, মেয়ে, மகள்]
    implies: {gender: female}
  son:
    phrases: [my son, son, beta, ladka, बेटा, लड़का, मुलगा, ছেলে, மகன்]
    implies: {gender: male}
  grandmother:
    phrases: [grandmother, dadi, nani, दादी, नानी, आजी, ঠাকুমা, பாட்டி]
    implies: {gender: female}
  grandfather:
    phrases: [grandfather, dada, nana, दादा, नाना, आजोबा, ঠাকুরদা, தாத்தா]
    implies: {gender: male}

# One block per attribute in data/attributes.yaml. Only the attributes a person
# plausibly volunteers are here; the rest are asked.
#
# anchors   for a number: the words that say which number this is. A number
#           with no anchor near it is not used at all, because "62" on its own
#           could be an age, an income or a house number.
# high/low/medium
#           for a bool or an enum: phrases that assert the value.
attributes:

  age:
    kind: int
    anchors:
      - age
      - aged
      - i am
      - he is
      - she is
      - years old
      - year old
      - years of age
      - aged
      - saal
      - sal
      - varsh
      - umar
      - umr
      - उम्र
      - साल
      - वर्ष
      - बरस
      - वय
      - वयाची
      - বয়স
      - বছর
      - வயது
      - வயதில்
    # "62 saal" is an age; "62000 saal" is a typo, and the schema catches it.
    plausible: [0, 120]

  annual_income:
    kind: int
    anchors:
      - income
      - earn
      - earns
      - earning
      - salary
      - wages
      - kamai
      - kamate
      - aamdani
      - aay
      - आय
      - आमदनी
      - कमाई
      - कमाते
      - कमाता
      - तनख्वाह
      - वेतन
      - उत्पन्न
      - মাসিক আয়
      - আয়
      - রোজগার
      - வருமானம்
      - வருமானத்தில்
      - சம்பளம்
    # Said as a month's figure far more often than a year's, so a monthly
    # anchor rescales. Without this "I earn 6000 a month" becomes a household
    # on 6000 a year, which clears every threshold in the book.
    per_month:
      - a month
      - per month
      - monthly
      - mahina
      - mahine
      - महीने
      - महीना
      - माह
      - মাসে
      - মাসিক
      - மாதம்
    plausible: [0, 5000000]

  land_acres:
    kind: int
    anchors:
      - acre
      - acres
      - bigha
      - killa
      - zameen
      - land
      - एकड़
      - एकर
      - बीघा
      - ज़मीन
      - जमीन
      - खेत
      - एकर
      - জমি
      - বিঘা
      - ஏக்கர்
      - நிலம்
      - நிலத்தில்
      - நிலத்தை
    plausible: [0, 500]

  household_size:
    kind: int
    anchors:
      - people in
      - members
      - family of
      - log hain
      - log
      - sadasya
      - लोग
      - सदस्य
      - जने
      - माणसे
      - জন
      - সদস্য
      - பேர்
      - நபர்
    plausible: [1, 30]

  disability_percent:
    kind: int
    anchors:
      - percent disability
      - disability
      - divyang
      - viklang
      - apang
      - प्रतिशत
      - दिव्यांग
      - विकलांग
      - अपंग
      - প্রতিবন্ধী
      - மாற்றுத்திறனாளி
    plausible: [0, 100]

  gender:
    kind: enum
    options:
      female:
        high: [woman, female, she is, aurat, mahila, औरत, महिला, स्त्री, महिला,
             মহিলা, নারী, பெண்]
      male:
        high: [man, male, he is, aadmi, purush, आदमी, पुरुष, মানুষ, পুরুষ, ஆண்]

  marital_status:
    kind: enum
    options:
      widowed:
        high:
          - widow
          - widowed
          - vidhwa
          - vidhva
          - विधवा
          - विधवेची
          - বিধবা
          - விதவை
        medium:
          - husband died
          - husband passed away
          - husband expired
          - pati ki mrityu
          - pati guzar
          - pati nahi rahe
          - पति की मृत्यु
          - पति का देहांत
          - पति गुज़र

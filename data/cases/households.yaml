# Households used for testing and for the walkthrough.
#
# Written to cover the cases that actually matter: a family blocked by one
# cheap piece of paper, a family blocked by something nothing can change, a
# family holding nothing at all, and a family that is simply not poor enough.

households:

  - id: sunita
    note: >
      A widow with a bank account that was never linked to Aadhaar. Everything
      else about her claim is in order. This is the commonest shape of refusal
      we found: one free errand standing between a family and a monthly
      payment.
    facts:
      state: haryana
      area_type: rural
      annual_income: 42000
      ration_card_type: phh
      land_acres: 0
      cultivates_land: false
      owns_pucca_house: false
      owns_vehicle: false
      income_tax_payer: false
      govt_employee_in_family: false
      lpg_connection: false
      breadwinner_died_recently: true
    documents: [aadhaar, ration_card, electricity_bill]
    members:
      - id: sunita
        name: Sunita Devi
        facts:
          age: 46
          gender: female
          marital_status: widowed
          category: obc
          disability_percent: 0
          is_pregnant: false
          first_child: false
          occupation: farm_labour
          willing_unskilled_work: true
          has_bank_account: true
          bank_aadhaar_linked: false

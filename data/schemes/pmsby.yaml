id: pmsby
name: Pradhan Mantri Suraksha Bima Yojana
authority: Department of Financial Services
scope: member
benefit: >
  Accident insurance of two lakh rupees for a premium of twenty rupees a year,
  deducted automatically from the bank account.
apply_at: The bank where you hold your account
source_url: https://jansuraksha.gov.in/
note: Simplified encoding. Cover renews every year on the first of June.

documents:
  - aadhaar
  - bank_account

criteria:
  - id: C1
    text: "Must be between eighteen and seventy years of age"
    rule:
      all:
        - {ge: [age, 18]}
        - {le: [age, 70]}

  - id: C2
    text: "Must have a bank account"
    rule: {is_true: has_bank_account}

  - id: C3
    text: "The account must be linked to Aadhaar"
    rule: {is_true: bank_aadhaar_linked}

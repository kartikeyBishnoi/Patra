id: nfbs
name: National Family Benefit Scheme
authority: Ministry of Rural Development
scope: household
benefit: >
  A one time payment of twenty thousand rupees to a poor household that has
  lost its main earner.
apply_at: Gram panchayat, or the block development office
source_url: https://nsap.nic.in/
note: >
  Simplified encoding. The claim must normally be made within a few years of
  the death, and the person who died must have been of working age. Families
  often miss this one entirely because nobody tells them it exists.

# Indicative only, and the basis says where it came from. Figures are central
# shares at the time of writing; states add top-ups we do not model.
worth:
  kind: cash
  a_year: 0
  once: 20000
  cover: 0
  basis: >
    Rs 20,000 paid once after the death of the household's main earner.

documents:
  - aadhaar
  - bank_account
  - bank_aadhaar_seeding
  - ration_card
  - death_certificate

criteria:
  - id: C1
    text: "The household's main earner must have died in the last three years"
    rule: {is_true: breadwinner_died_recently}

  - id: C2
    text: "Household must be on the below-poverty-line list"
    rule: {in: [ration_card_type, [phh, aay]]}

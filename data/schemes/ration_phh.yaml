id: ration_phh
name: Priority Household ration card
authority: Department of Food and Public Distribution
scope: household
benefit: >
  Five kilograms of grain per person per month at two or three rupees a kilo,
  under the National Food Security Act.
apply_at: Block food and supplies office
source_url: https://dfpd.gov.in/
note: >
  Simplified encoding, and this varies by state more than most. The Act covers
  roughly three quarters of the rural population, and states set their own
  exclusion tests rather than a single income line. Treat the income figure
  here as indicative.

documents:
  - aadhaar
  - passport_photo
  - electricity_bill

criteria:
  - id: C1
    text: "The household must not already hold a priority or Antyodaya card"
    rule: {in: [ration_card_type, [none, apl]]}

  - id: C2
    text: "Yearly household income must be below the state's line"
    rule: {le: [annual_income, 120000]}

  - id: C3
    text: "Nobody in the family may be an income tax payer"
    rule: {is_false: income_tax_payer}

  - id: C4
    text: "Nobody in the family may hold a government post"
    rule: {is_false: govt_employee_in_family}

  - id: C5
    text: "The family must not own more than five acres of land"
    rule: {le: [land_acres, 5]}

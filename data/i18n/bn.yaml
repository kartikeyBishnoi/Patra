  # The four shortcuts, and the caution each one carries.
  how:
    ration_card:
      question: 'রেশন কার্ড কীভাবে করাব?'
      answer: 'এই কার্ডেই সস্তা শস্য মেলে, আর বাকি বেশিরভাগ প্রকল্পও এটিই চায়। এই হল ধাপগুলি, সঠিক ক্রমে।'
      caution: 'আসল কাগজ ও প্রত্যেকটির একটি করে প্রতিলিপি সঙ্গে নিন। রেশন কার্ড পরিবারের প্রধানের নামে হয়।'
    income_certificate:
      question: 'আয়ের শংসাপত্র কীভাবে করাব?'
      answer: 'আয়ের কারণে যে প্রত্যাখ্যান, তা আসলে শংসাপত্র না থাকার। এই হল তার পথ।'
      caution: 'এটি সাধারণত ছয় মাস থেকে এক বছরে পুরনো হয়ে যায়, তাই যখন কাজে লাগাবেন তার কাছাকাছি সময়ে করান।'
    bank_aadhaar_seeding:
      question: 'অ্যাকাউন্ট আধারের সঙ্গে কীভাবে যুক্ত করব?'
      answer: 'বিনামূল্যে, এক বারেই হয়ে যায়, আর অন্য যেকোনো কাজের চেয়ে বেশি প্রকল্প খুলে দেয়, কারণ সরাসরি টাকা এই পথেই আসে।'
      caution: 'শাখা থেকে যুক্ত হওয়ার রসিদ নিন। অ্যাকাউন্ট থাকা আর অ্যাকাউন্ট আধারে যুক্ত থাকা এক নয়।'
      note: 'বেশিরভাগ প্রকল্পের টাকা যুক্ত না থাকা অ্যাকাউন্টে পৌঁছয় না। এটিই সবচেয়ে সস্তা কাজ এবং এটিই সবচেয়ে বেশি টাকা আটকায়।'
    old_age_pension:
      question: 'বার্ধক্য পেনশন কীভাবে পাব?'
      answer: 'দারিদ্র্যসীমার নিচের পরিবারের ষাট বছরের বেশি বয়সীদের প্রতি মাসে টাকা, সরাসরি আধার যুক্ত অ্যাকাউন্টে।'
      caution: 'আবেদন গ্রাম পঞ্চায়েতে করুন। আপনি আগে থেকেই অন্য সরকারি পেনশন পেলে এটি একসঙ্গে পাবেন না।'


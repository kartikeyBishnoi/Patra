  # The tiles on the front page.
  topic:
    pension:
      name: 'ஓய்வூதியம்'
      blurb: 'முதுமை, கைம்பெண் நிலை அல்லது மாற்றுத்திறனில் மாதந்தோறும் பணம், மேலும் நீங்களே சேரும் ஒரு சேமிப்பு ஓய்வூதியம்.'
    food:
      name: 'உணவும் ரேஷனும்'
      blurb: 'ரேஷன் கடையில் மலிவான தானியம், மற்றும் வரிசையில் இடம் தரும் அட்டை.'
    health:
      name: 'உடல்நலமும் பிரசவமும்'
      blurb: 'மருத்துவமனையில் பணமில்லா சிகிச்சை, மற்றும் குழந்தை பிறக்கும் நேரத்தில் உதவி.'
    housing:
      name: 'வீடும் அடுப்பும்'
      blurb: 'கான்கிரீட் வீடு கட்ட உதவி, மற்றும் பெண்ணின் பெயரில் எரிவாயு இணைப்பு.'
    work:
      name: 'வேலையும் கூலியும்'
      blurb: 'கிராமத்திற்கு அருகில் உறுதியான நாட்கள் உடலுழைப்பு வேலை, கூலியுடன்.'
    farming:
      name: 'விவசாயம்'
      blurb: 'நிலம் உள்ள குடும்பங்களுக்கு உதவி, பயிர் காப்பீடு, மலிவான கடன்.'
    girl:
      name: 'பெண் குழந்தை'
      blurb: 'மகளின் பெயரில் நீண்ட சேமிப்பு, வேறெங்கும் கிடைக்காத வட்டியில்.'
    money:
      name: 'வங்கியும் காப்பீடும்'
      blurb: 'இருப்பு தேவையில்லாத கணக்கு, ஆண்டுக்குச் சில ரூபாயில் ஆயுள் மற்றும் விபத்துக் காப்பீடு.'

  # The four shortcuts, and the caution each one carries.
  how:
    ration_card:
      question: 'ரேஷன் அட்டை எப்படிப் பெறுவது?'
      answer: 'இந்த அட்டையிலேயே மலிவான தானியம் கிடைக்கும், மற்ற பெரும்பாலான திட்டங்களும் இதையே கேட்கின்றன. இவை படிகள், சரியான வரிசையில்.'
      caution: 'அசல் ஆவணங்களையும் ஒவ்வொன்றின் ஒரு நகலையும் எடுத்துச் செல்லுங்கள். ரேஷன் அட்டை குடும்பத் தலைவர் பெயரில் வழங்கப்படுகிறது.'
    income_certificate:
      question: 'வருமானச் சான்றிதழ் எப்படிப் பெறுவது?'
      answer: 'வருமானத்தின் பெயரால் வரும் மறுப்பு உண்மையில் சான்றிதழ் இல்லாததன் மறுப்பு. இதோ அதன் வழி.'
      caution: 'இது பொதுவாக ஆறு மாதம் முதல் ஒரு ஆண்டில் பழையதாகிவிடும், எனவே உண்மையில் பயன்படுத்தும் நேரத்திற்கு அருகில் பெறுங்கள்.'
    bank_aadhaar_seeding:
      question: 'கணக்கை ஆதாருடன் எப்படி இணைப்பது?'
      answer: 'இலவசம், ஒரே வருகையில் முடியும், மற்ற எந்த வேலையையும் விட அதிகத் திட்டங்களைத் திறக்கும், ஏனெனில் நேரடிப் பணம் இதன் வழியேதான் வரும்.'
      caution: 'கிளையிடம் இணைப்புச் சீட்டைக் கேளுங்கள். கணக்கு இருப்பதும் அது ஆதாருடன் இணைந்திருப்பதும் ஒன்றல்ல.'
      note: 'பெரும்பாலான திட்டங்களின் பணம் இணைக்கப்படாத கணக்கை அடையாது. இதுவே மிக மலிவான வேலை, இதுவே அதிகப் பணத்தைத் தடுக்கிறது.'
    old_age_pension:
      question: 'முதியோர் ஓய்வூதியம் எப்படிப் பெறுவது?'
      answer: 'வறுமைக் கோட்டுக்குக் கீழ் உள்ள குடும்பங்களில் அறுபது வயதுக்கு மேற்பட்டவர்களுக்கு மாதந்தோறும் பணம், ஆதாருடன் இணைந்த கணக்கிற்கு நேரடியாக.'
      caution: 'ஊராட்சியில் விண்ணப்பியுங்கள். ஏற்கெனவே வேறு அரசு ஓய்வூதியம் பெற்றால் இதை ஒருசேரப் பெற முடியாது.'


    help_title: 'எந்தக் கேள்வியும் கேளுங்கள்'
    help_body: 'எந்தத் திட்டம் அல்லது ஆவணம் பற்றியும் கேளுங்கள். பதில்கள் இந்த ஆப்பின் விதிகளிலிருந்தே வருகின்றன.'
    about_title: 'இந்த ஆப் பற்றி'
    about_1: 'ஒவ்வொரு பதிலும் திட்டத்தின் அச்சிடப்பட்ட விதிகளிலிருந்து கண்டறியப்படுகிறது. எந்த முடிவின் கீழும் உள்ள விருப்பத்தை அழுத்திப் படிகளைப் பாருங்கள்.'
    about_2: 'எதுவும் இணையத்தில் அனுப்பப்படுவதில்லை, எதுவும் சேமிக்கப்படுவதில்லை.'

    nfbs: {name: தேசியக் குடும்ப நல உதவித் திட்டம், benefit: "சம்பாதிப்பவர் இறந்தால் ஏழைக் குடும்பத்திற்கு ஒரே தவணையில் இருபதாயிரம் ரூபாய்.", apply_at: "ஊராட்சி, அல்லது வட்டார அலுவலகம்"}
    pmfby: {name: பிரதமர் பயிர்க் காப்பீட்டுத் திட்டம், benefit: "பயிர் சேதமடைந்தால் இழப்பீடு, விவசாயியின் பங்கு மிகக் குறைவு.", apply_at: "எந்த வங்கி, பொது சேவை மையம், அல்லது காப்பீட்டு முகவர்"}

  doc:
    passport_photo: {name: பாஸ்போர்ட் புகைப்படம், issuer: சந்தையில் உள்ள எந்த ஃபோட்டோ கடை}
    aadhaar:
      name: 'ஆதார் அட்டை'
      issuer: 'ஆதார் மையம்'
      note: 'உங்களிடம் எந்த ஆவணமும் இல்லை எனில், பதிவு மையத்தில் அங்கீகரிக்கப்பட்ட அறிமுகப்படுத்துபவர் அல்லது குடும்பத் தலைவர் உங்களுக்காக உறுதியளிக்கலாம். முன்கூட்டியே வேறு எதுவும் கொண்டு வர வேண்டியதில்லை.'
    birth_certificate: {name: பிறப்புச் சான்றிதழ், issuer: ஊராட்சி அலுவலகம்}
    school_certificate: {name: பள்ளி விடுப்புச் சான்றிதழ், issuer: கடைசியாகப் படித்த பள்ளி}
    electricity_bill:
      name: 'மின் கட்டண ரசீது'
      issuer: 'மின்வாரிய அலுவலகம்'
      note: 'சமீபத்திய ஒரு கட்டண ரசீது தனியாகவே முகவரிச் சான்றாகப் பயன்படும்.'
    voter_id: {name: வாக்காளர் அட்டை, issuer: வாக்குச்சாவடி அலுவலர் அல்லது தேர்தல் அலுவலகம்}
    pan_card: {name: பான் அட்டை, issuer: பான் சேவை மையம்}
    ration_card: {name: ரேஷன் அட்டை, issuer: வட்டார உணவுப் பொருள் வழங்கல் அலுவலகம்}
    domicile_certificate: {name: வதிவிடச் சான்றிதழ், issuer: வட்டாட்சியர் அலுவலகம்}
    income_certificate: {name: வருமானச் சான்றிதழ், issuer: வட்டாட்சியர் அலுவலகம்}
    caste_certificate:
      name: 'சாதிச் சான்றிதழ்'
      issuer: 'வட்டாட்சியர் அலுவலகம்'
      note: 'பொதுவாகப் பெற்றோரின் சாதிச் சான்றிதழ், அல்லது குடும்பத்தின் பிரிவைக் காட்டும் பழைய பள்ளிப் பதிவு தேவை. இந்தப் பகுதி மாவட்டத்திற்கு ஏற்ப மிகவும் மாறும்.'
    bank_account:
      name: 'வங்கிக் கணக்கு'
      issuer: 'எந்த வங்கி அல்லது ஊர் வங்கி முகவர்'
      note: 'ஜன் தன் கணக்கை ஆதார் மட்டுமே கொண்டு திறக்கலாம், குறைந்தபட்ச இருப்பும் தேவையில்லை, இதுவே பொதுவாக விரைவான வழி.'
    bank_aadhaar_seeding:
      name: 'வங்கிக் கணக்குடன் ஆதார் இணைப்பு'
      issuer: 'உங்கள் வங்கிக் கிளை'
      note: 'பெரும்பாலான திட்டங்களின் பணம் இணைக்கப்படாத கணக்கை அடையாது. இதுவே மிக மலிவான வேலை, இதுவே அதிகப் பணத்தைத் தடுக்கிறது.'
    disability_certificate: {name: மாற்றுத்திறன் சான்றிதழ், issuer: மாவட்ட மருத்துவமனை}
    death_certificate: {name: "கணவர், மனைவி அல்லது குடும்பத்தில் சம்பாதிப்பவரின் இறப்புச் சான்றிதழ்", issuer: ஊராட்சி அலுவலகம்}
    land_records: {name: நில ஆவணம், issuer: கிராம நிர்வாக அலுவலர் அல்லது வட்டாட்சியர் அலுவலகம்}
    job_card: {name: மகாத்மா காந்தி வேலை அட்டை, issuer: ஊராட்சி}


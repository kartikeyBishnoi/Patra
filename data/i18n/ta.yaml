    has_adult_woman: {label: வயது வந்த பெண், question: "உங்கள் வீட்டில் பதினெட்டு வயதுக்கு மேல் பெண் யாராவது உள்ளார்களா?"}
    has_willing_worker: {label: கூலி வேலைக்கு யாராவது, question: "உங்கள் வீட்டில் வயது வந்த யாராவது ஊரில் தினக்கூலி வேலை செய்வார்களா?"}

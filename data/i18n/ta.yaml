    trust_entails_body: 'முதலாவதின் நிபந்தனைகள் நிறைவேறி இரண்டாவதுடையவை நிறைவேறாமல் இருப்பது சாத்தியமா எனக் கேட்டு நிரூபிக்கப்பட்டது. சாத்தியமில்லை எனில், முதலாவது நிறைவேறியதும் இரண்டாவதும் நிறைவேறும்.'
    trust_excludes: 'ஒருவருக்கு ஒரே நேரத்தில் கிடைக்க முடியாதவை'
    trust_excludes_body: 'ஒரே நபருக்கு நிபந்தனைகள் ஒரே நேரத்தில் உண்மையாக இருக்க முடியாத இணைகள். பெரும்பாலும் ஒன்றோடொன்று பொருந்தாத வயது வரம்புகள், மற்றும் மற்றதை வைத்திராதவர்களுக்கே உரிய திட்டங்கள்.'

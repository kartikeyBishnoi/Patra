      question: "நீங்கள் திருமணமானவரா, திருமணமாகாதவரா, அல்லது உங்கள் கணவர் அல்லது மனைவி இல்லையா?"
      options: {unmarried: திருமணமாகவில்லை, married: திருமணமானவர், widowed: கணவர் அல்லது மனைவி இறந்துவிட்டார், divorced: விவாகரத்து ஆகிவிட்டது, separated: தனியாக வாழ்கிறோம்}
    category:
      label: சாதிப் பிரிவு
      question: "நீங்கள் எந்தச் சாதிப் பிரிவில் வருகிறீர்கள்?"
      options: {general: பொது, obc: பிற பிற்படுத்தப்பட்டோர், sc: பட்டியல் சாதி, st: பட்டியல் பழங்குடி}
    disability_percent:

    willing_unskilled_work: {label: கூலி வேலைக்குத் தயார், question: "ஊரில் தினக்கூலி வேலை கிடைத்தால் செய்வீர்களா?"}
    has_bank_account: {label: வங்கிக் கணக்கு, question: "உங்கள் சொந்தப் பெயரில் வங்கிக் கணக்கு உள்ளதா?"}
    bank_aadhaar_linked: {label: கணக்கு ஆதாருடன் இணைப்பு, question: "உங்கள் வங்கிக் கணக்கு ஆதாருடன் இணைக்கப்பட்டுள்ளதா?"}
    already_receiving_pension: {label: ஏற்கனவே ஓய்வூதியம், question: "உங்களுக்கு ஏற்கனவே ஏதேனும் அரசு ஓய்வூதியம் வருகிறதா?"}

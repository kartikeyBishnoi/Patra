    is_pregnant: {label: கர்ப்பம், question: "நீங்கள் கர்ப்பமாக இருக்கிறீர்களா, அல்லது சமீபத்தில் குழந்தை பிறந்ததா?"}
    first_child: {label: முதல் குழந்தை, question: "இது உங்கள் முதல் குழந்தையா?"}
    occupation:

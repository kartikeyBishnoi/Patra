    disability_certificate: {name: மாற்றுத்திறன் சான்றிதழ், issuer: மாவட்ட மருத்துவமனை}
    death_certificate: {name: "கணவர், மனைவி அல்லது குடும்பத்தில் சம்பாதிப்பவரின் இறப்புச் சான்றிதழ்", issuer: ஊராட்சி அலுவலகம்}
    land_records: {name: நில ஆவணம், issuer: கிராம நிர்வாக அலுவலர் அல்லது வட்டாட்சியர் அலுவலகம்}
    job_card: {name: மகாத்மா காந்தி வேலை அட்டை, issuer: ஊராட்சி}


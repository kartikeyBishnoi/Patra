    not_official_1: 'இது மாணவர்கள் உருவாக்கிய திட்டம். இங்குள்ள விதிகள் வெளியிடப்பட்ட நிபந்தனைகளிலிருந்து எடுத்து எளிமையாக்கப்பட்டவை, எனவே புறப்படுவதற்கு முன் உங்கள் ஊராட்சி அல்லது வட்டார அலுவலகத்தில் கேட்டுக் கொள்ளுங்கள்.'
    not_official_2: 'உங்கள் பதில்கள் இந்த இயந்திரத்திலேயே இருக்கும். எதுவும் அனுப்பப்படுவதில்லை, எதுவும் சேமிக்கப்படுவதில்லை, ஆதார் எண்ணை நாங்கள் ஒருபோதும் கேட்பதில்லை.'
    not_official_3: 'ஒவ்வொரு பதிலும் தன் கணக்கைக் காட்டுகிறது. எந்த முடிவுக்கும் கீழே உள்ள பலகத்தைத் திறந்து எந்த விதி என்ன முடிவு செய்தது எனப் பாருங்கள்.'

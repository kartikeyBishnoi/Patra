    lpg_connection: {label: எரிவாயு இணைப்பு, question: "உங்கள் வீட்டில் எரிவாயு இணைப்பு உள்ளதா?"}
    breadwinner_died_recently: {label: சம்பாதிப்பவர் இறப்பு, question: "கடந்த மூன்று ஆண்டுகளில் உங்கள் குடும்பத்தின் முக்கியச் சம்பாதிப்பவர் இறந்தாரா?"}
    household_size: {label: வீட்டில் நபர்கள், question: "உங்கள் வீட்டில் எத்தனை பேர் வசிக்கிறார்கள்?"}
    has_member_over_60: {label: அறுபதுக்கு மேல், question: "உங்கள் வீட்டில் அறுபது வயதுக்கு மேல் யாராவது உள்ளார்களா?"}
    has_girl_child: {label: பதினெட்டுக்குக் கீழ் பெண், question: "உங்கள் வீட்டில் பதினெட்டு வயதுக்குக் கீழ் பெண் குழந்தை உள்ளதா?"}
    has_disabled_member: {label: மாற்றுத்திறனாளி, question: "உங்கள் வீட்டில் யாராவது மாற்றுத்திறனாளி உள்ளார்களா?"}
    has_widowed_member: {label: வீட்டில் விதவை, question: "உங்கள் வீட்டில் விதவை யாராவது உள்ளார்களா?"}
    adult_male_count: {label: வேலை வயது ஆண்கள், question: "உங்கள் வீட்டில் பதினெட்டு முதல் அறுபது வயதுக்குள் எத்தனை ஆண்கள் உள்ளனர்?"}
    has_adult_woman: {label: வயது வந்த பெண், question: "உங்கள் வீட்டில் பதினெட்டு வயதுக்கு மேல் பெண் யாராவது உள்ளார்களா?"}
    has_willing_worker: {label: கூலி வேலைக்கு யாராவது, question: "உங்கள் வீட்டில் வயது வந்த யாராவது ஊரில் தினக்கூலி வேலை செய்வார்களா?"}
    someone_has_bank_account: {label: யாருக்காவது வங்கிக் கணக்கு, question: "உங்கள் வீட்டில் யாருக்காவது வங்கிக் கணக்கு உள்ளதா?"}

  scheme:
    ignoaps: {name: முதியோர் ஓய்வூதியம் (இந்திரா காந்தி தேசிய), benefit: "ஒவ்வொரு மாதமும் ஓய்வூதியம், நேரடியாக சொந்த வங்கிக் கணக்கில். பெரும்பாலான மாநிலங்கள் இதனுடன் கூடுதல் தொகை சேர்க்கின்றன.", apply_at: "ஊராட்சி, அல்லது வட்டார அலுவலகம்"}
    ignwps: {name: விதவை ஓய்வூதியம் (இந்திரா காந்தி தேசிய), benefit: "ஏழைக் குடும்ப விதவைகளுக்கு ஒவ்வொரு மாதமும் ஓய்வூதியம், நேரடியாக அவர்களின் கணக்கில்.", apply_at: "ஊராட்சி, அல்லது வட்டார அலுவலகம்"}
    igndps: {name: மாற்றுத்திறனாளி ஓய்வூதியம் (இந்திரா காந்தி தேசிய), benefit: "கடுமையான மாற்றுத்திறன் உள்ளவர்களுக்கு ஒவ்வொரு மாதமும் ஓய்வூதியம்.", apply_at: "ஊராட்சி, அல்லது வட்டார அலுவலகம்"}
    pm_kisan: {name: பிஎம் கிசான் சம்மான் நிதி, benefit: "ஆண்டுக்கு ஆறாயிரம் ரூபாய், இரண்டாயிரம் வீதம் மூன்று தவணைகளில், நேரடியாக வங்கிக் கணக்கில்.", apply_at: "பொது சேவை மையம், அல்லது கிராம வருவாய் அலுவலர்"}
    ration_aay: {name: அந்த்யோதயா ரேஷன் அட்டை, benefit: "குடும்பம் எவ்வளவு பெரியதானாலும், மாதம் முப்பத்தைந்து கிலோ தானியம் இரண்டு அல்லது மூன்று ரூபாய்க்கு.", apply_at: "வட்டார உணவுப் பொருள் வழங்கல் அலுவலகம்"}
    ration_phh: {name: முன்னுரிமைக் குடும்ப ரேஷன் அட்டை, benefit: "ஒவ்வொருவருக்கும் மாதம் ஐந்து கிலோ தானியம் இரண்டு அல்லது மூன்று ரூபாய்க்கு.", apply_at: "வட்டார உணவுப் பொருள் வழங்கல் அலுவலகம்"}
    pmay_g: {name: பிரதமர் வீட்டுவசதித் திட்டம் (கிராமப்புறம்), benefit: "கான்கிரீட் வீடு கட்டத் தவணைகளில் உதவி, கழிவறை மற்றும் கூலிக்கான வேலை அட்டையுடன்.", apply_at: ஊராட்சி}
    pmuy: {name: பிரதமர் உஜ்வலா திட்டம், benefit: "வீட்டுப் பெண்ணின் பெயரில் இலவச எரிவாயு இணைப்பு, வைப்புத்தொகையும் முதல் சிலிண்டரும் அரசு தரும்.", apply_at: "எந்த எரிவாயு முகவர், அல்லது பொது சேவை மையம்"}
    pmjay: {name: ஆயுஷ்மான் பாரத் (பிஎம் ஜன ஆரோக்யா), benefit: "முழுக் குடும்பத்திற்கும் ஆண்டுக்கு ஐந்து லட்சம் வரை இலவச சிகிச்சை, இணைந்த எந்த மருத்துவமனையிலும்.", apply_at: "பொது சேவை மையம், அல்லது இணைந்த மருத்துவமனை உதவி மையம்"}
    pmmvy: {name: பிரதமர் மாத்ரு வந்தனா திட்டம், benefit: "முதல் குழந்தையின் போது தவணைகளில் ஐந்தாயிரம் ரூபாய், அந்நாட்களின் கூலி இழப்பை ஈடுசெய்ய.", apply_at: "அங்கன்வாடி மையம், அல்லது அருகிலுள்ள மருத்துவமனை"}
    jsy: {name: ஜனனி சுரக்ஷா திட்டம், benefit: "மருத்துவமனையில் பிரசவம் செய்தால் பணஉதவி மற்றும் பயணச் செலவு.", apply_at: "அங்கன்வாடி மையம், அல்லது அரசு மருத்துவமனை"}
    mgnrega: {name: மகாத்மா காந்தி வேலை அட்டை, benefit: "ஆண்டுக்கு நூறு நாள் வேலை உத்தரவாதம், நிர்ணயிக்கப்பட்ட கூலியில், ஊரிலிருந்து ஐந்து கிலோமீட்டருக்குள்.", apply_at: ஊராட்சி}
    sukanya: {name: சுகன்யா சம்ரிதி திட்டம், benefit: "பெண் குழந்தையின் பெயரில் அதிக வட்டி சேமிப்புக் கணக்கு, வரி விலக்குடன். இருநூற்றைம்பது ரூபாயில் தொடங்கலாம்.", apply_at: "எந்த அஞ்சலகம், அல்லது பெரும்பாலான வங்கிகள்"}
    apy: {name: அடல் ஓய்வூதியத் திட்டம், benefit: "அறுபது வயதிலிருந்து மாதம் உறுதியான ஓய்வூதியம், ஆயிரம் முதல் ஐயாயிரம் வரை. பின்னர் மனைவி அல்லது கணவருக்குத் தொடரும்.", apply_at: "உங்கள் கணக்கு உள்ள வங்கி"}
    jan_dhan: {name: பிரதமர் ஜன் தன் கணக்கு, benefit: "குறைந்தபட்ச இருப்பு இல்லாத வங்கிக் கணக்கு, இலவச டெபிட் அட்டை, விபத்துக் காப்பீடு, ஆறு மாதங்களுக்குப் பிறகு கடன் வசதி.", apply_at: "எந்த வங்கிக் கிளை, அல்லது ஊர் வங்கி முகவர்"}
    pmsby: {name: பிரதமர் சுரக்ஷா காப்பீட்டுத் திட்டம், benefit: "ஆண்டுக்கு இருபது ரூபாயில் இரண்டு லட்சம் விபத்துக் காப்பீடு, தொகை தானாகக் கணக்கிலிருந்து எடுக்கப்படும்.", apply_at: "உங்கள் கணக்கு உள்ள வங்கி"}
    pmjjby: {name: பிரதமர் ஜீவன் ஜோதி காப்பீட்டுத் திட்டம், benefit: "ஆண்டுக்கு சில நூறு ரூபாயில் இரண்டு லட்சம் ஆயுள் காப்பீடு, தொகை தானாகக் கணக்கிலிருந்து எடுக்கப்படும்.", apply_at: "உங்கள் கணக்கு உள்ள வங்கி"}
    kcc: {name: கிசான் கடன் அட்டை, benefit: "விவசாயச் செலவுக்குக் குறைந்த வட்டியில் கடன், தேவைக்கேற்ப எடுக்கலாம்.", apply_at: "எந்த வங்கிக் கிளை, அல்லது கூட்டுறவுச் சங்கம்"}
    nfbs: {name: தேசியக் குடும்ப நல உதவித் திட்டம், benefit: "சம்பாதிப்பவர் இறந்தால் ஏழைக் குடும்பத்திற்கு ஒரே தவணையில் இருபதாயிரம் ரூபாய்.", apply_at: "ஊராட்சி, அல்லது வட்டார அலுவலகம்"}
    pmfby: {name: பிரதமர் பயிர்க் காப்பீட்டுத் திட்டம், benefit: "பயிர் சேதமடைந்தால் இழப்பீடு, விவசாயியின் பங்கு மிகக் குறைவு.", apply_at: "எந்த வங்கி, பொது சேவை மையம், அல்லது காப்பீட்டு முகவர்"}


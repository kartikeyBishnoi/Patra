strings:
  ui:
    title: பாத்ரா
    tagline: உங்கள் குடும்பம் என்ன பெறலாம்
    privacy: உங்கள் பதில்கள் இந்த ஃபோனிலேயே இருக்கும். எங்கும் அனுப்பப்படாது.
    choose_language: உங்கள் மொழியைத் தேர்ந்தெடுங்கள்
    docs_title: இவற்றில் எந்த ஆவணங்கள் உங்களிடம் உள்ளன?
    docs_help: உங்களிடம் உள்ளவற்றை அழுத்துங்கள். மற்றவற்றை விட்டுவிடுங்கள்.
    start: தொடங்கு
    listen: கேளுங்கள்
    back: பின்னால்
    next: அடுத்து
    "yes": ஆம்
    "no": இல்லை
    dont_know: எனக்கு சரியாகத் தெரியாது
    print: இந்தப் பக்கத்தை அச்சிடுங்கள்
    start_over: மீண்டும் தொடங்கு
    why_asking: ஒரு திட்டத்திற்கு இது தேவை என்பதால் மட்டுமே கேட்கிறோம்.
    checking: விதிகளைப் பார்க்கிறோம்
    claims_title: "நீங்கள் {n} பெறலாம்"
    claims_none_title: இந்தப் பதில்களில் இருந்து எதுவும் கிடைக்கவில்லை
    claims_none_body: >
      உங்களுக்கு எதுவும் இல்லை என்று இதற்கு அர்த்தமில்லை. உங்கள் ஊராட்சியில்
      கேளுங்கள், அங்கு மாநிலத் திட்டங்கள் பற்றித் தெரியும்.
    apply_at: "எங்கே செல்ல வேண்டும்"
    please_check: "முதலில் இதைச் சரிபாருங்கள்"
    check_body: >
      {label} {now} என்று சொன்னீர்கள். பதில் {flips} இல் மாறுகிறது. உண்மையான
      எண் அதற்கு மறுபக்கம் இருந்தால் இந்த முடிவு தவறு.
    papers_title: எந்த ஆவணங்களை வாங்க வேண்டும்
    papers_summary: "சுமார் {trips} முறை செல்ல வேண்டும், {fee} ரூபாய் கட்டணம், சுமார் {days} நாட்கள்"
    papers_first: ஒரே ஒரு வேலை செய்ய முடிந்தால் முதலில் இதைச் செய்யுங்கள்
    papers_unlocks: "இதற்குப் பிறகு இவற்றுக்கு விண்ணப்பிக்கலாம்"
    papers_where: "எங்கே செல்ல வேண்டும்"
    papers_cost: "கட்டணம்"
    papers_time: "சுமார் {days} நாட்கள் ஆகும்"
    papers_trips: "{n} முறை"
    papers_trip: "1 முறை"
    papers_free: இலவசம்
    near_title: கொஞ்சம் மட்டுமே பாக்கி
    near_needed: "இதற்குத் தேவை"
    near_you_said: "நீங்கள் சொன்னீர்கள்"
    near_change: "என்ன செய்தால் கிடைக்கும்"
    near_easy: இது ஆவண வேலை மட்டுமே
    near_hard: இதற்கு உண்மையில் ஏதாவது மாற வேண்டும்
    mismatch_title: நாங்கள் ஏதோ தவறாகப் புரிந்திருக்கலாம்
    mismatch_body: >
      உங்கள் இரண்டு பதில்கள் ஒன்றுக்கொன்று பொருந்தவில்லை. அவற்றைப் பார்த்துவிட்டு
      மீண்டும் தொடங்குங்கள். மற்றவை அனைத்தும் சரியாக இருந்தன.
    mismatch_you_said: "நீங்கள் சொன்னீர்கள்"
    error_title: ஏதோ தவறு நடந்துவிட்டது
    error_body: மீண்டும் தொடங்குங்கள்.

  attr:

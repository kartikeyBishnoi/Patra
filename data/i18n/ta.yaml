    hero_body: 'சில கேள்விகளுக்குப் பதில் சொல்லுங்கள், அல்லது உங்கள் சொற்களில் சொல்லுங்கள். எந்த அரசுத் திட்டங்கள் உங்களுக்குக் கிடைக்கும், மற்றவை ஏன் இல்லை, முதலில் எந்த ஆவணம் எடுக்க வேண்டும் எனத் தெரியும்.'

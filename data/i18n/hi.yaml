    land_records: {name: ज़मीन का रिकॉर्ड, issuer: पटवारी या तहसील दफ़्तर}
    job_card: {name: मनरेगा जॉब कार्ड, issuer: ग्राम पंचायत}

  scheme:
    ignoaps:
      name: वृद्धावस्था पेंशन (इंदिरा गांधी राष्ट्रीय)
      benefit: हर महीने पेंशन, सीधे आपके अपने बैंक खाते में। ज़्यादातर राज्य इसमें अपनी तरफ़ से और रकम जोड़ते हैं।
      apply_at: ग्राम पंचायत, या ब्लॉक विकास दफ़्तर
    ignwps:
      name: विधवा पेंशन (इंदिरा गांधी राष्ट्रीय)
      benefit: ग़रीब परिवार की विधवा महिलाओं के लिए हर महीने पेंशन, सीधे उनके अपने खाते में।
      apply_at: ग्राम पंचायत, या ब्लॉक विकास दफ़्तर
    igndps:
      name: दिव्यांग पेंशन (इंदिरा गांधी राष्ट्रीय)
      benefit: गंभीर दिव्यांगता वाले लोगों के लिए हर महीने पेंशन। कई राज्य अपनी तरफ़ से और रकम देते हैं।
      apply_at: ग्राम पंचायत, या ब्लॉक विकास दफ़्तर
    pm_kisan:
      name: पी एम किसान सम्मान निधि
      benefit: साल में छह हज़ार रुपये, दो-दो हज़ार की तीन किस्तों में, सीधे बैंक खाते में।
      apply_at: कॉमन सर्विस सेंटर, या गाँव के पटवारी
    ration_aay:
      name: अंत्योदय राशन कार्ड
      benefit: पूरे परिवार के लिए हर महीने पैंतीस किलो अनाज, दो या तीन रुपये किलो, चाहे परिवार कितना भी बड़ा हो।
      apply_at: ब्लॉक खाद्य आपूर्ति दफ़्तर
    ration_phh:
      name: प्राथमिकता वाला राशन कार्ड
      benefit: हर व्यक्ति को हर महीने पाँच किलो अनाज, दो या तीन रुपये किलो।
      apply_at: ब्लॉक खाद्य आपूर्ति दफ़्तर
    pmay_g:
      name: प्रधानमंत्री आवास योजना (ग्रामीण)
      benefit: पक्का मकान बनाने के लिए मदद, काम के साथ-साथ किस्तों में। शौचालय और मज़दूरी के लिए जॉब कार्ड भी।
      apply_at: ग्राम पंचायत
    pmuy:
      name: प्रधानमंत्री उज्ज्वला योजना
      benefit: घर की महिला के नाम पर मुफ़्त गैस कनेक्शन, जमा राशि और पहला सिलेंडर सरकार की तरफ़ से।
      apply_at: कोई भी गैस एजेंसी, या कॉमन सर्विस सेंटर
    pmjay:
      name: आयुष्मान भारत (पी एम जन आरोग्य योजना)
      benefit: पूरे परिवार के लिए साल में पाँच लाख रुपये तक मुफ़्त इलाज, किसी भी जुड़े सरकारी या निजी अस्पताल में।
      apply_at: कॉमन सर्विस सेंटर, या किसी जुड़े अस्पताल का हेल्प डेस्क
    pmmvy:
      name: प्रधानमंत्री मातृ वंदना योजना
      benefit: पहले बच्चे के समय पाँच हज़ार रुपये, किस्तों में, ताकि उन दिनों की मज़दूरी का नुक़सान पूरा हो सके।
      apply_at: आंगनवाड़ी केंद्र, या पास का अस्पताल
    jsy:
      name: जननी सुरक्षा योजना
      benefit: अस्पताल में प्रसव कराने पर नक़द मदद, और आने-जाने का ख़र्च।
      apply_at: आंगनवाड़ी केंद्र, या सरकारी अस्पताल
    mgnrega:
      name: मनरेगा जॉब कार्ड
      benefit: साल में सौ दिन के काम की गारंटी, तय मज़दूरी पर, गाँव से पाँच किलोमीटर के भीतर।
      apply_at: ग्राम पंचायत
    sukanya:
      name: सुकन्या समृद्धि योजना
      benefit: बेटी के नाम बचत खाता, ऊँचे ब्याज पर, और जमा रकम पर टैक्स नहीं। ढाई सौ रुपये से खुल जाता है।
      apply_at: कोई भी डाकघर, या ज़्यादातर बैंक
    apy:
      name: अटल पेंशन योजना
      benefit: साठ साल की उम्र से हर महीने पक्की पेंशन, एक से पाँच हज़ार तक। बाद में पति या पत्नी को मिलती रहती है।
      apply_at: जिस बैंक में आपका खाता है
    jan_dhan:
      name: प्रधानमंत्री जन धन खाता
      benefit: बिना न्यूनतम रकम का बैंक खाता, मुफ़्त डेबिट कार्ड, दुर्घटना बीमा, और छह महीने बाद ओवरड्राफ़्ट।
      apply_at: कोई भी बैंक शाखा, या गाँव का बैंक मित्र
    pmsby:
      name: प्रधानमंत्री सुरक्षा बीमा योजना
      benefit: साल के बीस रुपये में दो लाख का दुर्घटना बीमा, पैसा अपने आप खाते से कट जाता है।
      apply_at: जिस बैंक में आपका खाता है
    pmjjby:
      name: प्रधानमंत्री जीवन ज्योति बीमा योजना
      benefit: साल के कुछ सौ रुपये में दो लाख का जीवन बीमा, पैसा अपने आप खाते से कट जाता है।
      apply_at: जिस बैंक में आपका खाता है
    kcc:
      name: किसान क्रेडिट कार्ड
      benefit: खेती के ख़र्च के लिए कम ब्याज पर कर्ज़, ज़रूरत के हिसाब से निकाल सकते हैं।
      apply_at: कोई भी बैंक शाखा, या सहकारी समिति
    nfbs:
      name: राष्ट्रीय पारिवारिक लाभ योजना
      benefit: कमाने वाले के गुज़र जाने पर ग़रीब परिवार को एक बार में बीस हज़ार रुपये।
      apply_at: ग्राम पंचायत, या ब्लॉक विकास दफ़्तर
    pmfby:
      name: प्रधानमंत्री फ़सल बीमा योजना
      benefit: फ़सल ख़राब होने पर मुआवज़ा, किसान का हिस्सा बहुत कम प्रीमियम।
      apply_at: कोई भी बैंक, कॉमन सर्विस सेंटर, या बीमा एजेंट


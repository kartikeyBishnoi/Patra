    chat_hint: अपना सवाल लिखिए
    chat_greet: किसी योजना या कागज़ के बारे में पूछिए।
    chat_eg1: राशन कार्ड कैसे बनवाएँ?
    chat_eg2: आय प्रमाणपत्र क्या है?
    chat_eg3: वृद्धावस्था पेंशन कहाँ से मिलेगी?
    about_title: इस ऐप के बारे में
    about_1: हर जवाब हर योजना के छपे हुए नियमों से निकाला जाता है। किसी भी नतीजे के नीचे "यह कैसे निकाला" दबाकर पूरे कदम देख सकते हैं।
    about_2: कुछ भी इंटरनेट पर नहीं भेजा जाता और कुछ भी सेव नहीं होता। पन्ना बंद करते ही सब मिट जाता है।
    about_3: यहाँ दिए नियम आसान करके लिखे गए हैं और राज्य के हिसाब से बदलते हैं। भरोसा करने से पहले अपनी ग्राम पंचायत में पुष्टि कर लें।
    assist_privacy_1: कुछ भी इंटरनेट पर नहीं भेजा जाता।
    assist_privacy_2: पन्ना बंद करते ही कुछ भी नहीं बचता।
    assist_privacy_3: हम आपका आधार नंबर कभी नहीं पूछते, सिर्फ़ यह कि खाता जुड़ा है या नहीं।
    assist_used_by: इनके लिए ज़रूरी
    assist_papers: कागज़
    assist_none: हमारी सूची की किसी योजना में यह नहीं चाहिए।
    assist_no_route: इसका रास्ता हम नहीं निकाल सके।
    assist_unknown: यह मुझे नहीं पता। मैं सिर्फ़ इस ऐप की योजनाओं और कागज़ों के बारे में बता सकता हूँ।

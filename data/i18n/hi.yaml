  # The four shortcuts, and the caution each one carries.
  how:
    ration_card:
      question: 'राशन कार्ड कैसे बनवाएँ?'
      answer: 'इसी कार्ड से सस्ता अनाज मिलता है, और बाकी ज़्यादातर योजनाएँ भी यही माँगती हैं। ये रहे पड़ाव, सही क्रम में।'
      caution: 'असली कागज़ और हर एक की एक फ़ोटोकॉपी साथ ले जाइए। राशन कार्ड घर के मुखिया के नाम बनता है।'
    income_certificate:
      question: 'आय प्रमाण पत्र कैसे बनवाएँ?'
      answer: 'आमदनी पर जो मना होता है, असल में वह प्रमाण पत्र न होने पर होता है। यह रहा उसे बनवाने का रास्ता।'
      caution: 'यह आम तौर पर छह महीने से एक साल में पुराना हो जाता है, इसलिए जब काम में लेना हो उसी के आसपास बनवाइए।'
    bank_aadhaar_seeding:
      question: 'खाते को आधार से कैसे जोड़ें?'
      answer: 'मुफ़्त है, एक ही चक्कर में हो जाता है, और किसी भी दूसरे काम से ज़्यादा योजनाएँ खोलता है, क्योंकि सीधा पैसा इसी से आता है।'
      caution: 'शाखा से जुड़ने की पर्ची ज़रूर लीजिए। खाता होना और खाता आधार से जुड़ा होना एक बात नहीं है।'
      note: 'ज़्यादातर योजनाओं का पैसा बिना जुड़े खाते में नहीं पहुँचता। सबसे सस्ता काम यही है और यही सबसे ज़्यादा पैसा रोकता है।'
    old_age_pension:
      question: 'बुढ़ापा पेंशन कैसे मिलेगी?'
      answer: 'गरीबी रेखा से नीचे वाले घरों के साठ साल से ऊपर के लोगों को हर महीने पैसा, सीधे आधार से जुड़े खाते में।'
      caution: 'अर्जी ग्राम पंचायत में दीजिए। अगर आप पहले से कोई और सरकारी पेंशन ले रहे हैं तो यह साथ में नहीं मिलेगी।'


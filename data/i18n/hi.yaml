    school_certificate: {name: स्कूल छोड़ने का प्रमाणपत्र, issuer: जिस स्कूल में आख़िरी बार पढ़े}
    electricity_bill: {name: बिजली का बिल, issuer: बिजली दफ़्तर}
    voter_id: {name: वोटर आई डी कार्ड, issuer: बूथ अधिकारी या चुनाव दफ़्तर}
    pan_card: {name: पैन कार्ड, issuer: पैन सेवा केंद्र}
    ration_card: {name: राशन कार्ड, issuer: ब्लॉक खाद्य आपूर्ति दफ़्तर}
    domicile_certificate: {name: निवास प्रमाणपत्र, issuer: तहसील दफ़्तर}
    income_certificate: {name: आय प्रमाणपत्र, issuer: तहसील दफ़्तर}
    caste_certificate: {name: जाति प्रमाणपत्र, issuer: तहसील दफ़्तर}
    bank_account: {name: बैंक खाता, issuer: कोई भी बैंक या गाँव का बैंक मित्र}
    bank_aadhaar_seeding: {name: बैंक खाते से आधार जोड़ना, issuer: अपनी बैंक शाखा}
    disability_certificate: {name: दिव्यांगता प्रमाणपत्र, issuer: ज़िला अस्पताल}

  # The four shortcuts, and the caution each one carries.
  how:
    ration_card:
      question: 'रेशन कार्ड कसे काढावे?'
      answer: 'याच कार्डावर स्वस्त धान्य मिळते, आणि बाकीच्या बहुतेक योजनाही हेच मागतात. हे टप्पे, योग्य क्रमाने.'
      caution: 'मूळ कागद आणि प्रत्येकाची एक प्रत सोबत न्या. रेशन कार्ड घराच्या प्रमुखाच्या नावावर निघते.'
    income_certificate:
      question: 'उत्पन्नाचा दाखला कसा काढावा?'
      answer: 'उत्पन्नावरून जो नकार मिळतो तो खरे तर दाखला नसल्याचा असतो. हा त्याचा मार्ग.'
      caution: 'हा साधारण सहा महिने ते वर्षभरात जुना होतो, त्यामुळे प्रत्यक्ष वापरायच्या वेळेजवळच काढा.'
    bank_aadhaar_seeding:
      question: 'खाते आधारशी कसे जोडावे?'
      answer: 'मोफत आहे, एकाच फेरीत होते, आणि इतर कोणत्याही कामापेक्षा जास्त योजना उघडते, कारण थेट पैसे याच मार्गाने येतात.'
      caution: 'शाखेकडून जोडणीची पावती घ्या. खाते असणे आणि ते आधारशी जोडलेले असणे एक नाही.'
      note: 'बहुतेक योजनांचे पैसे न जोडलेल्या खात्यात पोहोचत नाहीत. हे सर्वात स्वस्त काम आहे आणि हेच सर्वाधिक पैसे अडवते.'
    old_age_pension:
      question: 'वृद्धापकाळ निवृत्तिवेतन कसे मिळेल?'
      answer: 'दारिद्र्यरेषेखालील घरांतील साठ वर्षांवरील लोकांना दर महिन्याला पैसे, थेट आधारशी जोडलेल्या खात्यात.'
      caution: 'अर्ज ग्रामपंचायतीत करा. तुम्ही आधीच दुसरे सरकारी निवृत्तिवेतन घेत असाल तर हे सोबत मिळणार नाही.'

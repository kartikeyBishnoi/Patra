  attr:
    age:
      label: वय
      unit: वर्षे
      question: तुमचे वय किती आहे?
    gender:
      label: पुरुष की स्त्री
      question: तुम्ही पुरुष आहात की स्त्री?
      options: {male: पुरुष, female: स्त्री, other: इतर}
    marital_status:
      label: वैवाहिक स्थिती
      question: तुम्ही विवाहित आहात, अविवाहित आहात, की तुमचे पती किंवा पत्नी हयात नाहीत?
      options:
        unmarried: अविवाहित
        married: विवाहित
        widowed: पती किंवा पत्नीचे निधन झाले
        divorced: घटस्फोट झाला
        separated: वेगळे राहत आहोत
    category:
      label: जात प्रवर्ग
      question: तुम्ही कोणत्या जात प्रवर्गात येता?
      options: {general: खुला, obc: इतर मागासवर्ग, sc: अनुसूचित जाती, st: अनुसूचित जमाती}
    disability_percent:
      label: दिव्यांगत्व
      unit: टक्के
      question: दिव्यांगत्व प्रमाणपत्र असल्यास त्यावर किती टक्के लिहिले आहे?
    is_pregnant:
      label: गर्भवती
      question: तुम्ही गर्भवती आहात, किंवा नुकतेच बाळ झाले आहे?
    first_child:
      label: पहिले मूल
      question: हे तुमचे पहिले मूल आहे का?
    has_bank_account:
      label: बँक खाते
      question: तुमच्या स्वतःच्या नावाने बँक खाते आहे का?
    bank_aadhaar_linked:
      label: खाते आधारशी जोडलेले
      question: तुमचे बँक खाते आधारशी जोडलेले आहे का?
    already_receiving_pension:
      label: आधीच पेन्शन
      question: तुम्हाला आधीपासून कोणती सरकारी पेन्शन मिळते का?
    area_type:
      label: गाव की शहर
      question: तुम्ही गावात राहता की शहरात?
      options: {rural: गाव, urban: शहर}
    annual_income:
      label: वार्षिक कौटुंबिक उत्पन्न
      unit: रुपये वर्षाला
      question: तुमच्या संपूर्ण कुटुंबाची वर्षभराची कमाई अंदाजे किती आहे?
    ration_card_type:
      label: रेशन कार्ड
      question: तुमच्या कुटुंबाकडे कोणते रेशन कार्ड आहे?
      options:
        none: रेशन कार्ड नाही
        apl: दारिद्र्यरेषेवरील कार्ड
        phh: प्राधान्य कुटुंब कार्ड
        aay: अंत्योदय कार्ड
    land_acres:
      label: शेतजमीन
      unit: एकर
      question: तुमच्या कुटुंबाकडे किती एकर शेतजमीन आहे?
    cultivates_land:
      label: स्वतः शेती करता
      question: तुमच्या कुटुंबातील कोणी स्वतः शेती करते का?
    owns_pucca_house:
      label: पक्के घर
      question: तुमचे घर विटा आणि सिमेंटचे आहे का, पक्क्या छतासह?
    owns_vehicle:
      label: वाहन
      question: तुमच्या कुटुंबाकडे दुचाकी, कार किंवा ट्रॅक्टर आहे का?
    income_tax_payer:
      label: आयकर भरता
      question: तुमच्या कुटुंबातील कोणी आयकर भरते का?
    govt_employee_in_family:
      label: कुटुंबात सरकारी नोकरी
      question: तुमच्या कुटुंबात कोणाची सरकारी नोकरी आहे का, किंवा सरकारी पेन्शन येते का?
    lpg_connection:
      label: गॅस जोडणी
      question: तुमच्या घरी गॅस जोडणी आहे का?
    breadwinner_died_recently:
      label: कमावत्या व्यक्तीचे निधन
      question: गेल्या तीन वर्षांत तुमच्या कुटुंबातील मुख्य कमावत्या व्यक्तीचे निधन झाले का?
    has_adult_woman:
      label: प्रौढ स्त्री
      question: तुमच्या घरात अठरा वर्षांवरील स्त्री आहे का?
    has_willing_worker:
      label: मजुरीसाठी कोणी
      question: तुमच्या घरातील कोणी प्रौढ गावात रोजंदारीचे काम करेल का?
    someone_has_bank_account:
      label: कोणाचे बँक खाते
      question: तुमच्या घरात कोणाचे बँक खाते आहे का?
    has_widowed_member:
      label: घरात विधवा
      question: तुमच्या घरात कोणी विधवा आहेत का?
    has_disabled_member:
      label: दिव्यांग सदस्य
      question: तुमच्या घरात कोणी दिव्यांग आहे का?
    adult_male_count:
      label: कामाच्या वयाचे पुरुष
      question: तुमच्या घरात अठरा ते साठ वयोगटातील किती पुरुष आहेत?

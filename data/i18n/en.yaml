  trace:
    to: to
    encode: constraint encoding
    encode_head: "{rules} rules and your {facts} answers turned into constraints"
    solve: satisfiability
    solve_yes: All of it together holds
    solve_no: All of it together cannot hold
    solve_yes_d: You qualify.
    solve_no_d: Something the rules demand and something you told us cannot both be true.
    shrink: QuickXPlain (Junker 2004)
    shrink_head: "Narrowed to {n} that already clash"
    compare: one at a time would have taken
    enumerate: MARCO lattice traversal
    enumerate_head: "{r} separate reasons, {c} ways to repair"
    enumerate_d: Every repair has to break every reason, and breaking each one is enough. That is why one search answers both questions.
    repair: correction sets over changeable facts
    repair_none: Nothing could be changed to fix this
    repair_none_d: This rests on facts that cannot change.
    repair_redundant: Every repair meant giving something up
    repair_redundant_d: This scheme is for people who lack something you already have, so it was set aside rather than refused.
    repair_best: cheapest correction set
    repair_best_head: "{n} possible repairs, cheapest shown"
    goal: AND-OR graph
    goal_head: "{want} papers wanted, {have} already held"
    search: minimum-cost AND-OR search
    search_head: "{n} papers to collect"
    order: topological ordering
    order_head: Ordered so nothing is attempted before its inputs exist



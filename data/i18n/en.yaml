  # The four shortcuts, and the caution each one carries.
  how:
    ration_card:
      question: 'How do I get a ration card?'
      answer: 'The card is what gets you subsidised grain, and most other schemes ask to see it. These are the stops in the order that works.'
      caution: 'Take the originals and one photocopy of each. The ration card itself is issued in the name of the head of the family.'
    income_certificate:
      question: 'How do I get an income certificate?'
      answer: 'Almost every refusal over income is really a refusal over the certificate. This is the route to one.'
      caution: 'It usually expires after six months to a year, so get it close to when you will actually use it.'
    bank_aadhaar_seeding:
      question: 'How do I link my account to Aadhaar?'
      answer: 'Free, one visit, and it unblocks more schemes than any other single errand, because every direct payment needs it.'
      caution: 'Ask the branch for the seeding confirmation slip. Having the account is not the same as having it seeded.'
      note: 'Money from most schemes will not reach an unlinked account. This is the single cheapest thing that blocks the most payments.'
    old_age_pension:
      question: 'How do I get the old age pension?'
      answer: 'A monthly payment for people over sixty in below-poverty-line households, paid into a seeded bank account.'
      caution: 'Apply at the gram panchayat. If you already draw another government pension you cannot hold this one as well.'
